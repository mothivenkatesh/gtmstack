<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GTMstack · Cursor for GTM</title>
<meta name="description" content="Preview how developers react to your go-to-market copy before you launch, then mine real audience language to sharpen every message." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  /* ── Frappe Design System tokens (light surface + dark sidebar) ── */
  :root{
    --ds-font-sans:'Geist Variable','Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --ds-font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ds-bg-app:#F8F8F8; --ds-bg-card:#FFFFFF;
    --ds-text-strong:#171717; --ds-text-main:#383838; --ds-text-muted:#6B6B6B; --ds-text-faint:#707070;
    --ds-border-subtle:#E2E2E2;
    --ds-sidebar-bg:#0F0F0F; --ds-sidebar-panel:#1C1C1C; --ds-sidebar-border:#232323;
    --ds-sidebar-text-strong:#F8F8F8; --ds-sidebar-text:#999999; --ds-sidebar-text-muted:#707070;
    --ds-radius-control:8px; --ds-radius-card:12px; --ds-radius-pill:9999px;
    --ds-space-1:4px; --ds-space-2:8px; --ds-space-3:12px; --ds-space-4:16px; --ds-space-5:20px; --ds-space-6:24px; --ds-space-8:32px; --ds-space-10:40px;
    --ds-grid-columns:12; --ds-grid-gutter:24px; --ds-grid-margin:24px;
    --ds-content-narrow:760px; --ds-content-default:1280px; --ds-content-wide:1500px;
    --ds-font-size-12:12px; --ds-line-height-12:16px;
    --ds-font-size-14:14px; --ds-line-height-14:20px;
    --ds-font-size-16:16px; --ds-line-height-16:24px;
    --ds-font-size-20:20px; --ds-line-height-20:28px;
    --ds-icon-size-sm:20px; --ds-icon-size-md:24px;
    --ds-control-height-sm:32px; --ds-control-height-md:36px; --ds-control-height-lg:44px;
    --ds-accent:#6846E3; --ds-accent-2:#0070CC; --ds-accent-soft:#F0EBFF;
    --ds-status-info:#0070CC; --ds-status-info-soft:#F2F9FF;
    --ds-status-success:#137949; --ds-status-success-soft:#F2FDF4;
    --ds-status-warning:#B35309; --ds-status-warning-soft:#FDFAED;
    --ds-status-danger:#CC2929; --ds-status-danger-soft:#FFF7F7;
    --ds-focus-ring:0 0 0 3px var(--ds-accent-soft);
    --ds-shadow-card:0 1px 2px rgba(23, 23, 23, 0.05);
    --ds-shadow-overlay:0 16px 40px rgba(23, 23, 23, 0.16);

    --surface-white:var(--ds-bg-card); --surface-cards:var(--ds-bg-card);
    --surface-gray-1:var(--ds-bg-app); --surface-gray-2:#F3F3F3; --surface-gray-3:#EDEDED; --surface-gray-4:#E2E2E2;
    --surface-blue-1:#F2F9FF; --surface-blue-2:#f2f9ff;
    --surface-green-1:#F2FDF4; --surface-red-1:#FFF7F7; --surface-amber-1:#FDFAED; --surface-violet-1:#F0EBFF;
    --ink-gray-9:var(--ds-text-strong); --ink-gray-8:var(--ds-text-main); --ink-gray-7:#525252; --ink-gray-6:#525252;
    --ink-gray-5:var(--ds-text-muted); --ink-gray-4:var(--ds-text-faint); --ink-gray-3:#707070;
    --ink-blue-2:var(--ds-accent-2); --ink-green-2:#137949; --ink-red-3:#CC2929; --ink-amber-2:#B35309; --ink-violet-1:var(--ds-accent);
    --outline-gray-1:#EDEDED; --outline-gray-2:var(--ds-border-subtle); --outline-gray-3:#C7C7C7; --outline-gray-4:#999999;
    --outline-blue-1:#bfdbfe; --outline-green-1:#bbf7d0; --outline-red-1:#fecdd3; --outline-amber-1:#fde68a;
    --menu-bar:var(--ds-sidebar-bg); --menu-cards:var(--ds-sidebar-panel); --menu-line:var(--ds-sidebar-border); --menu-ink-9:var(--ds-sidebar-text-strong); --menu-ink-6:var(--ds-sidebar-text); --menu-ink-4:var(--ds-sidebar-text-muted);
    --sidebar-w:224px;
  }

  *{box-sizing:border-box}
  html{font-family:var(--ds-font-sans)}
  body{margin:0;background:var(--surface-gray-1);color:var(--ink-gray-9);font-size:14px;line-height:1.15;
       letter-spacing:.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .mono{font-family:var(--ds-font-mono)}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--outline-gray-3);border-radius:4px}

  /* One UI canonical component layer — must match one-ui/tokens/one-ui.components.css */
  .glass-card{background:var(--ds-bg-card);border:1px solid var(--ds-border-subtle);border-radius:var(--ds-radius-card);box-shadow:var(--ds-shadow-card)}

  /* ── buttons / controls ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-size:13px;font-weight:600;line-height:1;
       min-height:40px;padding:10px 16px;border-radius:var(--ds-radius-control);cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:.14s}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--ink-gray-9);color:#fff}
  .btn-primary:not(:disabled):hover{background:#000}
  .btn-ghost{background:var(--surface-cards);border-color:var(--outline-gray-3);color:var(--ink-gray-8)}
  .btn-ghost:hover{background:var(--surface-gray-2)}
  .btn-lg{min-height:46px;padding:12px 20px;font-size:14px}
  .btn-sm{min-height:32px;padding:6px 12px;font-size:12px}
  .input{width:100%;font-family:inherit;font-size:14px;padding:10px 13px;border:1px solid var(--ds-border-subtle);
         border-radius:var(--ds-radius-control);background:var(--ds-bg-card);color:var(--ds-text-strong);outline:none;transition:.14s}
  .input:focus{border-color:var(--ink-blue-2);box-shadow:0 0 0 3px var(--surface-blue-1)}
  select.input{cursor:pointer;-webkit-appearance:none;appearance:none}
  .copy-area{width:100%;min-height:158px;resize:vertical;font-family:inherit;font-size:14.5px;line-height:1.6;
             padding:14px;border:1px solid var(--outline-gray-3);border-radius:11px;background:var(--surface-white);
             color:var(--ink-gray-9);outline:none;transition:.15s}
  .copy-area:focus{border-color:var(--ink-blue-2);box-shadow:0 0 0 3px var(--surface-blue-1)}
  .seg{display:inline-flex;background:var(--ds-bg-app);border-radius:var(--ds-radius-control);padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:500;color:var(--ink-gray-6);
              padding:6px 11px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .seg button.on{background:var(--surface-cards);color:var(--ink-gray-9);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* ── pills ── */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--ds-radius-pill);font-size:11.5px;font-weight:500;
        line-height:1.15;white-space:nowrap;border:1px solid transparent}
  .pill-blue{background:var(--surface-blue-1);color:var(--ink-blue-2);border-color:var(--outline-blue-1)}
  .pill-green{background:var(--surface-green-1);color:var(--ink-green-2);border-color:var(--outline-green-1)}
  .pill-amber{background:var(--surface-amber-1);color:var(--ink-amber-2);border-color:var(--outline-amber-1)}
  .pill-red{background:var(--surface-red-1);color:var(--ink-red-3);border-color:var(--outline-red-1)}
  .pill-gray{background:var(--surface-gray-2);color:var(--ink-gray-6);border-color:var(--outline-gray-2)}

  /* ── app shell ── */
  .app{min-height:100vh}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--menu-bar);color:var(--menu-ink-6);
           display:flex;flex-direction:column;border-right:1px solid var(--menu-line);z-index:50}
  .side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
  .side-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,#0070CC,#6846E3);
             display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .side-name{font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--menu-ink-9);line-height:1.1}
  .side-name .tag{display:block;font-size:11px;font-weight:500;color:var(--menu-ink-4);letter-spacing:.01em;margin-top:2px}
  .side-nav{flex:1;overflow-y:auto;padding:8px 10px}
  .side-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--menu-ink-4);
              padding:14px 10px 7px}
  .side-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--menu-ink-6);
             font-size:13.5px;font-weight:500;transition:.13s;position:relative}
  .side-item:hover{background:var(--menu-cards);color:var(--menu-ink-9)}
  .side-item.on{background:var(--menu-cards);color:var(--menu-ink-9)}
  .side-item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;
             background:linear-gradient(#0070CC,#6846E3)}
  .side-item .si-ic{flex-shrink:0;color:inherit;opacity:.92}
  .side-item .si-star{margin-left:auto;color:#b35309}
  .side-foot{padding:14px 18px;border-top:1px solid var(--menu-line);font-size:11px;line-height:1.55;color:var(--menu-ink-4)}

  .main{margin-left:var(--sidebar-w);min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:11px;padding:0 28px;
          background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--outline-gray-2)}
  .topbar .tb-ic{width:28px;height:28px;border-radius:7px;background:var(--surface-blue-1);border:1px solid var(--outline-blue-1);
          display:flex;align-items:center;justify-content:center;color:var(--ink-blue-2);flex-shrink:0}
  .topbar .tb-name{font-size:14px;font-weight:600}
  .topbar .tb-desc{font-size:12.5px;color:var(--ink-gray-5)}
  .view{max-width:1000px;margin:0 auto;padding:30px 28px 64px}
  .view-head{margin-bottom:24px}
  .view-h1{font-size:28px;font-weight:700;letter-spacing:0;line-height:1.15;margin:0}
  .view-sub{font-size:15px;color:var(--ink-gray-6);line-height:1.55;margin:11px 0 0;max-width:720px}
  .field-label{font-size:12px;font-weight:600;color:var(--ink-gray-7);margin-bottom:9px;display:block}
  .stack{display:flex;flex-direction:column;gap:20px}
  .note{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface-amber-1);
        border:1px solid var(--outline-amber-1);color:var(--ink-amber-2);font-size:12.5px;line-height:1.55}
  .note.note-blue{background:var(--surface-blue-1);border-color:var(--outline-blue-1);color:var(--ink-blue-2)}
  .errbox{display:flex;gap:12px;padding:16px;border:1px solid var(--outline-red-1);background:var(--surface-red-1);border-radius:12px;color:var(--ink-red-3)}
  .skel{background:var(--surface-gray-2);border-radius:6px;animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .spin{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── persona chips ── */
  .pchips{display:flex;gap:9px;flex-wrap:wrap}
  .pchip{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid var(--outline-gray-3);
         border-radius:10px;background:var(--surface-white);cursor:pointer;transition:.13s;text-align:left}
  .pchip:hover{border-color:var(--outline-gray-4)}
  .pchip.on{background:var(--surface-blue-1);border-color:var(--outline-blue-1)}
  .pchip .pe{font-size:18px;line-height:1}
  .pchip .pn{font-size:13px;font-weight:500;color:var(--ink-gray-8)}
  .pchip.on .pn{color:var(--ink-blue-2)}
  .pchip .pck{color:var(--ink-blue-2);opacity:0;transition:.13s}
  .pchip.on .pck{opacity:1}

  /* ── persona results ── */
  .gauge{display:flex;align-items:center;gap:26px;padding:22px 26px}
  .gauge-num{font-size:48px;font-weight:600;line-height:.95;letter-spacing:-.02em}
  .gauge-bar{height:10px;border-radius:6px;background:var(--surface-gray-2);overflow:hidden}
  .gauge-fill{height:100%;border-radius:6px;transition:width .5s ease}
  .pcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:14px}
  .pcard{padding:17px 18px;display:flex;flex-direction:column;gap:11px}
  .pcard-head{display:flex;align-items:flex-start;gap:11px}
  .pcard-emoji{font-size:25px;line-height:1.1}
  .pcard-name{font-size:14.5px;font-weight:600;color:var(--ink-gray-9)}
  .pcard-tag{font-size:11.5px;color:var(--ink-gray-5);line-height:1.4;margin-top:2px}
  .scorebar{height:7px;border-radius:5px;background:var(--surface-gray-2);overflow:hidden}
  .scorefill{height:100%;border-radius:5px;transition:width .5s ease}
  .score-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-gray-5);font-weight:500}
  .quote{background:var(--surface-gray-1);border-left:3px solid var(--outline-gray-3);border-radius:0 8px 8px 0;
         padding:11px 13px;font-size:13px;line-height:1.55;color:var(--ink-gray-8);font-style:italic}
  .kv{display:flex;gap:9px;font-size:12.5px;line-height:1.5;color:var(--ink-gray-7)}
  .kv-ic{flex-shrink:0;margin-top:1px}
  .kv b{color:var(--ink-gray-9);font-weight:600}

  /* ── extractor results ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:760px){ .kpi-grid{grid-template-columns:repeat(2,1fr)} }
  .kpi{padding:16px;display:flex;flex-direction:column;gap:8px}
  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-label{font-size:11.5px;font-weight:600;color:var(--ink-gray-5)}
  .kpi-value{font-size:23px;font-weight:600;color:var(--ink-gray-9);line-height:1.1}
  .chip{padding:6px;border-radius:7px;background:var(--surface-gray-1);display:inline-flex;color:var(--ink-blue-2)}
  .track{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--outline-gray-3);background:var(--surface-white);
         color:var(--ink-gray-7);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;transition:.15s}
  .track:hover{background:var(--surface-gray-1)}
  .track.on{background:var(--surface-blue-1);border-color:var(--outline-blue-1);color:var(--ink-blue-2);font-weight:500}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--outline-gray-2);flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--outline-gray-3);border-radius:8px;padding:0 10px;background:var(--surface-white)}
  .search input{border:none;outline:none;font-family:inherit;font-size:13px;padding:8px 0;background:transparent;color:var(--ink-gray-9);width:140px}
  .tbody{padding:10px 8px;max-height:56vh;overflow-y:auto}
  .cue{display:flex;gap:14px;padding:7px 12px;border-radius:6px}
  .cue:hover{background:var(--surface-gray-1)}
  .cue-ts{flex-shrink:0;color:var(--ink-blue-2);font-size:12px;width:52px;padding-top:2px}
  .cue-text{color:var(--ink-gray-8);font-size:14px;line-height:1.55}
  .plain{padding:8px 14px;color:var(--ink-gray-8);font-size:14.5px;line-height:1.75;white-space:pre-wrap}
  mark{background:#fdfaed;color:inherit;border-radius:2px;padding:0 1px}

  /* ── home / templates ── */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .home-card{padding:20px;cursor:pointer;display:flex;flex-direction:column;transition:border-color .14s,box-shadow .14s}
  .home-card:hover{border-color:var(--outline-blue-1);box-shadow:0 4px 16px rgba(15,23,42,.06)}
  .home-card:hover .hc-go{color:var(--ink-blue-2)}
  .hc-top{display:flex;align-items:center;gap:11px;margin-bottom:13px}
  .hc-ic{width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,#0070CC,#6846E3);
         display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .hc-cat{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-gray-5)}
  .hc-title{font-size:16px;font-weight:600;color:var(--ink-gray-9);line-height:1.32;margin:0 0 7px}
  .hc-desc{font-size:13px;line-height:1.55;color:var(--ink-gray-6);margin:0;flex:1}
  .hc-apps{display:flex;align-items:center;gap:11px;margin-top:15px}
  .hc-app{display:inline-flex}
  .hc-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--outline-gray-1)}
  .hc-eg{font-size:11.5px;color:var(--ink-gray-5);min-width:0;overflow-wrap:anywhere}
  .hc-eg b{color:var(--ink-gray-7);font-weight:600}
  .hc-go{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
         color:var(--ink-gray-7);transition:.14s;white-space:nowrap}

  /* ── multi-step plays ── */
  .home-sec{margin-top:30px}
  .home-sec-h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-gray-9);margin-bottom:4px}
  .home-sec-h .hs-ic{display:inline-flex;color:var(--ink-violet-1)}
  .home-sec-sub{font-size:12.5px;color:var(--ink-gray-5);margin:0 0 14px;line-height:1.55;max-width:680px}
  .play-card:hover{border-color:var(--ink-violet-1)}
  .play-card .hc-ic{background:linear-gradient(150deg,#6846E3,#6846e3)}
  .play-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-gray-6);
             cursor:pointer;background:none;border:none;padding:0;margin-bottom:16px;font-family:inherit}
  .play-back:hover{color:var(--ink-blue-2)}
  .step{display:flex;gap:14px}
  .step-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
  .step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:12.5px;font-weight:600;flex-shrink:0;background:var(--surface-blue-1);
            color:var(--ink-blue-2);border:1px solid var(--outline-blue-1)}
  .step-dot.err{background:var(--surface-red-1);color:var(--ink-red-3);border-color:var(--outline-red-1)}
  .step-line{flex:1;width:2px;background:var(--outline-gray-2);margin:5px 0;min-height:14px}
  .step-body{flex:1;min-width:0;padding-bottom:22px}
  .step-label{font-size:14px;font-weight:600;color:var(--ink-gray-9)}
  .step-sum{font-size:12.5px;color:var(--ink-gray-6);margin-top:2px;line-height:1.5;overflow-wrap:anywhere}
  .tprev{margin-top:11px;padding:12px 14px;background:var(--surface-gray-1);border:1px solid var(--outline-gray-2);
         border-radius:9px;font-size:13px;line-height:1.65;color:var(--ink-gray-7);white-space:pre-wrap;
         max-height:170px;overflow:auto;overflow-wrap:anywhere}
  /* signals evidence (inside a play step) */
  .ev-chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 13px}
  .ev-list{display:flex;flex-direction:column;gap:9px}
  .ev-post{display:flex;gap:11px;padding:11px 13px;background:var(--surface-gray-1);
           border:1px solid var(--outline-gray-2);border-radius:10px}
  .ev-ic{flex-shrink:0;color:var(--ink-gray-5);margin-top:1px}
  .ev-body{flex:1;min-width:0}
  .ev-meta{font-size:10.5px;color:var(--ink-gray-4);text-transform:uppercase;letter-spacing:.03em;
           margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap}
  .ev-text{font-size:13px;color:var(--ink-gray-7);line-height:1.55;overflow-wrap:anywhere}
  .ev-eng{font-size:11px;color:var(--ink-gray-4);margin-top:5px}
  /* teardown patterns (inside a play step) */
  .td-sum{font-size:13.5px;color:var(--ink-gray-7);line-height:1.6;margin:11px 0 2px}
  .td-facet{margin-top:15px}
  .td-facet-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;

              text-transform:uppercase;color:var(--ink-violet-1);margin-bottom:5px}

  /* reliability: per-insight citations + confidence + thin-evidence flag */

  .td-unv{margin-left:7px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;

  /* trends (agent 14): velocity badge + top-voice rows */

  .tr-voice .vw{color:var(--ink-gray-5);font-size:12px;overflow-wrap:anywhere;min-width:0}
  /* content performance (agent 12): best-time rows + cross-run trend */
  .cp-times{display:flex;flex-direction:column;gap:6px}
  .cp-time{display:flex;gap:9px;font-size:13px;color:var(--ink-gray-7);flex-wrap:wrap}

  .cp-time .cm{color:var(--ink-gray-5);font-size:12px}
  .cp-trend{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-gray-6);margin-top:15px;overflow-wrap:anywhere}
  /* competitor intelligence — frappe-style cards */
  .ci-wrap{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .ci-card{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:10px;padding:17px 19px}

  @media(max-width:720px){ .ci-grid2{grid-template-columns:1fr} }
  .ci-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-gray-5);margin:0 0 13px}

  .ci-thead,.ci-trow{display:grid;grid-template-columns:24px minmax(104px,1.5fr) minmax(88px,1.25fr) 44px 88px;gap:11px;align-items:center;min-width:0}
  .ci-thead{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-gray-4);padding-bottom:9px;border-bottom:1px solid var(--outline-gray-1)}

  .ci-rank{font-size:12px;color:var(--ink-gray-4);font-variant-numeric:tabular-nums}

  .ci-brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-gray-8);min-width:0}
  .ci-brand.you{color:var(--ink-violet-1)}
  .ci-bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci-reach{display:flex;align-items:center;gap:9px;min-width:0}
  .ci-bar{flex:1;height:7px;border-radius:5px;background:var(--surface-gray-3);min-width:20px}
  .ci-bar>i{display:block;height:100%;border-radius:5px;background:var(--ink-violet-1)}
  .ci-pct{font-size:12px;color:var(--ink-gray-7);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
  .ci-num{text-align:right;font-size:12.5px;color:var(--ink-gray-7);font-variant-numeric:tabular-nums}
  .ci-li{justify-self:end;font-size:12.5px;color:var(--ink-gray-7);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}

  .ci-foot{font-size:11.5px;color:var(--ink-gray-4);margin:12px 0 0;line-height:1.5}
  .ci-quad svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}

  .ci-ov-row .vb{color:var(--ink-gray-5);font-size:12px;overflow-wrap:anywhere;min-width:0}
  /* connectors tab */
  .conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:6px}

  /* ── accounts: auth modal + user chip ── */
  .auth-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .auth-card{position:relative;background:#fff;border:1px solid var(--outline-gray-2);border-radius:14px;box-shadow:0 12px 48px rgba(15,23,42,.16);width:100%;max-width:400px;padding:34px 34px 26px}
  .auth-mark{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-gray-9);font-size:15px;margin-bottom:18px}

  .auth-ico{width:46px;height:46px;border-radius:50%;background:var(--surface-violet-1);color:var(--ink-violet-1);display:flex;align-items:center;justify-content:center;margin:0 0 16px}
  .auth-h{font-size:24px;font-weight:600;letter-spacing:-.01em;color:var(--ink-gray-9);margin:0 0 7px}

  .auth-btn{display:flex;align-items:center;justify-content:center;width:100%;height:44px;border:none;border-radius:9px;background:var(--ink-violet-1);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px;transition:.14s;text-decoration:none}
  .auth-btn:hover{background:#6846e3}
  .auth-btn:disabled{opacity:.55;cursor:not-allowed}
  .auth-note{font-size:12px;color:var(--ink-gray-5);line-height:1.5;margin:16px 0 0}
  .auth-err{font-size:12.5px;color:var(--ink-red-3);margin:9px 0 0;line-height:1.45}
  .auth-legal{font-size:11px;color:var(--ink-gray-4);text-align:center;margin:18px 0 0;line-height:1.5}
  .auth-x{position:absolute;top:13px;right:15px;background:none;border:none;color:var(--ink-gray-4);cursor:pointer;font-size:22px;line-height:1}
  .auth-link{color:var(--ink-violet-1);background:none;border:none;font-family:inherit;font-size:13px;cursor:pointer;padding:0;margin-top:12px}
  .auth-runrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--outline-gray-1);font-size:13px}
  .auth-runrow:last-child{border-bottom:none}

  .auth-runrow .rs{color:var(--ink-gray-5);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .auth-runrow .ra{color:var(--ink-gray-4);font-size:11.5px;white-space:nowrap}
  .auth-empty{text-align:center;color:var(--ink-gray-5);font-size:13px;padding:24px 0;line-height:1.6}
  /* user chip + menu in the dark sidebar foot */
  .user-chip{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;cursor:pointer;color:var(--menu-ink-6);padding:5px;border-radius:9px;transition:.13s}

  .user-mono{width:30px;height:30px;border-radius:50%;background:var(--ink-violet-1);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;text-transform:uppercase}
  .user-meta{min-width:0;flex:1}

  .signin-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px;border-radius:9px;background:var(--ink-violet-1);color:#fff;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}

  .user-menu button:hover{background:var(--menu-bar);color:var(--menu-ink-9)}

         margin:22px 0 12px;text-transform:uppercase;letter-spacing:.04em}

  .sec-h .sec-n{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-gray-5)}

        overflow:hidden;background:var(--surface-cards)}

             justify-content:center;color:#fff}

<body>
<div id="root"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.23.1';
import { useState, useMemo, useRef, useEffect } from 'https://esm.sh/preact@10.23.1/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

const API_BASE = location.protocol === 'file:' ? 'http://localhost:5000' : '';

/* Fire-and-forget run logging. The backend saves a row only when the caller is
   signed in (session cookie present); for anyone else it is a no-op. So tools
   can call this unconditionally on a successful result, no auth check needed. */
function recordRun(tool, summary){
  try{
    fetch(`${API_BASE}/api/auth`, {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'run', tool, summary:(summary||'').slice(0,200)})});
  }catch(e){}
}

/* ── icon set: Phosphor via Iconify, REGULAR weight (One UI suite canonical —
      matches Agentic + India). One name→id map drives the whole app. Keep every
      glyph the same regular weight; do not mix in -fill / -bold suffixes. ── */
const ICONS = {
  captions:'ph:closed-captioning', youtube:'ph:youtube-logo', search:'ph:magnifying-glass',
  copy:'ph:copy', download:'ph:download-simple', clock:'ph:clock', type:'ph:text-t',
  list:'ph:list-bullets', zap:'ph:lightning', alert:'ph:warning-circle', check:'ph:check',
  globe:'ph:globe', hash:'ph:hash', film:'ph:film-strip', loader:'ph:spinner-gap',
  plus:'ph:plus', languages:'ph:translate', book:'ph:book-open', pen:'ph:pencil-simple',
  code:'ph:code', target:'ph:target', users:'ph:users', sparkles:'ph:sparkle',
  message:'ph:chat-circle', house:'ph:house',
  arrowLeft:'ph:arrow-left', play:'ph:play',
  wrench:'ph:wrench', cpu:'ph:cpu', github:'ph:github-logo', star:'ph:star',
  arrowRight:'ph:arrow-right', radar:'ph:broadcast', linkedin:'ph:linkedin-logo',
  twitter:'ph:x-logo', refresh:'ph:arrows-clockwise', mapPin:'ph:map-pin',
  externalLink:'ph:arrow-square-out', plug:'ph:plug', userSearch:'ph:user-focus',
  reddit:'ph:reddit-logo', building:'ph:buildings', webhook:'ph:webhooks-logo',
  rss:'ph:rss', sealCheck:'ph:seal-check', upload:'ph:upload-simple',
  mail:'ph:envelope', broom:'ph:broom', chartLine:'ph:chart-line-up',
  minus:'ph:minus', user:'ph:user', signout:'ph:sign-out',
};
const Icon = ({name, size=16, cls=''}) => html`<iconify-icon class=${cls} icon=${ICONS[name]||name} width=${size} height=${size}></iconify-icon>`;

/* ── tool registry + sidebar nav ── */
const TOOLS = {
  home:    {icon:'house',     name:'Home',              desc:'GTM use-case templates, prefilled and ready to run'},
  persona: {icon:'users',     name:'Synthetic Persona', desc:'See how developers react to your copy'},
  extract: {icon:'captions',  name:'YouTube Transcript', desc:'Pull clean text from any YouTube video'},
  signals: {icon:'radar',     name:'Signals',           desc:'The data intelligence layer for AI agents'},
  clean:   {icon:'sealCheck', name:'NoBounce',          desc:'Validate and de-dupe an email list for agents'},
  competitor: {icon:'chartLine', name:'Competitor Intel', desc:'Share of voice vs your competitors'},
  connectors: {icon:'plug',      name:'Connectors',       desc:'Wire your CRM, sequencer, and messaging'},
};
const NAV = ['home', 'persona', 'extract', 'signals', 'clean', 'competitor', 'connectors'];

/* ── persona constants (mirrors api/_personas.py for instant, offline render) ── */
const PERSONAS = [
  {id:'indie',  emoji:'🛠️', name:'The Indie Hacker',          tag:'Shipping a side project on a tight budget'},
  {id:'cto',    emoji:'🚀', name:'The Startup CTO',           tag:'Technical founder, ships under pressure'},
  {id:'agency', emoji:'🧰', name:'The Agency Dev',            tag:'Builds for paying clients on WordPress / Shopify'},
  {id:'infra',  emoji:'🛡️', name:'The Senior Infra Engineer', tag:'Reads the breach postmortem before integrating'},
  {id:'ai',     emoji:'🤖', name:'The AI-Native Builder',     tag:'Wiring up AI agents, wants an agent-ready layer'},
];
const CTYPES = [
  ['landing','Landing page'],['email','Cold email'],['ad','Ad'],['social','Social post'],['sales','Sales line'],
];
const SAMPLE_COPY = "Ship payments in an afternoon, not a sprint.\n\nOne install and a six-line snippet put a working checkout in your app today. No sales call, no sandbox paperwork, no contract to sign first.\n\n• Live in 15 minutes: paste the snippet, drop in your key, take a real payment.\n• Pricing on the page: flat per transaction, no minimums, no 'contact us'.\n• Agent-ready: an MCP endpoint your AI assistant can wire up without reading the docs.\n\nStart free, no card needed. Read the docs, run the example, keep building.";

const tone = s => s>=70 ? 'green' : s>=45 ? 'amber' : 'red';
const toneHex = {green:'#137949', amber:'#B35309', red:'#CC2929'};
const ctypeLabel = c => (CTYPES.find(x=>x[0]===c)||[,c])[1];
const overallNote = o => o>=70
  ? 'Most of your target developers would give this a look. Tighten the lowest-scoring reactions below and you are ready.'
  : o>=45
  ? 'This lands with some developers and loses others. The fixes below are where the points are.'
  : 'Most developers would scroll past this. Start with the fixes below before you launch.';

/* Shared persona result — gauge + reaction cards from one payload. Used by the
   Persona tool and the video-messaging play so both render identically. */
function PersonaResult(d){
  const tn = tone(d.overall);
  return html`
      <div class="stack">
        <div class="glass-card gauge">
          <div class="u-center u-shrink0">
            <div class="gauge-num" style=${/* one-ui-allow: gauge number color from score tone */ `color:${toneHex[tn]}`}>${d.overall}</div>
            <div class="u-fs11 u-cmuted u-mt3">out of 100</div>
          </div>
          <div class="u-grow u-mw210">
            <div class="u-row u-ac u-g8 u-wrap u-mb10">
              <span class=${'pill pill-'+tn+' u-pill-lg'}>${d.verdict}</span>
              <span class="pill pill-gray"><${Icon} name=${d.engine==='ai'?'sparkles':'cpu'} size=12 /> ${d.engine==='ai'?'Live AI reactions':'Built-in model'}</span>
              <span class="pill pill-gray">${ctypeLabel(d.content_type)}</span>
            </div>
            <div class="gauge-bar"><div class="gauge-fill" style=${/* one-ui-allow: gauge bar width + color from score */ `width:${d.overall}%;background:${toneHex[tn]}`}></div></div>
            <div class="u-fs125 u-c6 u-lh155 u-mt10">${overallNote(d.overall)}</div>
          </div>
        </div>

        <div class="pcard-grid">
          ${d.results.map(r=>{ const t=tone(r.score); return html`
            <div class="glass-card pcard">
              <div class="pcard-head">
                <span class="pcard-emoji">${r.emoji}</span>
                <div class="u-grow0">
                  <div class="pcard-name">${r.name}</div>
                  <div class="pcard-tag">${r.tagline}</div>
                </div>
                <span class=${'pill pill-'+t}>${r.verdict}</span>
              </div>
              <div>
                <div class="scorebar u-mb5"><div class="scorefill" style=${/* one-ui-allow: fit-score bar width + color */ `width:${r.score}%;background:${toneHex[t]}`}></div></div>
                <div class="score-meta"><span>Fit score</span><span class="mono" style=${/* one-ui-allow: score number color from tone */ `color:${toneHex[t]};font-weight:600`}>${r.score}/100</span></div>
              </div>
              <div class="quote" style=${/* one-ui-allow: quote accent border from tone */ `border-left-color:${toneHex[t]}`}>${r.reaction}</div>
              <div class="kv"><span class="kv-ic u-cgreen"><${Icon} name="check" size=15 /></span>
                <div><b>What landed:</b> ${r.worked}</div></div>
              <div class="kv"><span class="kv-ic u-camber"><${Icon} name="wrench" size=14 /></span>
                <div><b>Biggest fix:</b> ${r.fix}</div></div>
            </div>`; })}
        </div>

        <p class="u-fnote">
          Reactions are simulated to help you sharpen copy, not a substitute for real users.
          Connect an AI key to upgrade from the built-in model to live reactions.
        </p>
      </div>`;
}

/* Platform -> [icon name, label]. Used by play steps that render a footprint. */
const PLAT_META = {
  github:['github','GitHub'], x:['twitter','X'], linkedin:['linkedin','LinkedIn'],
  reddit:['reddit','Reddit'], youtube:['youtube','YouTube'],
};

/* Official logos, no key, no build: Clearbit by domain, falling back to a Google
   favicon, then hiding if both miss. Brand names map to a best-guess .com. */
const domainOf = (brand) => (brand||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'') + '.com';
function Logo(domain, size){
  size = size || 18;
  return html`<img class="brand-logo" width=${size} height=${size} alt=""
    src=${'https://logo.clearbit.com/' + domain}
    onError=${e=>{ const t=e.target;
      if(!t.dataset.fb){ t.dataset.fb='1'; t.src='https://www.google.com/s2/favicons?domain='+domain+'&sz=64'; }
      else { t.classList.add('u-invisible'); } }} />`;
}

/* Renders the 'signals' step of a play: which platforms answered, plus the
   posts the next step actually reasoned over (so the teardown is auditable). */
function SignalsEvidence(o){
  const ev = (o.evidence||[]).slice(0,6);
  return html`
    <div class="u-mt4">
      <div class="ev-chips">
        ${(o.platform_status||[]).map(p=>{ const m=PLAT_META[p.platform]||[null,p.platform];
          const ok=p.status==='ok'; return html`
          <span class=${'pill '+(ok?'pill-green':'pill-gray')} title=${p.note||''}>
            ${m[0]&&html`<${Icon} name=${m[0]} size=12 />`} ${m[1]}${ok?'':' · not connected'}</span>`; })}
      </div>
      <div class="ev-list">
        ${ev.map(p=>{ const m=PLAT_META[p.platform]||['globe',p.platform];
          const eng=(p.engagement||[]).map(e=>`${e.value} ${e.label}`).join(' · '); return html`
          <div class="ev-post">
            <span class="ev-ic"><${Icon} name=${m[0]} size=16 /></span>
            <div class="ev-body">
              <div class="ev-meta"><span>${m[1]} · ${p.kind}</span>${p.ago&&html`<span>${p.ago}</span>`}</div>
              <div class="ev-text">${p.text}</div>
              ${eng&&html`<div class="ev-eng">${eng}</div>`}
            </div>
          </div>`; })}
      </div>
    </div>`;
}

/* Renders the 'teardown' step: the repeatable patterns drawn from the posts. */
/* Shared reliability rendering for the content agents (13 teardown, 14 trends):
   a confidence pill, and grounded facets where every insight shows the posts it
   cites. An uncited insight is marked 'unverified' rather than passed off. */
function citesRow(ev){
  return (ev&&ev.length) ? html`<div class="td-cites">
    ${ev.map(e=>html`<span class="td-cite" title=${e.snippet||''}>#${e.n} ${e.platform}</span>`)}
  </div>` : null;
}
function confPill(conf){
  const band=(conf&&conf.band)||'';
  return band ? html`<span class=${'pill '+(band==='high'?'pill-green':'pill-gray')} title=${(conf&&conf.basis)||''}>
    <${Icon} name="sealCheck" size=12 /> ${band} confidence</span>` : null;
}
function groundedFacet(label, icon, items){
  return (items&&items.length) ? html`
    <div class="td-facet">
      <div class="td-facet-h"><span class="fi"><${Icon} name=${icon} size=14 /></span>${label}</div>
      <ul class="td-list">${items.map(it=>{ const T=(typeof it==='string')?{text:it,grounded:false,evidence:[]}:it; return html`<li>
        <div class="td-li-body">
          <span class="td-it">${T.text}${T.grounded===false?html`<span class="td-unv" title="No source post cited">unverified</span>`:null}</span>
          ${citesRow(T.evidence)}
        </div>
      </li>`; })}</ul>
    </div>` : null;
}

function TeardownResult(o){
  const conf = o.confidence||{};
  return html`
    <div class="u-mt4">
      <div class="u-row u-g8 u-wrap u-mb2">
        <span class="pill pill-gray"><${Icon} name=${o.engine==='ai'?'sparkles':'cpu'} size=12 /> ${o.engine==='ai'?'Live AI teardown':'Built-in model'}</span>
        ${confPill(conf)}
      </div>
      ${o.summary&&html`<p class="td-sum">${o.summary}</p>`}
      ${conf.thin&&html`<div class="td-thin"><${Icon} name="alert" size=13 /> Thin evidence (${conf.basis}). Treat these as directional, not verified.</div>`}
      ${groundedFacet('Hooks that recur','zap',o.hooks)}
      ${groundedFacet('Formats they lean on','list',o.formats)}
      ${groundedFacet('Themes they own','hash',o.themes)}
      ${o.cadence&&html`<div class="td-cadence"><${Icon} name="clock" size=14 /> ${o.cadence}</div>`}
      ${o.steal&&html`<div class="td-steal">
        <div class="td-steal-h"><${Icon} name="target" size=13 /> Steal this week</div>
        <div class="td-steal-t">${o.steal}</div>
      </div>`}
      ${o.audit&&html`<p class="td-audit"><${Icon} name="sealCheck" size=12 /> ${o.audit}</p>`}
      <p class="u-fs115 u-cfaint u-m8t0">
        Every pattern cites the posts it was drawn from. Connect an AI key for the full live teardown.
      </p>
    </div>`;
}

/* Agent 14: trending posts ranked by a shown velocity metric, the voices to
   engage, and a grounded read of what's heating up. */
function TrendResult(o){
  const conf = o.confidence||{};
  const posts = o.trending_posts||[];
  const voices = o.top_voices||[];
  const ic = (plat)=>(PLAT_META[plat]||['globe',plat])[0];
  const eng = (e)=>(e||[]).map(x=>`${x.value} ${x.label}`).join(' · ');
  return html`
    <div class="u-mt4">
      <div class="u-row u-g8 u-wrap u-mb2">
        <span class="pill pill-gray"><${Icon} name=${o.engine==='ai'?'sparkles':'cpu'} size=12 /> ${o.engine==='ai'?'Live AI read':'Built-in model'}</span>
        ${confPill(conf)}
      </div>
      ${o.summary&&html`<p class="td-sum">${o.summary}</p>`}
      ${conf.thin&&html`<div class="td-thin"><${Icon} name="alert" size=13 /> Thin feed (${conf.basis}). Treat as directional.</div>`}
      ${groundedFacet('Topics heating up','zap',o.topics_heating)}
      ${groundedFacet('Where to engage','target',o.suggested_engagements)}
      ${posts.length?html`<div class="td-facet">
        <div class="td-facet-h"><span class="fi"><${Icon} name="rss" size=14 /></span>Trending now · by velocity</div>
        <div class="ev-list">${posts.slice(0,6).map(p=>html`
          <div class="ev-post">
            <span class="ev-ic"><${Icon} name=${ic(p.platform)} size=16 /></span>
            <div class="ev-body">
              <div class="ev-meta">${p.platform}${p.author?(' · @'+p.author):''}${p.velocity!=null?html` · <span class="tr-vel">${p.velocity}/hr</span>`:''}${p.ago?(' · '+p.ago):''}</div>

      </div>

      ${groundedFacet('Format winners','list',o.format_winners)}

      ${times.length?html`<div class="td-facet">

}

/* Competitor intelligence: share of voice, a 2x2 market-positioning plot, and
   the voices shared across competitors. Plain SVG, no chart library. */
function CompeteResult(o){
  const sov=o.share_of_voice||[];
  const pos=o.positioning||[];
  const ic=(plat)=>(PLAT_META[plat]||['globe',plat])[0];
  const fmtDate=(iso)=>{ if(!iso) return '?'; try{ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return '?'; } };
  const dr=o.date_range||{};
  const maxReach=Math.max(1,...sov.map(r=>r.reach_pct));
  const maxVol=Math.max(1,...pos.map(p=>p.x_volume));
  const maxEng=Math.max(1,...pos.map(p=>p.y_engagement));
  const W=400,H=280,pad=40;
  const px=(v)=>pad+(v/maxVol)*(W-2*pad);
  const py=(v)=>H-pad-(v/maxEng)*(H-2*pad);
  const liCell=(r)=>{ const l=r.linkedin||{};
    if(l.followers_h) return html`<span class="ci-li"><span class="lic"><${Icon} name="linkedin" size=13 /></span>${l.followers_h}</span>`;
    if(l.staff_h)     return html`<span class="ci-li muted"><span class="lic"><${Icon} name="linkedin" size=13 /></span>~${l.staff_h} staff</span>`;
    return html`<span class="ci-li muted">—</span>`;
  };
  const anyLi=sov.some(r=>r.linkedin&&(r.linkedin.followers_h||r.linkedin.staff_h));
  return html`
    <div class="ci-wrap">
      <div class="u-row u-g8 u-wrap">
        <span class="pill pill-gray"><${Icon} name="radar" size=12 /> ${(o.brands||[]).length} brands · live read</span>
      </div>
      ${(o.insights||[]).length?html`<div class="ci-card">
        <div class="ci-h"><span class="fi"><${Icon} name="sparkles" size=14 /></span>What this means</div>
        <div class="ci-ins">${o.insights.map(i=>html`
          <div class="ci-ins-row">
            <span class=${'ci-ins-dot '+(i.kind||'')}></span>
            <div class="u-min0"><div class="ci-ins-h">${i.headline}</div><div class="ci-ins-d">${i.detail}</div></div>
          </div>`)}</div>
      </div>`:null}
      <div class="ci-card">
        <div class="ci-h"><span class="fi"><${Icon} name="chartLine" size=14 /></span>Share of voice</div>
        <div class="ci-thead">
          <span></span><span>Brand</span><span>Reach</span><span class="rt">Posts</span><span class="rt">LinkedIn</span>
        </div>
        ${sov.map(r=>html`
          <div class="ci-trow">
            <span class=${'ci-rank'+(r.rank===1?' r1':'')}>${r.rank}</span>
            <span class=${'ci-brand'+(r.you?' you':'')}>${Logo(domainOf(r.brand),16)}<span class="ci-bn">${r.brand}</span></span>
            <span class="ci-reach"><span class="ci-bar"><i style=${/* one-ui-allow: reach bar width from data */ 'width:'+Math.max(3,r.reach_pct/maxReach*100)+'%'}></i></span><span class="ci-pct">${r.reach_pct}%</span></span>
            <span class="ci-num">${r.posts}</span>
            ${liCell(r)}
          </div>`)}
        <p class="ci-foot">Reach is each brand's share of total engagement.${anyLi?'':' LinkedIn follower counts need a connected LinkedIn session.'}</p>
      </div>
      <div class="ci-grid2">
        <div class="ci-card ci-quad">
          <div class="ci-h"><span class="fi"><${Icon} name="target" size=14 /></span>Market positioning</div>
          <svg viewBox=${'0 0 '+W+' '+H} role="img" aria-label="positioning quadrant">
            <line x1=${W/2} y1=${pad-8} x2=${W/2} y2=${H-pad+8} stroke="var(--outline-gray-2)" stroke-width="1"/>
            <line x1=${pad-8} y1=${H/2} x2=${W-pad+8} y2=${H/2} stroke="var(--outline-gray-2)" stroke-width="1"/>
            <text x=${W-pad} y=${pad-14} text-anchor="end" font-size="10" fill="var(--ink-gray-4)">LEADER</text>
            <text x=${pad} y=${pad-14} text-anchor="start" font-size="10" fill="var(--ink-gray-4)">PUNCHING ABOVE</text>
            <text x=${W-pad} y=${H-pad+22} text-anchor="end" font-size="10" fill="var(--ink-gray-4)">AGGRESSIVE</text>
            <text x=${pad} y=${H-pad+22} text-anchor="start" font-size="10" fill="var(--ink-gray-4)">STARTER</text>
            <text x=${W/2} y=${H-4} text-anchor="middle" font-size="9" fill="var(--ink-gray-4)">post volume</text>
            <text x="10" y=${H/2} text-anchor="middle" font-size="9" fill="var(--ink-gray-4)" transform=${'rotate(-90 10 '+(H/2)+')'}>engagement / post</text>
            ${pos.map(p=>{ const x=px(p.x_volume), y=py(p.y_engagement);
              const anchor=x<pad+34?'start':x>W-pad-34?'end':'middle';
              const ly=y<pad+24?y+16:y-11; return html`<g>
              <circle cx=${x} cy=${y} r=${p.you?7:5} fill=${p.you?'var(--ink-violet-1)':'var(--ink-gray-5)'} opacity=${p.you?1:.72}/>
              <text x=${x} y=${ly} text-anchor=${anchor} font-size="10.5" font-weight=${p.you?700:500} fill=${p.you?'var(--ink-violet-1)':'var(--ink-gray-7)'}>${p.brand}</text>
            </g>`; })}
          </svg>
        </div>
        ${(o.overlap||[]).length?html`<div class="ci-card">
          <div class="ci-h"><span class="fi"><${Icon} name="users" size=14 /></span>Shared voices · engage these</div>
          <div class="ci-ov">${o.overlap.map(v=>html`
            <div class="ci-ov-row">
              <span class="ev-ic"><${Icon} name=${ic(v.platform)} size=15 /></span>
              <span class="vn">@${v.author}</span>
              <span class="vb">talks about ${v.brands.join(', ')} · ${v.shared_across} brands</span>
            </div>`)}</div>
        </div>`:null}
      </div>
      <div class="ci-card">
        <div class="ci-h"><span class="fi"><${Icon} name="sealCheck" size=14 /></span>What was scanned</div>
        <p class="ci-prov">${dr.total||0} posts, realtime, ${dr.earliest?html`<b>${fmtDate(dr.earliest)}</b> to <b>${fmtDate(dr.latest)}</b>`:'dates unavailable'}${dr.dated?(' ('+dr.dated+' dated)'):''}. The most-engaged of them:</p>
        <div class="ev-list">${(o.evidence||[]).slice(0,6).map(e=>html`
          <div class="ev-post">
            <span class="ev-ic"><${Icon} name=${ic(e.platform)} size=15 /></span>
            <div class="ev-body">
              <div class="ev-meta">${Logo(domainOf(e.brand),13)} ${e.brand} · ${e.platform}${e.author?(' · @'+e.author):''}${e.ago?(' · '+e.ago):''}</div>
              <div class="ev-text">${e.text}</div>
            </div>
          </div>`)}</div>
        <p class="ci-foot">Built from public posts and mentions across X, GitHub, YouTube, and Reddit, not scraped engager lists. LinkedIn shows audience size from each brand's public company page.</p>
      </div>
    </div>`;
}

/* ════════════════════════ TOOL 1 — PERSONA PREVIEW ════════════════════════ */
function PersonaTool({seed}){
  const [ctype, setCtype]   = useState('landing');
  const [copy, setCopy]     = useState('');
  const [selected, setSel]  = useState(PERSONAS.map(p=>p.id));
  const [loading, setLoad]  = useState(false);
  const [data, setData]     = useState(null);
  const [error, setErr]     = useState(null);

  const toggle = id => setSel(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);

  async function preview(opts = {}){
    const text = (opts.text ?? copy).trim();
    const type = opts.type || ctype;
    const who  = opts.personas || selected;
    if(!text){ setErr('Paste some copy first.'); return; }
    if(who.length===0){ setErr('Pick at least one developer to react.'); return; }
    setLoad(true); setErr(null);
    if(opts.text){ setCopy(text); setCtype(type); }
    try{
      const r = await fetch(`${API_BASE}/api/persona`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text, type, personas:who}),
      });
      const j = await r.json();
      if(!r.ok){ setErr(j.error || 'Request failed.'); setData(null); }
      else setData(j);
    }catch(e){ setErr('Could not reach the engine. Is the local server running on :5000?'); }
    setLoad(false);
  }

  useEffect(()=>{ if(seed && seed.tool==='persona' && seed.payload){
    preview({text:seed.payload.copy, type:seed.payload.ctype||'landing'}); } }, [seed]);
  useEffect(()=>{ if(data && !data.error) recordRun('persona', (data.content_type||'copy')+' reviewed · overall '+(data.overall??'')); }, [data]);

  return html`
  <div class="view">
    <div class="view-head">
      <h1 class="view-h1">Catch the copy that kills your launch, before launch day</h1>
      <p class="view-sub">Paste a headline, email, or ad. Five synthetic developers tell you what they’d think, and the fix worth the most.</p>
    </div>

    <div class="glass-card u-cardbody">
      <label class="field-label">1 · What kind of copy is this?</label>
      <div class="seg u-mb18">
        ${CTYPES.map(([id,label])=>html`
          <button class=${ctype===id?'on':''} onClick=${()=>setCtype(id)}>${label}</button>`)}
      </div>

      <label class="field-label">2 · Paste your copy</label>
      <textarea class="copy-area" placeholder="e.g. Add payments to your app in 15 minutes. One install, six lines of code, live today..."
        value=${copy} onInput=${e=>setCopy(e.target.value)}></textarea>
      <div class="u-mt9 u-fs12 u-cmuted">
        Not sure what to try?
        <a class="u-link"
           onClick=${()=>{setCopy(SAMPLE_COPY);setCtype('landing');}}>Load sample landing-page copy</a>
      </div>

      <label class="field-label u-mt18">3 · Who should react? <span class="u-fw400 u-cmuted">(${selected.length} selected)</span></label>
      <div class="pchips">
        ${PERSONAS.map(p=>html`
          <div class=${'pchip'+(selected.includes(p.id)?' on':'')} onClick=${()=>toggle(p.id)} title=${p.tag}>
            <span class="pe">${p.emoji}</span><span class="pn">${p.name}</span>
            <span class="pck"><${Icon} name="check" size=14 /></span>
          </div>`)}
      </div>

      <div class="u-row u-ac u-g12 u-mt20 u-wrap">
        <button class="btn btn-primary btn-lg" disabled=${loading} onClick=${preview}>
          ${loading ? html`<${Icon} name="loader" size=15 cls="spin" /> Reading reactions` : html`<${Icon} name="sparkles" size=15 /> Preview reactions`}
        </button>
        <span class="u-fs12 u-cmuted">Simulated reactions to sharpen your copy. Not real people.</span>
      </div>
    </div>

    ${error && html`<div class="errbox u-mb18">
      <${Icon} name="alert" size=18 />
      <div><div class="u-fw600 u-mb2">Couldn’t run the preview</div>
      <div class="u-fs13 u-op85">${error}</div></div>
    </div>`}

    ${loading && !data && html`
      <div class="glass-card u-p22 u-mb14 u-row u-g18">
        <div class="skel u-sq48 u-br10"></div>
        <div class="u-grow u-row u-col u-g9 u-jc">
          <div class="skel u-h14 u-w40"></div><div class="skel u-h10 u-w70"></div></div>
      </div>
      <div class="pcard-grid">
        ${[0,1,2].map(()=>html`<div class="glass-card pcard"><div class="skel u-h46 u-w60"></div>
          <div class="skel u-h7 u-w100"></div><div class="skel u-h40 u-w100"></div></div>`)}
      </div>`}

    ${data && PersonaResult(data)}
  </div>`;
}

/* ════════════════════════ TOOL 2 — CONTENT EXTRACTOR ════════════════════════ */
const TRANSLATE_TARGETS = [['','Original'],['hi','Hindi'],['es','Spanish'],['fr','French'],['de','German'],['ja','Japanese'],['zh-Hant','Chinese'],['ar','Arabic'],['pt','Portuguese'],['ru','Russian']];

function ExtractTool({seed}){
  const [url, setUrl] = useState('');
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [view, setView] = useState('stamped');
  const [query, setQuery] = useState('');
  const [tlang, setTlang] = useState('');
  const [copied, setCopied] = useState(false);
  const bodyRef = useRef();

  async function run(opts = {}){
    const u = (opts.url ?? url).trim();
    if(!u){ setError('Paste a YouTube link first.'); return; }
    setLoading(true); setError(null); if(opts.url) setUrl(u);
    const p = new URLSearchParams({ url: u });
    if(opts.lang) p.set('lang', opts.lang);
    if(opts.translate) p.set('translate', opts.translate);
    try{
      const r = await fetch(`${API_BASE}/api/transcript?` + p.toString());
      const j = await r.json();
      if(!r.ok){ setError(j.error || 'YouTube blocked this fetch from the server (common on hosting). Some videos slip through, most need a residential proxy. Try a different video.'); if(!opts.lang && !opts.translate) setData(null); }
      else { setData(j); setQuery(''); if(bodyRef.current) bodyRef.current.scrollTop = 0; }
    }catch(e){ setError('Could not reach the extractor. Is the local server running on :5000?'); }
    setLoading(false);
  }

  useEffect(()=>{ if(seed && seed.tool==='extract' && seed.payload){ run({url:seed.payload.url}); } }, [seed]);
  useEffect(()=>{ if(data && !data.error) recordRun('extract', 'Transcript · '+(data.language||'')+(data.video_id?(' · '+data.video_id):'')); }, [data]);

  const cues = data?.cues || [];
  const q = query.trim().toLowerCase();
  const filtered = useMemo(()=> q ? cues.filter(c=>c.text.toLowerCase().includes(q)) : cues, [cues, q]);
  const plainText = useMemo(()=> filtered.map(c=>c.text).join(' '), [filtered]);

  function hl(text){
    if(!q) return text;
    const parts = text.split(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'ig'));
    return parts.map(p => p.toLowerCase()===q ? html`<mark>${p}</mark>` : p);
  }
  function copyAll(){
    const t = view==='stamped' ? filtered.map(c=>`[${c.ts}] ${c.text}`).join('\n') : plainText;
    navigator.clipboard.writeText(t); setCopied(true); setTimeout(()=>setCopied(false),1400);
  }
  function downloadFile(){
    const t = view==='stamped' ? filtered.map(c=>`[${c.ts}] ${c.text}`).join('\n') : plainText;
    const blob = new Blob([t], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${data.video_id}.${view==='stamped'?'timestamped':'plain'}.txt`;
    a.click(); URL.revokeObjectURL(a.href);
  }

  return html`
  <div class="view">
    <div class="view-head">
      <h1 class="view-h1">Write in your market’s exact words, lifted from any video</h1>
      <p class="view-sub">Paste any link and get a timestamped transcript in seconds, ready to mine for the exact words your market uses.</p>
    </div>

    <div class="glass-card u-cardbody">
      <label class="field-label">Paste a YouTube link</label>
      <div class="u-row u-g10 u-wrap">
        <input class="input u-input-grow" placeholder="A watch, youtu.be, shorts, or embed link (or a video ID)"
          value=${url} onInput=${e=>setUrl(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&run()} />
        <button class="btn btn-primary btn-lg" disabled=${loading} onClick=${()=>run()}>
          ${loading ? html`<${Icon} name="loader" size=15 cls="spin" /> Pulling text` : html`<${Icon} name="captions" size=15 /> Get transcript`}
        </button>
      </div>
      <div class="u-mt10 u-fs12 u-cmuted">
        Try a sample:
        <a class="u-link" onClick=${()=>run({url:'https://www.youtube.com/watch?v=T1Lowy1mnEg'})}>youtube.com/watch?v=T1Lowy1mnEg</a>
      </div>
    </div>

    ${error && html`<div class="errbox u-mb18">
      <${Icon} name="alert" size=18 />
      <div><div class="u-fw600 u-mb2">Couldn’t fetch that transcript</div>
      <div class="u-fs13 u-op85">${error}</div></div>
    </div>`}

    ${loading && !data && html`<div class="kpi-grid u-mb18">
      ${[0,1,2,3].map(()=>html`<div class="glass-card kpi"><div class="skel u-h13 u-w60"></div><div class="skel u-h24 u-w75"></div></div>`)}
    </div>`}

    ${data && html`
      <div class="kpi-grid u-mb16">
        ${[
          ['Words', (data.word_count||0).toLocaleString(), 'type'],
          ['Duration', data.duration_ts, 'clock'],
          ['Segments', (data.cues.length||0).toLocaleString(), 'hash'],
        ].map(([l,v,ic])=>html`<div class="glass-card kpi">
          <div class="kpi-top"><span class="kpi-label">${l}</span><span class="chip"><${Icon} name=${ic} size=14 /></span></div>
          <div class="kpi-value">${v}</div>
        </div>`)}
        <div class="glass-card kpi">
          <div class="kpi-top"><span class="kpi-label">Source</span><span class="chip"><${Icon} name="captions" size=14 /></span></div>
          <div class="u-row u-ac u-g7 u-mt2">
            <span class=${'pill '+(data.kind==='manual'?'pill-green':data.kind==='translated'?'pill-amber':'pill-blue')}>
              ${data.kind==='manual'?'Manual subs':data.kind==='translated'?'Translated':'Auto (ASR)'}
            </span>
            <span class="mono u-fs12 u-c6">${data.code}</span>
          </div>
        </div>
      </div>

      <div class="glass-card u-p1214 u-mb16 u-row u-ac u-g14 u-wrap">
        <span class="u-fs115 u-fw600 u-cmuted">TRACKS</span>
        <div class="u-row u-g7 u-wrap u-grow">
          ${data.tracks.map(t=>html`<button class=${'track'+(t.code===data.code&&!data.translated_to?' on':'')} onClick=${()=>run({lang:t.code})}>
            ${t.code} <span class=${'pill '+(t.kind==='manual'?'pill-green':'pill-blue')+' u-pill-xs'}>${t.kind==='manual'?'manual':'ASR'}</span>
          </button>`)}
        </div>
        <div class="u-row u-ac u-g7">
          <${Icon} name="globe" size=14 />
          <select class="input u-sel-narrow" value=${tlang} onChange=${e=>setTlang(e.target.value)}>
            ${TRANSLATE_TARGETS.map(([c,n])=>html`<option value=${c}>${n}</option>`)}
          </select>
          <button class="btn btn-ghost btn-sm" disabled=${loading||!tlang} onClick=${()=>run({translate:tlang})}>Translate</button>
        </div>
      </div>

      <div class="glass-card">
        <div class="panel-head">
          <div class="seg">
            <button class=${view==='stamped'?'on':''} onClick=${()=>setView('stamped')}><${Icon} name="list" size=13 /> Timestamped</button>
            <button class=${view==='plain'?'on':''} onClick=${()=>setView('plain')}><${Icon} name="type" size=13 /> Plain text</button>
          </div>
          <div class="u-row u-ac u-g8">
            <div class="search"><${Icon} name="search" size=14 />
              <input placeholder="Search…" value=${query} onInput=${e=>setQuery(e.target.value)} /></div>
            <button class="btn btn-ghost btn-sm" onClick=${copyAll}>
              <${Icon} name=${copied?'check':'copy'} size=13 /> ${copied?'Copied':'Copy'}
            </button>
            <button class="btn btn-ghost btn-sm" onClick=${downloadFile}><${Icon} name="download" size=13 /> .txt</button>
          </div>
        </div>
        <div class="tbody" ref=${bodyRef}>
          ${filtered.length===0 && html`<div class="u-empty">No lines match “${query}”.</div>`}
          ${view==='stamped'
            ? filtered.map(c=>html`<div class="cue"><span class="cue-ts mono">${c.ts}</span><span class="cue-text">${hl(c.text)}</span></div>`)
            : html`<div class="plain">${query ? hl(plainText) : plainText}</div>`}
        </div>
      </div>
      <p class="u-note-tight">
        video <span class="mono">${data.video_id}</span> · ${data.tracks.length} track(s) available · fetched for you, no API key
      </p>`}

    ${!data && !loading && !error && html`
      <div class="note note-blue"><${Icon} name="zap" size=16 />
        <div>This reads YouTube’s own caption track, so most spoken-word videos return text in a second or two.
          Uploaded video or audio files are not supported here: those need a separate speech-to-text service.</div>
      </div>`}
  </div>`;
}

/* ════════════════════════ SIGNALS ════════════════════════ */
const SIG_META = {
  github:   {label:'GitHub',   icon:'github',   color:'#1A1A1A'},
  reddit:   {label:'Reddit',   icon:'reddit',   color:'#FF4500'},
  linkedin: {label:'LinkedIn', icon:'linkedin', color:'#0A66C2'},

};
const SIG_ORDER = ['github', 'reddit', 'linkedin', 'x', 'youtube'];
const ACT_ICON = {post:'pen', comment:'message', reply:'message', share:'refresh', repost:'refresh', like:'star',
  commit:'code', pr:'code', issue:'alert', star:'star', fork:'refresh', create:'plus', release:'zap', video:'film'};

/* Three lookup units. Each has its own source set + framing. Person resolves a
   single footprint; company adds the people who work there; keyword is a live
   mentions feed. The source order per unit matches the engine's adapters. */
const UNIT_META = {
  person:  {icon:'userSearch', label:'Person',  sources:['github','reddit','linkedin','x','youtube'],
            ph:'A handle or profile URL (GitHub, Reddit, LinkedIn, X, or YouTube)',
            bulkPh:'One handle or profile URL per line', cta:'Find footprint',
            hint:'Who someone is and what they posted most recently across their channels.'},
  company: {icon:'building',   label:'Company', sources:['github','linkedin','x','reddit','youtube'],
            ph:'A company name or domain, e.g. stripe.com',
            bulkPh:'One company name or domain per line', cta:'Map the company',
            hint:'The company footprint per source, plus the people who work there.'},
  keyword: {icon:'hash',       label:'Keyword', sources:['github','x','reddit','youtube'],
            ph:'A topic or phrase to track, e.g. model context protocol',
            bulkPh:'One topic or phrase per line', cta:'Track mentions',
            hint:'A live mentions feed: what is being said about this right now.'},
};
const initialsOf = s => ((s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('') || '?').toUpperCase();
const joinDots = nodes => nodes.filter(Boolean).flatMap((n,i)=> i ? [html`<span class="dotsep"></span>`, n] : [n]);

/* Classify the search box. Signals keys off a handle or profile URL, never a
   display name (no source resolves "First Last"). A pasted profile link routes
   straight to its one source. Returns one of:
   {kind:'empty'} | {kind:'url', platform, handle} | {kind:'url-unknown'}
   | {kind:'email', value} | {kind:'handle', value} | {kind:'name', value} */
function parseQuery(raw){
  const q = (raw || '').trim();
  if(!q) return {kind:'empty'};
  if(/^https?:\/\//i.test(q) || /\b(?:github|linkedin|reddit|x|twitter|youtube)\.com\//i.test(q)){
    const host = (q.match(/(github|linkedin|reddit|x|twitter|youtube)\.com/i) || [])[1];
    if(host){
      const h = host.toLowerCase();
      const path = q.replace(/^https?:\/\//i,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
      if(h === 'github'){ const m = path.match(/github\.com\/([^\/]+)/i);
             if(m && !/^(orgs|topics|search|marketplace|sponsors|features|about|pricing|collections|trending|notifications|settings|explore)$/i.test(m[1])) return {kind:'url', platform:'github', handle:m[1]}; }
      else if(h === 'linkedin'){ const m = path.match(/\/in\/([^\/]+)/i); if(m) return {kind:'url', platform:'linkedin', handle:decodeURIComponent(m[1])}; }
      else if(h === 'reddit'){ const m = path.match(/\/(?:user|u)\/([^\/]+)/i); if(m) return {kind:'url', platform:'reddit', handle:m[1]}; }
      else if(h === 'youtube'){ const m = path.match(/youtube\.com\/(?:@|c\/|user\/|channel\/)?([^\/]+)/i);
             if(m && !/^(watch|results|feed|playlist|shorts|hashtag|embed)$/i.test(m[1])) return {kind:'url', platform:'youtube', handle:m[1].replace(/^@/,'')}; }
      else { const seg = path.split('/').slice(1).find(Boolean);
             if(seg && !/^(i|home|search|hashtag|explore|messages|notifications)$/i.test(seg)) return {kind:'url', platform:'x', handle:seg.replace(/^@/,'')}; }
    }
    return {kind:'url-unknown'};
  }
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(q)) return {kind:'email', value:q};
  if(!/\s/.test(q)) return {kind:'handle', value:q.replace(/^@/,'')};
  return {kind:'name', value:q};
}

    ${ok && (s.stats||[]).length > 0 && html`<div class="sig-stats">

                <div class="sig-act-main">

                    : a.text}</div>
                  <div class="sig-act-meta">${joinDots([

          : html`<div class="sig-empty"><div class="se-title">Profile found, no recent public posts.</div></div>`)
      : html`<div class="sig-empty">
          <span class="se-ic"><${Icon} name=${emptyMeta[0]} size=17 /></span>
          <div class="se-title">${emptyMeta[1]}</div>

/* Company unit: the people who work there (GitHub org members today). Each row

function PersonRoster({people, onPick}){

/* Keyword unit: one merged, newest-first mentions feed across the sources. */
function FeedList({feed, sources}){
  const errs = (sources||[]).filter(s=>s.status!=='ok');
  return html`
    ${(sources||[]).length>0 && html`<div class="u-row u-g8 u-wrap u-mb12">

              <span class="feed-plat" style=${/* one-ui-allow: platform brand color */ `background:${m.color}`}><${Icon} name=${m.icon} size=15 /></span>
              <div class="feed-main">

/* Render one lookup payload by its unit. */
function UnitResult({payload, onPick}){
  if(payload.unit === 'keyword')
    return html`<${FeedList} feed=${payload.feed||[]} sources=${payload.sources||[]} />`;
  return html`
    <div class="sig-grid">${(payload.sources||[]).map(s=>html`<${SignalCard} s=${s} />`)}</div>
    ${payload.unit === 'company' && html`<${PersonRoster} people=${payload.people||[]} onPick=${onPick} />`}`;
}

/* One row of a bulk job result: a query with its payload, collapsed by default. */
function BulkItem({item, onPick}){
  const [open, setOpen] = useState(false);
  const p = item.payload;
  const sum = item.error ? 'error'
    : p.unit==='keyword' ? `${(p.feed||[]).length} mentions`
    : p.unit==='company' ? `${p.summary.platforms_found}/${p.summary.platforms_searched} sources · ${(p.people||[]).length} people`
    : `${p.summary.platforms_found}/${p.summary.platforms_searched} sources matched`;
  return html`<div class="bulk-item">
    <div class="bulk-head" onClick=${()=>!item.error && setOpen(o=>!o)}>
      <${Icon} name=${item.error?'alert':(open?'minus':'plus')} size=14 />
      <span class="bulk-q">${item.query}</span>
      <span class="bulk-sum">${sum}</span>
    </div>
    ${open && !item.error && html`<div class="bulk-body"><${UnitResult} payload=${p} onPick=${onPick} /></div>`}
    ${item.error && html`<div class="bulk-body u-fs125 u-cred">${item.error}</div>`}
  </div>`;
}

function SignalsTool({seed}){
  const [unit, setUnit]       = useState('person');
  const [query, setQuery]     = useState('');
  const [bulk, setBulk]       = useState(false);
  const [bulkText, setBulkT]  = useState('');
  const [sel, setSel]         = useState({github:true, reddit:true, linkedin:true, x:true});
  const [adv, setAdv]         = useState(false);
  const [handles, setHandles] = useState({github:'', reddit:'', linkedin:'', x:''});
  const [webhook, setWebhook] = useState('');
  const [deliver, setDeliver] = useState(false);
  const [copied, setCopied]   = useState(false);
  const [loading, setLoading] = useState(false);
  const [data, setData]       = useState(null);
  const [job, setJob]         = useState(null);
  const [error, setError]     = useState(null);
  const [conn, setConn]       = useState(null);

  useEffect(()=>{
    fetch(`${API_BASE}/api/signals`).then(r=>r.json()).then(j=>setConn(j.sources||null)).catch(()=>{});
  }, []);

  const um = UNIT_META[unit];
  const chosen = um.sources.filter(s=>sel[s]);
  const isBulk = data && data.items;

  function pickUnit(u){
    if(u === unit) return;
    setUnit(u); setData(null); setJob(null); setError(null); setBulk(false);
    setSel({github:true, reddit:true, linkedin:true, x:true});
    if(u !== 'person') setAdv(false);
  }

  function buildSingleBody(force){
    if(unit === 'person'){
      const advHandle = adv && Object.values(handles).some(v=>v && v.trim());
      const parsed = parseQuery(query);
      if(parsed.kind === 'empty' && !advHandle) return {error:'Enter a handle or a profile URL.'};
      if(parsed.kind === 'name' && !advHandle){ setAdv(true);
        return {error:"That looks like a full name. Signals looks people up by handle or profile link, not by display name. Paste a profile URL, or add exact handles below."}; }
      if(parsed.kind === 'email' && !advHandle)
        return {error:"Email lookup needs an enrichment source we have not wired yet. Paste a profile URL or type a handle for now."};
      if(parsed.kind === 'url-unknown' && !advHandle)
        return {error:"That link is not a supported source. Use a GitHub, Reddit, LinkedIn, X, or YouTube profile URL, or type a handle."};
      if(parsed.kind === 'url')
        return {body:{ unit, query: parsed.handle, sources:[parsed.platform], handles:{[parsed.platform]: parsed.handle}, force }};
      if(chosen.length === 0) return {error:'Pick at least one source to look in.'};
      const q = parsed.kind === 'handle' ? parsed.value : query.trim();
      return {body:{ unit, query:q, sources:chosen, handles: adv ? handles : undefined, force }};
    }
    if(!query.trim()) return {error: unit==='company' ? 'Enter a company name or domain.' : 'Enter a topic or phrase to track.'};
    if(chosen.length === 0) return {error:'Pick at least one source.'};
    return {body:{ unit, query: query.trim(), sources:chosen, force }};
  }

  async function pollJob(id){
    for(let i=0;i<45;i++){
      await new Promise(res=>setTimeout(res, 1100));
      try{ const r = await fetch(`${API_BASE}/api/jobs?id=${id}`); const j = await r.json();
        if(j.status === 'done' || j.status === 'error') return j; }catch(e){}
    }
    return null;
  }

  async function runJob(body){
    setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/jobs`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      let j = await r.json(); setJob(j);
      if(j.status !== 'done' && j.status !== 'error') j = await pollJob(j.id);
      if(!j){ setError('Job timed out. Try a smaller batch or retry.'); setLoading(false); return; }
      setJob(j);
      if(j.status === 'error') setError(j.error || 'Job failed.');
      else setData(j.result);
    }catch(e){ setError('Could not reach the jobs API. Is the local server running on :5000?'); }
    setLoading(false);
  }

  async function run(force=false){
    setError(null); setJob(null);
    if(bulk){
      const queries = bulkText.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!queries.length){ setError('Add at least one query, one per line.'); return; }
      if(chosen.length === 0){ setError('Pick at least one source.'); return; }
      return runJob({ kind:'bulk', unit, queries, sources:chosen, force,
                      webhook: webhook.trim() || undefined });
    }
    const b = buildSingleBody(force);
    if(b.error){ setError(b.error); return; }
    if(webhook.trim())
      return runJob({ kind:'lookup', ...b.body, webhook: webhook.trim() });
    setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/signals`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(b.body)});
      const j = await r.json();
      if(!r.ok) setError(j.error || 'Lookup failed.'); else setData(j);
    }catch(e){ setError('Could not reach Signals. Is the local server running on :5000?'); }
    setLoading(false);
  }

  async function pickPerson(p){
    setUnit('person'); setBulk(false); setAdv(false); setWebhook('');
    setSel({github:p.platform==='github', reddit:p.platform==='reddit',
            linkedin:p.platform==='linkedin', x:p.platform==='x'});
    setQuery(p.handle); setError(null); setJob(null); setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/signals`, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({unit:'person', query:p.handle, sources:[p.platform], handles:{[p.platform]:p.handle}})});
      const j = await r.json();
      if(!r.ok) setError(j.error||'Lookup failed.'); else setData(j);
    }catch(e){ setError('Could not reach Signals.'); }
    setLoading(false);
  }

  /* Pre-fill + run live from a Home template. Fetches with explicit params (like
     pickPerson) so it never waits on async state flushes. */
  async function seedLookup(p){
    const u = p.unit || 'person';
    const srcs = p.sources || UNIT_META[u].sources;
    setUnit(u); setBulk(false); setAdv(false); setWebhook(''); setJob(null); setError(null);
    setSel({github:srcs.includes('github'), reddit:srcs.includes('reddit'),
            linkedin:srcs.includes('linkedin'), x:srcs.includes('x'), youtube:srcs.includes('youtube')});
    setQuery(p.query); setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/signals`, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({unit:u, query:p.query, sources:srcs})});
      const j = await r.json();
      if(!r.ok) setError(j.error||'Lookup failed.'); else setData(j);
    }catch(e){ setError('Could not reach Signals. Is the local server running on :5000?'); }
    setLoading(false);
  }

  useEffect(()=>{ if(seed && seed.tool==='signals' && seed.payload){ seedLookup(seed.payload); } }, [seed]);
  useEffect(()=>{ if(data && !data.error) recordRun('signals', (data.unit||'lookup')+(data.query?(' · '+data.query):'')); }, [data]);

  async function exportResult(fmt){
    let id = job && job.id;
    if(!id){
      const b = buildSingleBody(false);
      if(b.error){ setError(b.error); return; }
      try{
        const r = await fetch(`${API_BASE}/api/jobs`, {method:'POST',
          headers:{'Content-Type':'application/json'}, body: JSON.stringify({kind:'lookup', ...b.body})});
        let j = await r.json();
        if(j.status !== 'done' && j.status !== 'error') j = await pollJob(j.id);
        if(!j || j.status === 'error'){ setError('Export failed.'); return; }
        id = j.id; setJob(j);
      }catch(e){ setError('Export failed.'); return; }
    }
    window.open(`${API_BASE}/api/jobs?id=${id}&format=${fmt}`, '_blank');
  }

  function apiSnippet(){
    const base = API_BASE || location.origin;
    if(bulk){
      const qs = bulkText.split('\n').map(s=>s.trim()).filter(Boolean);
      const body = {kind:'bulk', unit, queries: qs.length?qs:['query-1','query-2'], sources:chosen};
      if(webhook.trim()) body.webhook = webhook.trim();
      return `curl -X POST ${base}/api/jobs \\\n  -H 'Content-Type: application/json' \\\n  -d '${JSON.stringify(body)}'`;
    }
    const wh = webhook.trim();
    const endpoint = wh ? '/api/jobs' : '/api/signals';
    const body = wh ? {kind:'lookup', unit, query: query.trim()||'query', sources:chosen, webhook:wh}
                    : {unit, query: query.trim()||'query', sources:chosen};
    return `curl -X POST ${base}${endpoint} \\\n  -H 'Content-Type: application/json' \\\n  -d '${JSON.stringify(body)}'`;
  }
  function copySnippet(){ navigator.clipboard.writeText(apiSnippet()); setCopied(true); setTimeout(()=>setCopied(false),1400); }

  const summary = data && !isBulk && html`
    <div class="u-fs13 u-c6">
      ${unit==='keyword'
        ? html`<b class="u-c9">${(data.feed||[]).length}</b> live mentions across ${data.summary.platforms_found} of ${data.summary.platforms_searched} sources`
        : html`<b class="u-c9">${data.summary.platforms_found}</b> of ${data.summary.platforms_searched} sources matched${
            unit==='company' ? html` · <b class="u-c9">${data.summary.people_found||0}</b> people` : ''}${
            data.summary.latest_activity_ago ? html` · last seen <b class="u-c9">${data.summary.latest_activity_ago}</b>` : ''}`}
    </div>`;

  return html`
  <div class="view">
    <div class="view-head">
      <div class="u-row u-ac u-g9 u-mb12">
        <span class="pill pill-blue"><${Icon} name="radar" size=12 /> Real-time</span>
        <span class="pill pill-gray"><${Icon} name="cpu" size=12 /> Agent-ready</span>
      </div>
      <h1 class="view-h1">Reach people the moment they do something worth mentioning</h1>
      <p class="view-sub">Look up a person, company, or keyword and get real-time activity across GitHub, Reddit, LinkedIn, X, and YouTube. The same fresh context a human reads or an AI agent calls.</p>
    </div>

    ${conn && html`
      <div class="conn-strip">
        <span class="cs-label">Sources</span>
        ${SIG_ORDER.map(s=>{ const c = conn[s] || {}; const m = SIG_META[s];
          return html`<span class=${'conn' + (c.ready ? ' ready' : '')} title=${c.note || ''}>
            <span class="cn-dot"></span>
