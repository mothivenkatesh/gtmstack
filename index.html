<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GTMstack</title>
<meta name="description" content="Preview how developers react to your go-to-market copy before you launch, then mine real audience language to sharpen every message." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:FILL,GRAD,opsz,wght@0,200,24,300&display=block" rel="stylesheet" />
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  /* ── Frappe Design System tokens (light surface + dark sidebar) ── */
  :root{
    --surface-white:#FFFFFF; --surface-cards:#FFFFFF;
    --surface-gray-1:#F8F8F8; --surface-gray-2:#F3F3F3; --surface-gray-3:#EDEDED; --surface-gray-4:#E2E2E2;
    --surface-blue-1:#F2F9FF; --surface-blue-2:#E6F4FF;
    --surface-green-1:#F2FDF4; --surface-red-1:#FFF7F7; --surface-amber-1:#FDFAED; --surface-violet-1:#F0EBFF;
    --ink-gray-9:#171717; --ink-gray-8:#383838; --ink-gray-7:#525252; --ink-gray-6:#525252;
    --ink-gray-5:#6B6B6B; --ink-gray-4:#707070; --ink-gray-3:#717171;
    --ink-blue-2:#0070CC; --ink-green-2:#137949; --ink-red-3:#CC2929; --ink-amber-2:#B35309; --ink-violet-1:#6846E3;
    --outline-gray-1:#EDEDED; --outline-gray-2:#E2E2E2; --outline-gray-3:#C7C7C7; --outline-gray-4:#999999;
    --outline-blue-1:#A7D7FD; --outline-green-1:#A6EFC0; --outline-red-1:#FDC2C2; --outline-amber-1:#FBDB73;
    --menu-bar:#0F0F0F; --menu-cards:#1C1C1C; --menu-line:#232323; --menu-ink-9:#F8F8F8; --menu-ink-6:#999999; --menu-ink-4:#6B6B6B;
    --sidebar-w:252px;
  }

  /* Circular Std (self-hosted, proprietary, served from /fonts). Book=400,
     Medium=500, Bold=700; a 600 request maps to Bold via CSS font-matching.
     IBM Plex Mono still loads from Google Fonts for the .mono / code styles. */
  @font-face{font-family:'Circular Std';font-weight:400;font-style:normal;font-display:swap;
    src:url('/fonts/CircularStd-Book.woff2') format('woff2')}
  @font-face{font-family:'Circular Std';font-weight:500;font-style:normal;font-display:swap;
    src:url('/fonts/CircularStd-Medium.woff2') format('woff2')}
  @font-face{font-family:'Circular Std';font-weight:700;font-style:normal;font-display:swap;
    src:url('/fonts/CircularStd-Bold.woff2') format('woff2')}

  *{box-sizing:border-box}
  html{font-family:'Circular Std',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
  body{margin:0;background:var(--surface-gray-1);color:var(--ink-gray-9);font-size:14px;line-height:1.15;
       letter-spacing:.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  /* Material Symbols Sharp: line icons, 24px, wght 300, GRAD 200, opsz 24 */
  .msi{font-family:'Material Symbols Sharp';font-weight:normal;font-style:normal;line-height:1;
       letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;
       word-wrap:normal;direction:ltr;vertical-align:-0.125em;
       font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 200,'opsz' 24;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--outline-gray-3);border-radius:4px}

  .glass-card{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:12px}

  /* ── buttons / controls ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-size:14px;font-weight:500;
       border-radius:8px;padding:9px 15px;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--ink-gray-9);color:#fff}
  .btn-primary:not(:disabled):hover{background:#000}
  .btn-ghost{background:var(--surface-cards);border-color:var(--outline-gray-3);color:var(--ink-gray-8)}
  .btn-ghost:hover{background:var(--surface-gray-2)}
  .btn-lg{padding:12px 20px;font-size:14px}
  .btn-sm{padding:6px 11px;font-size:12px}
  .input{width:100%;font-family:inherit;font-size:14px;padding:12px 14px;border:1px solid var(--outline-gray-3);
         border-radius:9px;background:var(--surface-white);color:var(--ink-gray-9);outline:none;transition:.15s}
  .input:focus{border-color:var(--ink-blue-2);box-shadow:0 0 0 3px var(--surface-blue-1)}
  select.input{cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:32px;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23525252' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center}
  select.input:hover{border-color:var(--outline-gray-4)}
  .copy-area{width:100%;min-height:158px;resize:vertical;font-family:inherit;font-size:14px;line-height:1.6;
             padding:14px;border:1px solid var(--outline-gray-3);border-radius:11px;background:var(--surface-white);
             color:var(--ink-gray-9);outline:none;transition:.15s}
  .copy-area:focus{border-color:var(--ink-blue-2);box-shadow:0 0 0 3px var(--surface-blue-1)}
  .seg{display:inline-flex;background:var(--surface-gray-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:500;color:var(--ink-gray-6);
              padding:6px 11px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .seg button.on{background:var(--surface-cards);color:var(--ink-gray-9);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* ── pills ── */
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:9999px;font-size:12px;font-weight:500;
        line-height:1.15;padding:4px 10px;white-space:nowrap;border:1px solid transparent}
  .pill-blue{background:var(--surface-blue-1);color:var(--ink-blue-2);border-color:var(--outline-blue-1)}
  .pill-green{background:var(--surface-green-1);color:var(--ink-green-2);border-color:var(--outline-green-1)}
  .pill-amber{background:var(--surface-amber-1);color:var(--ink-amber-2);border-color:var(--outline-amber-1)}
  .pill-red{background:var(--surface-red-1);color:var(--ink-red-3);border-color:var(--outline-red-1)}
  .pill-gray{background:var(--surface-gray-2);color:var(--ink-gray-6);border-color:var(--outline-gray-2)}

  /* ── app shell ── */
  .app{min-height:100vh}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--menu-bar);color:var(--menu-ink-6);
           display:flex;flex-direction:column;border-right:1px solid var(--menu-line);z-index:50}
  .side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
  .side-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,#0070CC,#6846E3);
             display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .side-name{font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--menu-ink-9);line-height:1.1}
  .side-name .tag{display:block;font-size:12px;font-weight:500;color:var(--menu-ink-4);letter-spacing:.01em;margin-top:2px}
  .side-nav{flex:1;overflow-y:auto;padding:8px 10px}
  .side-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--menu-ink-4);
              padding:14px 10px 7px}
  .side-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--menu-ink-6);
             font-size:14px;font-weight:500;transition:.13s;position:relative}
  .side-item:hover{background:var(--menu-cards);color:var(--menu-ink-9)}
  .side-item.on{background:var(--menu-cards);color:var(--menu-ink-9)}
  .side-item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;
             background:linear-gradient(#0070CC,#6846E3)}
  .side-item .si-ic{flex-shrink:0;color:inherit;opacity:1}
  .side-item .si-star{margin-left:auto;color:#F4B740}
  .side-foot{padding:14px 18px;border-top:1px solid var(--menu-line);font-size:12px;line-height:1.55;color:var(--menu-ink-4)}

  .main{margin-left:var(--sidebar-w);min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:11px;padding:0 28px;
          background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--outline-gray-2)}
  .topbar .tb-ic{width:28px;height:28px;border-radius:7px;background:var(--surface-blue-1);border:1px solid var(--outline-blue-1);
          display:flex;align-items:center;justify-content:center;color:var(--ink-blue-2);flex-shrink:0}
  .topbar .tb-name{font-size:14px;font-weight:600}
  .topbar .tb-desc{font-size:12px;color:var(--ink-gray-5)}
  .view{max-width:1000px;margin:0 auto;padding:30px 28px 64px}
  .view.view-wide{max-width:none}
  .view-head{margin-bottom:24px}
  .view-h1{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.12;margin:0}
  .view-sub{font-size:16px;color:var(--ink-gray-6);line-height:1.55;margin:11px 0 0;max-width:720px}
  .field-label{font-size:12px;font-weight:600;color:var(--ink-gray-7);margin-bottom:9px;display:block}
  .stack{display:flex;flex-direction:column;gap:20px}
  .note{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface-amber-1);
        border:1px solid var(--outline-amber-1);color:var(--ink-amber-2);font-size:12px;line-height:1.55}
  .note.note-blue{background:var(--surface-blue-1);border-color:var(--outline-blue-1);color:var(--ink-blue-2)}
  .errbox{display:flex;gap:12px;padding:16px;border:1px solid var(--outline-red-1);background:var(--surface-red-1);border-radius:12px;color:var(--ink-red-3)}
  .skel{background:var(--surface-gray-2);border-radius:6px;animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .spin{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── persona chips ── */
  .pchips{display:flex;gap:9px;flex-wrap:wrap}
  .pchip{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid var(--outline-gray-3);
         border-radius:10px;background:var(--surface-white);cursor:pointer;transition:.13s;text-align:left}
  .pchip:hover{border-color:var(--outline-gray-4)}
  .pchip.on{background:var(--surface-blue-1);border-color:var(--outline-blue-1)}
  .pchip .pe{font-size:20px;line-height:1}
  .pchip .pn{font-size:14px;font-weight:500;color:var(--ink-gray-8)}
  .pchip.on .pn{color:var(--ink-blue-2)}
  .pchip .pck{color:var(--ink-blue-2);opacity:0;transition:.13s}
  .pchip.on .pck{opacity:1}

  /* ── persona results ── */
  .gauge{display:flex;align-items:center;gap:26px;padding:22px 26px}
  .gauge-num{font-size:20px;font-weight:600;line-height:.95;letter-spacing:-.02em}
  .gauge-bar{height:10px;border-radius:6px;background:var(--surface-gray-2);overflow:hidden}
  .gauge-fill{height:100%;border-radius:6px;transition:width .5s ease}
  .pcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:14px}
  .pcard{padding:17px 18px;display:flex;flex-direction:column;gap:11px}
  .pcard-head{display:flex;align-items:flex-start;gap:11px}
  .pcard-emoji{font-size:20px;line-height:1.1}
  .pcard-name{font-size:14px;font-weight:600;color:var(--ink-gray-9)}
  .pcard-tag{font-size:12px;color:var(--ink-gray-5);line-height:1.4;margin-top:2px}
  .scorebar{height:7px;border-radius:5px;background:var(--surface-gray-2);overflow:hidden}
  .scorefill{height:100%;border-radius:5px;transition:width .5s ease}
  .score-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-gray-5);font-weight:500}
  .quote{background:var(--surface-gray-1);border-left:3px solid var(--outline-gray-3);border-radius:0 8px 8px 0;
         padding:11px 13px;font-size:14px;line-height:1.55;color:var(--ink-gray-8);font-style:italic}
  .kv{display:flex;gap:9px;font-size:12px;line-height:1.5;color:var(--ink-gray-7)}
  .kv-ic{flex-shrink:0;margin-top:1px}
  .kv b{color:var(--ink-gray-9);font-weight:600}

  /* ── extractor results ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:760px){ .kpi-grid{grid-template-columns:repeat(2,1fr)} }
  .kpi{padding:16px;display:flex;flex-direction:column;gap:8px}
  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-label{font-size:12px;font-weight:600;color:var(--ink-gray-5)}
  .kpi-value{font-size:20px;font-weight:600;color:var(--ink-gray-9);line-height:1.1}
  .chip{padding:6px;border-radius:7px;background:var(--surface-gray-1);display:inline-flex;color:var(--ink-blue-2)}
  .track{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--outline-gray-3);background:var(--surface-white);
         color:var(--ink-gray-7);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;transition:.15s}
  .track:hover{background:var(--surface-gray-1)}
  .track.on{background:var(--surface-blue-1);border-color:var(--outline-blue-1);color:var(--ink-blue-2);font-weight:500}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--outline-gray-2);flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--outline-gray-3);border-radius:8px;padding:0 10px;background:var(--surface-white)}
  .search input{border:none;outline:none;font-family:inherit;font-size:14px;padding:8px 0;background:transparent;color:var(--ink-gray-9);width:140px}
  .tbody{padding:10px 8px;max-height:56vh;overflow-y:auto}
  .cue{display:flex;gap:14px;padding:7px 12px;border-radius:6px}
  .cue:hover{background:var(--surface-gray-1)}
  .cue-ts{flex-shrink:0;color:var(--ink-blue-2);font-size:12px;width:52px;padding-top:2px}
  .cue-text{color:var(--ink-gray-8);font-size:14px;line-height:1.55}
  .plain{padding:8px 14px;color:var(--ink-gray-8);font-size:14px;line-height:1.75;white-space:pre-wrap}
  mark{background:#FFF1A8;color:inherit;border-radius:2px;padding:0 1px}

  /* ── home / templates ── */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .home-card{padding:20px;cursor:pointer;display:flex;flex-direction:column;transition:border-color .14s,box-shadow .14s}
  .home-card:hover{border-color:var(--outline-blue-1);box-shadow:0 4px 16px rgba(15,23,42,.06)}
  .home-card:hover .hc-go{color:var(--ink-blue-2)}
  .hc-top{display:flex;align-items:center;gap:11px;margin-bottom:13px}
  .hc-ic{width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,#0070CC,#6846E3);
         display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .hc-cat{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-gray-5)}
  .hc-title{font-size:16px;font-weight:600;color:var(--ink-gray-9);line-height:1.32;margin:0 0 7px}
  .hc-desc{font-size:14px;line-height:1.55;color:var(--ink-gray-6);margin:0;flex:1}
  .hc-apps{display:flex;align-items:center;gap:11px;margin-top:15px}
  .hc-app{display:inline-flex}
  .hc-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--outline-gray-1)}
  .hc-eg{font-size:12px;color:var(--ink-gray-5);min-width:0;overflow-wrap:anywhere}
  .hc-eg b{color:var(--ink-gray-7);font-weight:600}
  .hc-go{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
         color:var(--ink-gray-7);transition:.14s;white-space:nowrap}

  /* ── multi-step plays ── */
  .home-sec{margin-top:30px}
  .home-sec-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-gray-9);margin-bottom:4px}
  .home-sec-h .hs-ic{display:inline-flex;color:var(--ink-violet-1)}
  .home-sec-sub{font-size:12px;color:var(--ink-gray-5);margin:0 0 14px;line-height:1.55;max-width:680px}
  .play-card:hover{border-color:var(--ink-violet-1)}
  .play-card .hc-ic{background:linear-gradient(150deg,#6846E3,#A855F7)}
  .play-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-gray-6);
             cursor:pointer;background:none;border:none;padding:0;margin-bottom:16px;font-family:inherit}
  .play-back:hover{color:var(--ink-blue-2)}
  .step{display:flex;gap:14px}
  .step-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
  .step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:12px;font-weight:600;flex-shrink:0;background:var(--surface-blue-1);
            color:var(--ink-blue-2);border:1px solid var(--outline-blue-1)}
  .step-dot.err{background:var(--surface-red-1);color:var(--ink-red-3);border-color:var(--outline-red-1)}
  .step-line{flex:1;width:2px;background:var(--outline-gray-2);margin:5px 0;min-height:14px}
  .step-body{flex:1;min-width:0;padding-bottom:22px}
  .step-label{font-size:14px;font-weight:600;color:var(--ink-gray-9)}
  .step-sum{font-size:12px;color:var(--ink-gray-6);margin-top:2px;line-height:1.5;overflow-wrap:anywhere}
  .tprev{margin-top:11px;padding:12px 14px;background:var(--surface-gray-1);border:1px solid var(--outline-gray-2);
         border-radius:9px;font-size:14px;line-height:1.65;color:var(--ink-gray-7);white-space:pre-wrap;
         max-height:170px;overflow:auto;overflow-wrap:anywhere}
  /* signals evidence (inside a play step) */
  .ev-chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 13px}
  .ev-list{display:flex;flex-direction:column;gap:9px}
  .ev-post{display:flex;gap:11px;padding:11px 13px;background:var(--surface-gray-1);
           border:1px solid var(--outline-gray-2);border-radius:10px}
  .ev-ic{flex-shrink:0;color:var(--ink-gray-5);margin-top:1px}
  .ev-body{flex:1;min-width:0}
  .ev-meta{font-size:12px;color:var(--ink-gray-4);text-transform:uppercase;letter-spacing:.03em;
           margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap}
  .ev-text{font-size:14px;color:var(--ink-gray-7);line-height:1.55;overflow-wrap:anywhere}
  .ev-eng{font-size:12px;color:var(--ink-gray-4);margin-top:5px}
  /* teardown patterns (inside a play step) */
  .td-sum{font-size:14px;color:var(--ink-gray-7);line-height:1.6;margin:11px 0 2px}
  .td-facet{margin-top:15px}
  .td-facet-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;text-transform:uppercase;
              letter-spacing:.04em;color:var(--ink-gray-5);margin-bottom:8px}
  .td-facet-h .fi{display:inline-flex;color:var(--ink-violet-1)}
  .td-list{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
  .td-list li{display:flex;gap:9px;font-size:14px;line-height:1.55;color:var(--ink-gray-7);overflow-wrap:anywhere}
  .td-list li::before{content:'';flex-shrink:0;width:6px;height:6px;border-radius:50%;
                      background:var(--ink-violet-1);margin-top:6px}
  .td-cadence{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-gray-6);margin-top:15px}
  .td-steal{margin-top:16px;padding:13px 15px;border-radius:11px;
            background:linear-gradient(150deg,rgba(104,70,227,.07),rgba(168,85,247,.07));
            border:1px solid rgba(104,70,227,.22)}
  .td-steal-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;
              text-transform:uppercase;color:var(--ink-violet-1);margin-bottom:5px}
  .td-steal-t{font-size:14px;color:var(--ink-gray-8);line-height:1.6;overflow-wrap:anywhere}
  /* reliability: per-insight citations + confidence + thin-evidence flag */
  .td-li-body{display:flex;flex-direction:column;gap:5px;min-width:0}
  .td-it{overflow-wrap:anywhere}
  .td-unv{margin-left:7px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
          color:var(--ink-gray-5);background:rgba(0,0,0,.05);padding:1px 6px;border-radius:5px;white-space:nowrap}
  .td-cites{display:flex;flex-wrap:wrap;gap:5px}
  .td-cite{font-size:12px;color:var(--ink-violet-1);background:rgba(104,70,227,.07);

  .td-thin{display:flex;align-items:center;gap:7px;font-size:12px;color:#b45309;

  .td-audit{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-gray-5);margin:14px 0 0;overflow-wrap:anywhere}
  /* trends (agent 14): velocity badge + top-voice rows */
  .tr-vel{font-weight:700;color:var(--ink-violet-1)}
  .tr-voices{display:flex;flex-direction:column;gap:8px}

  .tr-voice .vn{font-weight:600;color:var(--ink-gray-8);white-space:nowrap}
  .tr-voice .vw{color:var(--ink-gray-5);font-size:12px;overflow-wrap:anywhere;min-width:0}
  /* content performance (agent 12): best-time rows + cross-run trend */
  .cp-times{display:flex;flex-direction:column;gap:6px}
  .cp-time{display:flex;gap:9px;font-size:14px;color:var(--ink-gray-7);flex-wrap:wrap}
  .cp-time .cw{font-weight:600;color:var(--ink-gray-8);min-width:84px}
  .cp-time .cm{color:var(--ink-gray-5);font-size:12px}
  .cp-trend{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-gray-6);margin-top:15px;overflow-wrap:anywhere}
  /* competitor intelligence — frappe-style cards */
  .ci-wrap{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .ci-card{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:10px;padding:17px 19px}
  .ci-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  @media(max-width:720px){ .ci-grid2{grid-template-columns:1fr} }
  .ci-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-gray-5);margin:0 0 13px}
  .ci-h .fi{color:var(--ink-violet-1);display:inline-flex}
  .brand-logo{border-radius:4px;flex-shrink:0;object-fit:contain;background:#fff;vertical-align:middle}
  .ci-thead,.ci-trow{display:grid;grid-template-columns:24px minmax(104px,1.5fr) minmax(88px,1.25fr) 44px 88px;gap:11px;align-items:center;min-width:0}
  .ci-thead{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-gray-4);padding-bottom:9px;border-bottom:1px solid var(--outline-gray-1)}
  .ci-thead .rt{text-align:right}
  .ci-trow{padding:10px 0;border-bottom:1px solid var(--outline-gray-1);font-size:14px}
  .ci-trow:last-child{border-bottom:none;padding-bottom:0}
  .ci-rank{font-size:12px;color:var(--ink-gray-4);font-variant-numeric:tabular-nums}
  .ci-rank.r1{color:var(--ink-violet-1);font-weight:700}
  .ci-brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-gray-8);min-width:0}
  .ci-brand.you{color:var(--ink-violet-1)}
  .ci-bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci-reach{display:flex;align-items:center;gap:9px;min-width:0}
  .ci-bar{flex:1;height:7px;border-radius:5px;background:var(--surface-gray-3);min-width:20px}
  .ci-bar>i{display:block;height:100%;border-radius:5px;background:var(--ink-violet-1)}
  .ci-pct{font-size:12px;color:var(--ink-gray-7);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
  .ci-num{text-align:right;font-size:12px;color:var(--ink-gray-7);font-variant-numeric:tabular-nums}
  .ci-li{justify-self:end;font-size:12px;color:var(--ink-gray-7);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ci-li.muted{color:var(--ink-gray-4)}
  .ci-li .lic{color:#0A66C2;display:inline-flex;flex-shrink:0}
  .ci-foot{font-size:12px;color:var(--ink-gray-4);margin:12px 0 0;line-height:1.5}
  .ci-quad svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
  .ci-prov{font-size:12px;color:var(--ink-gray-5);margin:0 0 12px;line-height:1.5}
  .ci-ov{display:flex;flex-direction:column;gap:11px}
  .ci-ov-row{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:var(--ink-gray-7);min-width:0}
  .ci-ov-row .vn{font-weight:600;color:var(--ink-gray-8);white-space:nowrap}
  .ci-ov-row .vb{color:var(--ink-gray-5);font-size:12px;overflow-wrap:anywhere;min-width:0}
  /* connectors tab */
  .conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:6px}
  .conn-card{padding:18px;display:flex;flex-direction:column;gap:11px}
  .conn-top{display:flex;align-items:center;justify-content:space-between}
  .conn-ic{color:var(--ink-violet-1);display:inline-flex}
  .conn-cat{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-gray-5)}
  .conn-name{font-size:16px;font-weight:600;color:var(--ink-gray-9);margin:0}
  .conn-btn{align-self:flex-start;gap:8px;opacity:.75;cursor:not-allowed}
  .conn-soon{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-gray-5);background:rgba(0,0,0,.05);padding:1px 6px;border-radius:5px}
  /* competitor intelligence: opinionated insights */
  .ci-ins{display:flex;flex-direction:column;gap:11px}
  .ci-ins-row{display:flex;gap:10px;align-items:flex-start;min-width:0}
  .ci-ins-dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--ink-violet-1)}
  .ci-ins-dot.win{background:var(--ink-green-2)}
  .ci-ins-dot.gap{background:#f59e0b}
  .ci-ins-h{font-weight:600;color:var(--ink-gray-9);font-size:14px;overflow-wrap:anywhere}
  .ci-ins-d{color:var(--ink-gray-6);font-size:12px;line-height:1.5;overflow-wrap:anywhere}

  /* ── accounts: auth modal + user chip ── */
  .auth-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .auth-card{position:relative;background:#fff;border:1px solid var(--outline-gray-2);border-radius:14px;box-shadow:0 12px 48px rgba(15,23,42,.16);width:100%;max-width:400px;padding:34px 34px 26px}
  .auth-mark{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-gray-9);font-size:16px;margin-bottom:18px}
  .auth-mark .m{width:30px;height:30px;border-radius:8px;background:var(--ink-violet-1);color:#fff;display:inline-flex;align-items:center;justify-content:center}
  .auth-ico{width:46px;height:46px;border-radius:50%;background:var(--surface-violet-1);color:var(--ink-violet-1);display:flex;align-items:center;justify-content:center;margin:0 0 16px}
  .auth-h{font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink-gray-9);margin:0 0 7px}
  .auth-sub{font-size:14px;color:var(--ink-gray-5);line-height:1.55;margin:0 0 20px}
  .auth-sub b{color:var(--ink-gray-8)}
  .auth-label{font-size:12px;font-weight:600;color:var(--ink-gray-7);margin:0 0 7px;display:block}
  .auth-input{width:100%;height:44px;border:1px solid var(--outline-gray-3);border-radius:9px;padding:0 13px;font-family:inherit;font-size:14px;color:var(--ink-gray-9);outline:none;transition:.14s;background:#fff}
  .auth-input:focus{border-color:var(--ink-violet-1);box-shadow:0 0 0 3px var(--surface-violet-1)}
  .auth-btn{display:flex;align-items:center;justify-content:center;width:100%;height:44px;border:none;border-radius:9px;background:var(--ink-violet-1);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px;transition:.14s;text-decoration:none}
  .auth-btn:hover{background:#5a3bd0}
  .auth-btn:disabled{opacity:.55;cursor:not-allowed}
  .auth-note{font-size:12px;color:var(--ink-gray-5);line-height:1.5;margin:16px 0 0}
  .auth-err{font-size:12px;color:var(--ink-red-3);margin:9px 0 0;line-height:1.45}
  .auth-legal{font-size:12px;color:var(--ink-gray-4);text-align:center;margin:18px 0 0;line-height:1.5}
  .auth-x{position:absolute;top:13px;right:15px;background:none;border:none;color:var(--ink-gray-4);cursor:pointer;font-size:20px;line-height:1}
  .auth-link{color:var(--ink-violet-1);background:none;border:none;font-family:inherit;font-size:14px;cursor:pointer;padding:0;margin-top:12px}
  .auth-runrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--outline-gray-1);font-size:14px}
  .auth-runrow:last-child{border-bottom:none}
  .auth-runrow .rt{color:var(--ink-gray-9);font-weight:600;text-transform:capitalize}
  .auth-runrow .rs{color:var(--ink-gray-5);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .auth-runrow .ra{color:var(--ink-gray-4);font-size:12px;white-space:nowrap}
  .auth-empty{text-align:center;color:var(--ink-gray-5);font-size:14px;padding:24px 0;line-height:1.6}
  /* user chip + menu in the dark sidebar foot */
  .user-chip{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;cursor:pointer;color:var(--menu-ink-6);padding:5px;border-radius:9px;transition:.13s}
  .user-chip:hover{background:var(--menu-cards)}
  .user-mono{width:30px;height:30px;border-radius:50%;background:var(--ink-violet-1);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;text-transform:uppercase}
  .user-meta{min-width:0;flex:1}
  .user-email{font-size:12px;color:var(--menu-ink-9);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-act{font-size:12px;color:var(--menu-ink-4)}
  .signin-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px;border-radius:9px;background:var(--ink-violet-1);color:#fff;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .signin-btn:hover{background:#5a3bd0}
  .user-menu{position:absolute;bottom:60px;left:14px;right:14px;background:var(--menu-cards);border:1px solid var(--menu-line);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .user-menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--menu-ink-6);padding:11px 14px;font-family:inherit;font-size:14px;cursor:pointer}
  .user-menu button:hover{background:var(--menu-bar);color:var(--menu-ink-9)}

  /* ── live signals ── */
  .conn-strip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px;margin-bottom:16px;
              background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:11px}
  .conn-strip .cs-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-gray-5);margin-right:2px}
  .conn{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:8px;font-size:12px;font-weight:500;
        border:1px solid var(--outline-gray-2);background:var(--surface-gray-1);color:var(--ink-gray-7)}
  .conn .cn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--outline-gray-4)}

           color:var(--ink-gray-7);user-select:none}

  .sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
  .sig-card{display:flex;flex-direction:column;overflow:hidden}
  .sig-card.dim{background:var(--surface-gray-1)}
  .sig-head{display:flex;align-items:flex-start;gap:13px;padding:17px 18px;border-bottom:1px solid var(--outline-gray-2);position:relative}

           display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;letter-spacing:.02em}
  .sig-id{min-width:0;flex:1}
  .sig-plat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
  .sig-name{font-size:16px;font-weight:600;color:var(--ink-gray-9);line-height:1.25;overflow-wrap:anywhere}
  .sig-headline{font-size:12px;color:var(--ink-gray-6);line-height:1.45;margin-top:3px;overflow-wrap:anywhere}
  .sig-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-gray-5);margin-top:7px}
  .sig-meta span{display:inline-flex;align-items:center;gap:3px}
  .sig-stats{display:flex;gap:18px;padding:12px 18px;border-bottom:1px solid var(--outline-gray-2);flex-wrap:wrap}
  .sig-stat{display:flex;flex-direction:column;gap:1px}
  .sig-stat b{font-size:16px;font-weight:600;color:var(--ink-gray-9);font-family:'IBM Plex Mono',monospace}
  .sig-stat span{font-size:12px;color:var(--ink-gray-5)}

  .sig-body{padding:7px 8px;display:flex;flex-direction:column;max-height:344px;overflow-y:auto}
  .sig-act{display:flex;gap:11px;padding:10px 11px;border-radius:8px;transition:.12s}
  .sig-act:hover{background:var(--surface-gray-1)}
  .sig-act-ic{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
              background:var(--surface-gray-2);color:var(--ink-gray-6);margin-top:1px}
  .sig-act-main{min-width:0;flex:1}
  .sig-act-text{font-size:14px;line-height:1.5;color:var(--ink-gray-8);overflow-wrap:anywhere}
  .sig-act-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-gray-5);margin-top:5px}
  .sig-act-meta .dotsep{width:2px;height:2px;border-radius:50%;background:var(--outline-gray-4)}
  .sig-act-eng{display:inline-flex;align-items:center;gap:4px;color:var(--ink-gray-6);font-weight:500}

  .sig-empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px}
  .sig-empty .se-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
                    background:var(--surface-gray-2);color:var(--ink-gray-5)}
  .sig-empty .se-title{font-size:14px;font-weight:600;color:var(--ink-gray-8)}
  .sig-empty .se-note{font-size:12px;color:var(--ink-gray-5);line-height:1.55}
  @media(max-width:560px){ .sig-grid{grid-template-columns:1fr} }

  /* ── signals: units, people roster, keyword feed, delivery, jobs ── */
  .sig-hint{font-size:12px;color:var(--ink-gray-5);margin-top:8px;line-height:1.5}
  .sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-gray-8);
         margin:22px 0 12px;text-transform:uppercase;letter-spacing:.04em}
  .sec-h .sec-ic{display:inline-flex;color:var(--ink-gray-5)}
  .sec-h .sec-n{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-gray-5)}

  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:10px}
  .rost{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--outline-gray-2);
        border-radius:11px;background:var(--surface-cards);transition:.12s;min-width:0}
  .rost:hover{border-color:var(--outline-gray-3);background:var(--surface-gray-1)}
  .rost-ava{width:36px;height:36px;border-radius:9px;flex-shrink:0;overflow:hidden;position:relative;
            display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
  .rost-id{min-width:0;flex:1}
  .rost-name{font-size:14px;font-weight:600;color:var(--ink-gray-9);overflow-wrap:anywhere;line-height:1.2}
  .rost-sub{font-size:12px;color:var(--ink-gray-5);display:inline-flex;align-items:center;gap:4px;margin-top:2px}

  .feed{display:flex;flex-direction:column;gap:0;border:1px solid var(--outline-gray-2);border-radius:12px;
        overflow:hidden;background:var(--surface-cards)}
  .feed-row{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--outline-gray-2)}
  .feed-row:first-child{border-top:none}
  .feed-row:hover{background:var(--surface-gray-1)}
  .feed-plat{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
             justify-content:center;color:#fff}
  .feed-main{min-width:0;flex:1}
  .feed-text{font-size:14px;line-height:1.5;color:var(--ink-gray-8);overflow-wrap:anywhere}
  .feed-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-gray-5);margin-top:6px}
  .feed-meta .feed-au{font-weight:600;color:var(--ink-gray-7)}

  .deliver{margin-top:16px;border:1px solid var(--outline-gray-2);border-radius:12px;overflow:hidden;background:var(--surface-cards)}
  .deliver-h{display:flex;align-items:center;gap:9px;padding:13px 16px;cursor:pointer;font-size:14px;
             font-weight:600;color:var(--ink-gray-8);user-select:none}

  .deliver-b{padding:4px 16px 16px;border-top:1px solid var(--outline-gray-2);display:flex;flex-direction:column;gap:16px}
  .dlv-block .dlv-lab{font-size:12px;font-weight:600;color:var(--ink-gray-7);display:flex;align-items:center;gap:6px;margin:12px 0 7px}

                color:#E8E8E8;white-space:pre;overflow-wrap:normal}
  .code-blk .tok{color:#7FD1B9}
  .copy-mini{position:absolute;top:9px;right:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
             color:#D4D4D4;border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit;cursor:pointer;
             display:inline-flex;align-items:center;gap:5px;transition:.12s}

  .job-strip{display:flex;align-items:center;gap:11px;padding:12px 15px;border:1px solid var(--outline-blue-1);
             background:var(--surface-blue-1);border-radius:11px;margin-bottom:16px;flex-wrap:wrap}
  .job-strip .js-id{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-gray-6)}
  .bulk-item{border:1px solid var(--outline-gray-2);border-radius:12px;margin-bottom:14px;overflow:hidden;background:var(--surface-cards)}
  .bulk-head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
  .bulk-head:hover{background:var(--surface-gray-1)}
  .bulk-q{font-size:14px;font-weight:600;color:var(--ink-gray-9);overflow-wrap:anywhere}
  .bulk-sum{font-size:12px;color:var(--ink-gray-5);margin-left:auto;flex-shrink:0}
  .bulk-body{padding:14px 16px;border-top:1px solid var(--outline-gray-2)}
  @media(max-width:560px){ .sig-grid{grid-template-columns:1fr} .roster{grid-template-columns:1fr} }

  /* ── tables (Airtable/Notion-like grid) ── */
  .tbl-th{position:sticky;top:0;background:var(--surface-cards);z-index:3;cursor:pointer;user-select:none;
          padding:6px;text-align:left;color:var(--ink-gray-5);font-weight:600;white-space:nowrap}
  .tbl-th:hover{background:var(--surface-gray-1)}
  .tbl-td{padding:6px;min-width:0;overflow-wrap:anywhere;border-top:1px solid var(--outline-gray-1);vertical-align:top}
  .cell-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .tbl-grouphead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-gray-1);
                 cursor:pointer;border-top:1px solid var(--outline-gray-2)}
  .tbl-menu{position:absolute;z-index:20;top:calc(100% + 6px);left:0;background:var(--surface-cards);
            border:1px solid var(--outline-gray-2);border-radius:12px;padding:6px;min-width:180px;
            max-height:340px;overflow-y:auto;overscroll-behavior:contain;
            box-shadow:0 0 0 1px rgba(0,0,0,.03),0 4px 10px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.12);
            animation:menuIn .12s ease-out;transform-origin:top}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  .search-mini{width:100%;border:1px solid var(--outline-gray-2);border-radius:6px;padding:3px 6px;
               font-size:12px;font-family:inherit;background:var(--surface-white);color:var(--ink-gray-9)}
  /* in-place cell editor: sized to the cell so clicking does NOT enlarge the row
     (Google Sheets / Airtable behaviour). Small padding, 12px, subtle focus ring. */
  .cell-edit{width:100%;box-sizing:border-box;font-family:inherit;font-size:12px;padding:2px 4px;margin:-1px 0;
             border:1px solid var(--ink-blue-2);border-radius:4px;background:var(--surface-white);
             color:var(--ink-gray-9);outline:none;line-height:1.4}
  textarea.cell-edit{resize:vertical;min-height:46px;line-height:1.45}
  /* every editing surface in the Tables feature stays 12px so clicking a cell
     never jumps the text size (inline editors + the row/field detail modals) */
  .tbl-frame input,.tbl-frame select,.tbl-frame textarea{font-size:12px}
  .tbl-modal .input,.tbl-modal select,.tbl-modal textarea{font-size:12px}
  /* a11y: a visible keyboard focus ring app-wide (was missing) */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [tabindex]:focus-visible, .iconbtn:focus-visible{
    outline:2px solid var(--ink-blue-2); outline-offset:1px; border-radius:5px}
  /* a bare, keyboard-focusable icon button (replaces click-only <span> icons) */
  .iconbtn{background:none;border:none;margin:0;padding:3px;cursor:pointer;color:var(--ink-gray-6);
           display:inline-flex;align-items:center;line-height:0;border-radius:5px}
  .iconbtn:hover{background:var(--surface-gray-2);color:var(--ink-gray-9)}
  .iconbtn:disabled{opacity:.5;cursor:default}

  /* bordered grid: a framed table with row + column separators. The whole table
     context is a uniform 12px per the type spec (cells, headers, list, board). */
  .tbl-frame{border:1px solid var(--outline-gray-2);border-radius:10px;font-size:12px;display:inline-block;min-width:100%;vertical-align:top}
  .board-wrap{font-size:12px}
  /* separate (not collapse): collapse makes sticky headers flicker + drop borders
     on scroll in Chrome; separate + spacing 0 keeps the same look but scrolls clean */
  .tbl-frame table{border-collapse:separate;border-spacing:0}
  .tbl-frame table,.tbl-th,.tbl-td,.list-title,.board-card,.board-card-title{font-size:12px}
  .tbl-th{border-right:1px solid var(--outline-gray-1);border-bottom:1px solid var(--outline-gray-2)}
  .tbl-td{border-right:1px solid var(--outline-gray-1)}
  .tbl-th:last-child, .tbl-td:last-child{border-right:none}
  /* frozen gutter + primary column (Airtable): they stay pinned while the rest
     of the grid scrolls horizontally. Fixed gutter width so the hover swap from
     row number to actions never jitters the column. */
  /* z-index layers: body cells 0, sticky-left body cells 2, header row 3, sticky
     corners 4. Clear separation stops the corner from flickering under scroll. */
  .tbl-actcol{box-sizing:border-box;padding:6px;
              position:sticky;left:0;background:var(--surface-cards);z-index:2}
  th.tbl-actcol{z-index:4}
  .tbl-sticky1{position:sticky;left:64px;background:var(--surface-cards);z-index:2;
               border-right:1px solid var(--outline-gray-1)}
  th.tbl-sticky1{z-index:4}
  /* drag-and-drop reordering indicators */
  .tbl-drop-col{box-shadow:inset 3px 0 0 var(--ink-blue-2)}
  tr.tbl-droprow td{border-top:2px solid var(--ink-blue-2)}
  .tbl-rowdrag{cursor:grab}
  .tbl-rowdrag:active{cursor:grabbing}
  .tbl-th{user-select:none}
  /* column resize grip on the right edge of each header */
  .col-resize{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:6;touch-action:none}
  .col-resize::after{content:"";position:absolute;top:0;right:2px;width:2px;height:100%;background:transparent;transition:background .1s}
  .col-resize:hover::after{background:var(--ink-blue-2)}
  /* row actions are always legible (color, not a near-invisible opacity), and
     darken on row hover; delete goes red on hover */
  .tbl-row-acts{display:inline-flex;gap:6px}
  .tbl-row-acts .iconbtn{color:var(--ink-gray-5)}
  tr:hover .tbl-row-acts .iconbtn{color:var(--ink-gray-8)}
  .tbl-row-acts .acts-del:hover{color:var(--ink-red-3)}
  .tbl-newrow{display:flex;align-items:center;gap:6px;width:100%;padding:8px 12px;color:var(--ink-gray-5);
              cursor:pointer;border:none;border-top:1px solid var(--outline-gray-2);font-size:12px;
              background:none;font-family:inherit;text-align:left}
  .tbl-newrow:hover{background:var(--surface-gray-1);color:var(--ink-gray-8)}
  .tbl-mi{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;
          white-space:nowrap;width:100%;background:none;border:none;font-family:inherit;text-align:left;
          color:var(--ink-gray-8);line-height:1.3}
  .tbl-mi:hover{background:var(--surface-gray-2)}
  .tbl-mi:active{background:var(--surface-gray-3)}
  .tbl-mi-label{display:flex;align-items:center;gap:7px;padding:4px 10px 2px;font-size:11px;font-weight:600;
                text-transform:uppercase;letter-spacing:.04em;color:var(--ink-gray-5)}
  .tbl-mi-sep{height:1px;background:var(--outline-gray-2);margin:5px 0}
  /* the active checkmark sits flush right, like a native menu */
  .tbl-mi .msi:last-child, .tbl-mi iconify-icon:last-child{margin-left:auto;color:var(--ink-blue-2)}
  .tbl-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:flex-start;
               justify-content:center;padding:8vh 16px;z-index:60}
  .tbl-modal{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:14px;
             padding:20px;width:100%;max-width:440px;max-height:80vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .fld{display:block;font-size:12px;color:var(--ink-gray-6);margin-bottom:12px}
  .fld input,.fld select{display:block;width:100%;margin-top:4px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* compact single-row table toolbar (Notion-style) */
  .tbl-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .tbar-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--outline-gray-2);
            border-radius:8px;background:var(--surface-white);color:var(--ink-gray-7);font-size:12px;
            font-family:inherit;cursor:pointer;white-space:nowrap;line-height:1.2}
  .tbar-btn:hover{background:var(--surface-gray-1)}
  .tbar-btn.on{background:var(--surface-blue-1);border-color:var(--outline-blue-1);color:var(--ink-blue-2)}
  /* toolbar controls are UI chrome, not table data, so they sit at the 14px base
     (Table / List / Board / JSON / Group / Fields / Search / New) */
  .tbl-bar .seg button,.tbl-bar .tbar-btn,.tbl-bar .btn,.tbl-bar .search input{font-size:14px}
  .tbl-bar .tbar-btn{padding:6px 10px}
  /* Airtable-style two-pane: inner view sidebar + full-bleed grid */
  .tbl-shell{display:flex;height:calc(100vh - 56px);overflow:hidden}
  .tbl-viewbar{width:212px;flex-shrink:0;border-right:1px solid var(--outline-gray-2);background:var(--surface-gray-1);
               display:flex;flex-direction:column;gap:10px;padding:14px 10px;overflow-y:auto}
  .tbl-vb-title{font-size:15px;font-weight:600;color:var(--ink-gray-9);margin:0;cursor:text;padding:3px 7px;border-radius:6px;
                display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit}
  .tbl-vb-title:hover{background:var(--surface-gray-3)}
  .tbl-vb-search{background:var(--surface-white);border-color:var(--outline-gray-2)}
  .tbl-vb-search input{width:100%}
  .tbl-vb-list{display:flex;flex-direction:column;gap:2px}
  .tbl-vitem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;border:none;background:none;
             font-family:inherit;font-size:14px;color:var(--ink-gray-7);cursor:pointer;text-align:left;width:100%}
  .tbl-vitem:hover{background:var(--surface-gray-3)}
  .tbl-vitem.on{background:var(--surface-blue-1);color:var(--ink-blue-2);font-weight:600}
  .tbl-mainpane{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-white)}
  .tbl-frame{background:var(--surface-white)}
  .tbl-mainpane .tbl-bar{margin:0;padding:9px 16px;border-bottom:1px solid var(--outline-gray-2);flex-shrink:0}
  .tbl-scroll{flex:1;overflow:auto;padding:14px 16px}
  .tbl-foot{flex-shrink:0;border-top:1px solid var(--outline-gray-2);padding:7px 16px;font-size:12px;color:var(--ink-gray-5)}
  /* row-number gutter: number at rest, actions on hover (Airtable) */
  /* number and actions occupy the SAME grid cell and cross-fade on hover (opacity,
     not display) so moving the cursor across rows never triggers a reflow */
  .gutter-stack{display:grid;place-items:center start}
  .gutter-stack > *{grid-area:1/1}
  .tbl-rownum{color:var(--ink-gray-5);font-size:11px;font-variant-numeric:tabular-nums;padding-left:2px;
              opacity:1;transition:opacity .1s}
  .tbl-actcol .tbl-row-acts{opacity:0;pointer-events:none;transition:opacity .1s}
  tr:hover .tbl-rownum{opacity:0}
  tr:hover .tbl-actcol .tbl-row-acts{opacity:1;pointer-events:auto}
  /* list view */
  .list-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-top:1px solid var(--outline-gray-2)}
  .list-row:first-child{border-top:none}
  .list-row:hover{background:var(--surface-gray-1)}
  .list-title{background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-gray-9);
              cursor:pointer;text-align:left;padding:0;min-width:130px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list-title:hover{color:var(--ink-violet-1)}
  .list-props{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0;font-size:12px}
  .list-prop{display:inline-flex;align-items:center;gap:5px}
  .list-plabel{color:var(--ink-gray-5);font-size:12px}
  /* board / kanban view */
  .board-wrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
  .board-lane{flex:0 0 260px;background:var(--surface-gray-1);border:1px solid var(--outline-gray-2);border-radius:10px;padding:8px}
  .board-lane.drop-over{border-color:var(--ink-blue-2);background:var(--surface-blue-1)}
  .board-lanehead{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
  .board-cards{display:flex;flex-direction:column;gap:8px}
  .board-card{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:8px;padding:9px 10px;cursor:grab;
              box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .board-card:active{cursor:grabbing}
  .board-card-title{background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-gray-9);
                    cursor:pointer;text-align:left;padding:0;flex:1;overflow-wrap:anywhere}
  .board-card-title:hover{color:var(--ink-violet-1)}
  .board-field{margin-top:6px;font-size:12px}

  /* ── responsive: sidebar becomes top strip ── */
  @media(max-width:900px){
    .sidebar{position:static;width:100%;height:auto;flex-direction:row;align-items:center;border-right:none;
             border-bottom:1px solid var(--menu-line);overflow-x:auto}
    .side-brand{padding:12px 16px;flex-shrink:0}
    .side-nav{display:flex;align-items:center;gap:4px;padding:8px 10px;overflow-x:visible}
    .side-label{display:none}
    .side-item{white-space:nowrap;padding:8px 12px}
    .side-item.on::before{display:none}
    .side-item.on{box-shadow:inset 0 0 0 1px var(--menu-line)}
    .side-foot{display:none}
    .main{margin-left:0}
    .view-h1{font-size:20px}
  }
  @media(max-width:560px){
    .view{padding:22px 16px 48px} .topbar{padding:0 16px}
    .side-item .si-name{display:none}
  }
</style>

<body>
<div id="root"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.23.1';
import { useState, useMemo, useRef, useEffect } from 'https://esm.sh/preact@10.23.1/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

const API_BASE = location.protocol === 'file:' ? 'http://localhost:5000' : '';

/* ── solid icon set: Phosphor via Iconify. Fill weight for areal glyphs,
      Bold weight for inherently linear ones (check, plus, arrows, hash, code).
      One name→id map drives the whole app. Never reintroduce outline/stroke icons. ── */
/* Material Symbols Rounded ligature names (line style, wght 300 / GRAD 200 / opsz 24).
   Brand logos + the chess knight have no Material equivalent, so they stay on
   Phosphor via Iconify, switched to the LINE (regular) weight to match. An id
   containing ':' renders through iconify-icon; anything else is a Material ligature. */
const ICONS = {
  captions:'closed_caption', youtube:'ph:youtube-logo', search:'search',
  copy:'content_copy', download:'download', clock:'schedule', type:'title',
  list:'format_list_bulleted', zap:'bolt', alert:'error', check:'check',
  globe:'language', hash:'tag', film:'movie', loader:'progress_activity',
  plus:'add', languages:'translate', book:'menu_book', pen:'edit',
  code:'code', target:'target', users:'group', sparkles:'auto_awesome',
  message:'chat_bubble', house:'home',
  arrowLeft:'arrow_back', play:'play_arrow',
  wrench:'build', cpu:'memory', github:'ph:github-logo', star:'star',
  arrowRight:'arrow_forward', radar:'radar', linkedin:'ph:linkedin-logo',
  twitter:'ph:x-logo', refresh:'refresh', mapPin:'location_on',
  externalLink:'open_in_new', plug:'power', userSearch:'frame_person',
  reddit:'ph:reddit-logo', building:'apartment', webhook:'webhook',
  rss:'rss_feed', sealCheck:'verified', upload:'upload',
  mail:'mail', broom:'mop', chartLine:'monitoring',
  minus:'remove', user:'person', signout:'logout',
  newspaper:'newspaper', knight:'ph:horse', calendar:'calendar_month',
  binoculars:'travel_explore', quora:'format_quote', trustpilot:'star',
  capterra:'storefront', g2:'military_tech', review:'star',
  sheet:'table', comment:'comment', archive:'archive',
  textAa:'text_fields', tag:'label', funnel:'filter_alt', eye:'visibility', eyeSlash:'visibility_off',
  caretDown:'keyboard_arrow_down', caretRight:'keyboard_arrow_right', caretUp:'keyboard_arrow_up',
  trash:'delete', dots:'more_horiz', copyRow:'file_copy',
  close:'close', columns:'view_column', kanban:'view_kanban', rows:'table_rows',
};
/* Icon size scale (user decision): 24px page-level, 20px nav/toolbar, 16px dense
   inline (grid headers, menus, chips). The legacy size prop snaps to the nearest
   tier, so call sites keep their relative hierarchy without pixel-exact sizes.
   htm passes attribute values as strings, hence the coercion. */
const Icon = ({name, size, cls=''}) => {
  const id = ICONS[name] || name;
  const n = parseInt(size, 10) || 16;
  const px = n >= 22 ? 24 : n >= 15 ? 20 : 16;
  return id.includes(':')
    ? html`<iconify-icon class=${cls} icon=${id} width=${px} height=${px}></iconify-icon>`
    : html`<span class=${'msi'+(cls?' '+cls:'')} style=${'font-size:'+px+'px'} aria-hidden="true">${id}</span>`;
};

/* ── tool registry + sidebar nav ── */
const TOOLS = {
  home:    {icon:'house',     name:'Home',              desc:'GTM use-case templates, prefilled and ready to run'},
  persona: {icon:'users',     name:'Synthetic Persona', desc:'See how developers react to your copy'},
  extract: {icon:'captions',  name:'YouTube Transcript', desc:'Pull clean text from any YouTube video'},
  signals: {icon:'radar',     name:'Signals',           desc:'The data intelligence layer for AI agents'},
  clean:   {icon:'sealCheck', name:'NoBounce',          desc:'Validate and de-dupe an email list for agents'},
  competitor: {icon:'chartLine', name:'Competitor Intel', desc:'Share of voice vs your competitors'},
  tables:     {icon:'sheet',      name:'Tables',           desc:'GTM Pipeline'},
  reports:    {icon:'newspaper',  name:'Reports',          desc:'Daily signal briefs + the competitive monitor'},
  connectors: {icon:'plug',      name:'Connectors',       desc:'Wire your CRM, sequencer, and messaging'},
};
const NAV = ['home', 'persona', 'extract', 'signals', 'clean', 'competitor', 'tables', 'reports', 'connectors'];

/* ── persona constants (mirrors api/_personas.py for instant, offline render) ── */
const PERSONAS = [
  {id:'indie',  emoji:'🛠️', name:'The Indie Hacker',          tag:'Shipping a side project on a tight budget'},
  {id:'cto',    emoji:'🚀', name:'The Startup CTO',           tag:'Technical founder, ships under pressure'},
  {id:'agency', emoji:'🧰', name:'The Agency Dev',            tag:'Builds for paying clients on WordPress / Shopify'},
  {id:'infra',  emoji:'🛡️', name:'The Senior Infra Engineer', tag:'Reads the breach postmortem before integrating'},
  {id:'ai',     emoji:'🤖', name:'The AI-Native Builder',     tag:'Wiring up AI agents, wants an agent-ready layer'},
];
const CTYPES = [
  ['landing','Landing page'],['email','Cold email'],['ad','Ad'],['social','Social post'],['sales','Sales line'],
];
const SAMPLE_COPY = "Ship payments in an afternoon, not a sprint.\n\nOne install and a six-line snippet put a working checkout in your app today. No sales call, no sandbox paperwork, no contract to sign first.\n\n• Live in 15 minutes: paste the snippet, drop in your key, take a real payment.\n• Pricing on the page: flat per transaction, no minimums, no 'contact us'.\n• Agent-ready: an MCP endpoint your AI assistant can wire up without reading the docs.\n\nStart free, no card needed. Read the docs, run the example, keep building.";

const tone = s => s>=70 ? 'green' : s>=45 ? 'amber' : 'red';
const toneHex = {green:'#137949', amber:'#B35309', red:'#CC2929'};
const ctypeLabel = c => (CTYPES.find(x=>x[0]===c)||[,c])[1];
const overallNote = o => o>=70
  ? 'Most of your target developers would give this a look. Tighten the lowest-scoring reactions below and you are ready.'
  : o>=45
  ? 'This lands with some developers and loses others. The fixes below are where the points are.'
  : 'Most developers would scroll past this. Start with the fixes below before you launch.';

/* Shared persona result — gauge + reaction cards from one payload. Used by the
   Persona tool and the video-messaging play so both render identically. */
function PersonaResult(d){
  const tn = tone(d.overall);
  return html`
      <div class="stack">
        <div class="glass-card gauge">
          <div style="text-align:center;flex-shrink:0">
            <div class="gauge-num" style=${`color:${toneHex[tn]}`}>${d.overall}</div>
            <div style="font-size:12px;color:var(--ink-gray-5);margin-top:3px">out of 100</div>
          </div>
          <div style="flex:1;min-width:210px">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
              <span class=${'pill pill-'+tn} style="font-size:14px;padding:5px 12px">${d.verdict}</span>
              <span class="pill pill-gray"><${Icon} name=${d.engine==='ai'?'sparkles':'cpu'} size=12 /> ${d.engine==='ai'?'Live AI reactions':'Built-in model'}</span>
              <span class="pill pill-gray">${ctypeLabel(d.content_type)}</span>
            </div>
            <div class="gauge-bar"><div class="gauge-fill" style=${`width:${d.overall}%;background:${toneHex[tn]}`}></div></div>
            <div style="font-size:12px;color:var(--ink-gray-6);line-height:1.55;margin-top:10px">${overallNote(d.overall)}</div>
          </div>
        </div>

        ${d.structure && html`
        <div class="glass-card" style="padding:16px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <span style="font-weight:600;font-size:14px">Structure of a strong ${d.structure.label}</span>
            <span class=${'pill pill-'+tone(d.structure.score)}>${d.structure.have} of ${d.structure.total} parts</span>
          </div>
          <div class="gauge-bar" style="margin-bottom:12px"><div class="gauge-fill" style=${`width:${d.structure.score}%;background:${toneHex[tone(d.structure.score)]}`}></div></div>
          <div style="display:flex;flex-direction:column;gap:7px">
            ${d.structure.parts.map(p=>html`
              <div style="display:flex;align-items:flex-start;gap:8px;font-size:13px">
                <span style=${`color:${p.present?'var(--ink-green-2)':'var(--ink-gray-4)'};flex-shrink:0;margin-top:1px`}><${Icon} name=${p.present?'check':'minus'} size=14/></span>
                <div style="min-width:0;overflow-wrap:anywhere"><b style=${p.present?'':'color:var(--ink-gray-6)'}>${p.label}</b>
                  <span style="color:var(--ink-gray-5)"> — ${p.note}</span></div>
              </div>`)}
          </div>
          ${d.structure.missing.length>0 && html`<div style="font-size:12px;color:var(--ink-amber-2);margin-top:11px"><${Icon} name="wrench" size=12/> To complete this ${d.structure.label}: ${d.structure.missing.join(', ')}</div>`}
        </div>`}

        <div class="pcard-grid">
          ${d.results.map(r=>{ const t=tone(r.score); return html`
            <div class="glass-card pcard">
              <div class="pcard-head">
                <span class="pcard-emoji">${r.emoji}</span>
                <div style="flex:1;min-width:0">
                  <div class="pcard-name">${r.name}</div>
                  <div class="pcard-tag">${r.tagline}</div>
                </div>
                <span class=${'pill pill-'+t}>${r.verdict}</span>
              </div>
              <div>
                <div class="scorebar" style="margin-bottom:5px"><div class="scorefill" style=${`width:${r.score}%;background:${toneHex[t]}`}></div></div>
                <div class="score-meta"><span>Fit score</span><span class="mono" style=${`color:${toneHex[t]};font-weight:600`}>${r.score}/100</span></div>
              </div>
              <div class="quote" style=${`border-left-color:${toneHex[t]}`}>${r.reaction}</div>
              <div class="kv"><span class="kv-ic" style="color:var(--ink-green-2)"><${Icon} name="check" size=15 /></span>
                <div><b>What landed:</b> ${r.worked}</div></div>
              <div class="kv"><span class="kv-ic" style="color:var(--ink-amber-2)"><${Icon} name="wrench" size=14 /></span>
                <div><b>Biggest fix:</b> ${r.fix}</div></div>
            </div>`; })}
        </div>

        <p style="font-size:12px;color:var(--ink-gray-4);text-align:center;margin:2px 0 0">

          Connect an AI key to upgrade from the built-in model to live reactions.

      </div>`;
}

/* Platform -> [icon name, label]. Used by play steps that render a footprint. */
const PLAT_META = {
  github:['github','GitHub'], x:['twitter','X'], linkedin:['linkedin','LinkedIn'],
  reddit:['reddit','Reddit'], youtube:['youtube','YouTube'],
};

/* Official logos, no key, no build: Clearbit by domain, falling back to a Google
   favicon, then hiding if both miss. Brand names map to a best-guess .com. */
const domainOf = (brand) => (brand||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'') + '.com';
function Logo(domain, size){
  size = size || 18;
  return html`<img class="brand-logo" width=${size} height=${size} alt=""
    src=${'https://logo.clearbit.com/' + domain}
    onError=${e=>{ const t=e.target;
      if(!t.dataset.fb){ t.dataset.fb='1'; t.src='https://www.google.com/s2/favicons?domain='+domain+'&sz=64'; }
      else { t.style.visibility='hidden'; } }} />`;
}

/* Renders the 'signals' step of a play: which platforms answered, plus the
   posts the next step actually reasoned over (so the teardown is auditable). */
function SignalsEvidence(o){
  const ev = (o.evidence||[]).slice(0,6);
  return html`
    <div style="margin-top:4px">
      <div class="ev-chips">
        ${(o.platform_status||[]).map(p=>{ const m=PLAT_META[p.platform]||[null,p.platform];
          const ok=p.status==='ok'; return html`
          <span class=${'pill '+(ok?'pill-green':'pill-gray')} title=${p.note||''}>
            ${m[0]&&html`<${Icon} name=${m[0]} size=12 />`} ${m[1]}${ok?'':' · not connected'}</span>`; })}
      </div>
      <div class="ev-list">
        ${ev.map(p=>{ const m=PLAT_META[p.platform]||['globe',p.platform];
          const eng=(p.engagement||[]).map(e=>`${e.value} ${e.label}`).join(' · '); return html`
          <div class="ev-post">
            <span class="ev-ic"><${Icon} name=${m[0]} size=16 /></span>
            <div class="ev-body">
              <div class="ev-meta"><span>${m[1]} · ${p.kind}</span>${p.ago&&html`<span>${p.ago}</span>`}</div>
              <div class="ev-text">${p.text}</div>
              ${eng&&html`<div class="ev-eng">${eng}</div>`}
            </div>
          </div>`; })}
      </div>
    </div>`;
}

/* Renders the 'teardown' step: the repeatable patterns drawn from the posts. */
/* Shared reliability rendering for the content agents (13 teardown, 14 trends):
   a confidence pill, and grounded facets where every insight shows the posts it
   cites. An uncited insight is marked 'unverified' rather than passed off. */
function citesRow(ev){
  return (ev&&ev.length) ? html`<div class="td-cites">
    ${ev.map(e=>html`<span class="td-cite" title=${e.snippet||''}>#${e.n} ${e.platform}</span>`)}
  </div>` : null;
}
function confPill(conf){
  const band=(conf&&conf.band)||'';
  return band ? html`<span class=${'pill '+(band==='high'?'pill-green':'pill-gray')} title=${(conf&&conf.basis)||''}>
    <${Icon} name="sealCheck" size=12 /> ${band} confidence</span>` : null;
}
function groundedFacet(label, icon, items){
  return (items&&items.length) ? html`
    <div class="td-facet">
      <div class="td-facet-h"><span class="fi"><${Icon} name=${icon} size=14 /></span>${label}</div>
      <ul class="td-list">${items.map(it=>{ const T=(typeof it==='string')?{text:it,grounded:false,evidence:[]}:it; return html`<li>
        <div class="td-li-body">
          <span class="td-it">${T.text}${T.grounded===false?html`<span class="td-unv" title="No source post cited">unverified</span>`:null}</span>
          ${citesRow(T.evidence)}
        </div>
      </li>`; })}</ul>
    </div>` : null;
}

function TeardownResult(o){
  const conf = o.confidence||{};
  return html`
    <div style="margin-top:4px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px">
        <span class="pill pill-gray"><${Icon} name=${o.engine==='ai'?'sparkles':'cpu'} size=12 /> ${o.engine==='ai'?'Live AI teardown':'Built-in model'}</span>
        ${confPill(conf)}
      </div>
      ${o.summary&&html`<p class="td-sum">${o.summary}</p>`}
      ${conf.thin&&html`<div class="td-thin"><${Icon} name="alert" size=13 /> Thin evidence (${conf.basis}). Treat these as directional, not verified.</div>`}
      ${groundedFacet('Hooks that recur','zap',o.hooks)}
      ${groundedFacet('Formats they lean on','list',o.formats)}
      ${groundedFacet('Themes they own','hash',o.themes)}
      ${o.cadence&&html`<div class="td-cadence"><${Icon} name="clock" size=14 /> ${o.cadence}</div>`}
      ${o.steal&&html`<div class="td-steal">
        <div class="td-steal-h"><${Icon} name="target" size=13 /> Steal this week</div>
        <div class="td-steal-t">${o.steal}</div>
      </div>`}
      ${o.audit&&html`<p class="td-audit"><${Icon} name="sealCheck" size=12 /> ${o.audit}</p>`}
      <p style="font-size:12px;color:var(--ink-gray-4);margin:8px 0 0">
        Every pattern cites the posts it was drawn from. Connect an AI key for the full live teardown.
      </p>
    </div>`;
}

/* Agent 14: trending posts ranked by a shown velocity metric, the voices to
   engage, and a grounded read of what's heating up. */
function TrendResult(o){
  const conf = o.confidence||{};
  const posts = o.trending_posts||[];
  const voices = o.top_voices||[];
  const ic = (plat)=>(PLAT_META[plat]||['globe',plat])[0];
  const eng = (e)=>(e||[]).map(x=>`${x.value} ${x.label}`).join(' · ');
  return html`
    <div style="margin-top:4px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px">
        <span class="pill pill-gray"><${Icon} name=${o.engine==='ai'?'sparkles':'cpu'} size=12 /> ${o.engine==='ai'?'Live AI read':'Built-in model'}</span>
        ${confPill(conf)}
      </div>
      ${o.summary&&html`<p class="td-sum">${o.summary}</p>`}
      ${conf.thin&&html`<div class="td-thin"><${Icon} name="alert" size=13 /> Thin feed (${conf.basis}). Treat as directional.</div>`}
      ${groundedFacet('Topics heating up','zap',o.topics_heating)}
      ${groundedFacet('Where to engage','target',o.suggested_engagements)}
      ${posts.length?html`<div class="td-facet">
        <div class="td-facet-h"><span class="fi"><${Icon} name="rss" size=14 /></span>Trending now · by velocity</div>
        <div class="ev-list">${posts.slice(0,6).map(p=>html`
          <div class="ev-post">
            <span class="ev-ic"><${Icon} name=${ic(p.platform)} size=16 /></span>
            <div class="ev-body">
              <div class="ev-meta">${p.platform}${p.author?(' · @'+p.author):''}${p.velocity!=null?html` · <span class="tr-vel">${p.velocity}/hr</span>`:''}${p.ago?(' · '+p.ago):''}</div>
              <div class="ev-text">${p.text}</div>
              ${eng(p.engagement)&&html`<div class="ev-eng">${eng(p.engagement)}</div>`}
            </div>

      ${voices.length?html`<div class="td-facet">

        <div class="tr-voices">${voices.map(v=>html`
          <div class="tr-voice">
            <span class="ev-ic"><${Icon} name=${ic(v.platform)} size=15 /></span>

}

/* Agent 12: what works in your OWN content. Format winners + themes (grounded),
   best-time windows (metric shown), and an honest cross-run engagement trend. */
function ContentPerfResult(o){
  const conf = o.confidence||{};
  const times = o.best_post_times||[];

  return html`
    <div style="margin-top:4px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px">
        <span class="pill pill-gray"><${Icon} name=${o.engine==='ai'?'sparkles':'cpu'} size=12 /> ${o.engine==='ai'?'Live AI read':'Built-in model'}</span>
        ${confPill(conf)}
      </div>
      ${o.summary&&html`<p class="td-sum">${o.summary}</p>`}
      ${conf.thin&&html`<div class="td-thin"><${Icon} name="alert" size=13 /> Thin evidence (${conf.basis}). Treat as directional.</div>`}

      ${groundedFacet('Themes that land','hash',o.top_themes)}
