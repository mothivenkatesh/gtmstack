/* ════════════════════════ TOOL 5 — CLEAN DATA ════════════════════════ */
const VERDICT_PILL = {deliverable:'pill-green', valid:'pill-green', risky:'pill-amber',
  undeliverable:'pill-red', invalid:'pill-red'};
const CLEAN_SAMPLE = ['founder@acme.com','FOUNDER@acme.com','info@stripe.com',
  'sales@mailinator.com','jane@gmial.com','not-an-email','hello@cashfree.com'].join('\n');

function CleanTool({seed}){
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [cleanOnly, setCleanOnly] = useState(false);
  const [query, setQuery] = useState('');
  const [copied, setCopied] = useState(false);
  const [deliver, setDeliver] = useState(false);
  const fileRef = useRef();
  const bodyRef = useRef();

  async function run(opts = {}){
    const t = (opts.text ?? text).trim();
    if(!t){ setError('Paste or upload some email addresses first.'); return; }
    setLoading(true); setError(null); if(opts.text) setText(t);
    try{
      const r = await fetch(`${API_BASE}/api/clean`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text: t }) });
      const j = await r.json();
      if(!r.ok){ setError(j.error || 'Validation failed.'); }
      else { setData(j); setCleanOnly(false); setQuery(''); if(bodyRef.current) bodyRef.current.scrollTop = 0; }
    }catch(e){ setError('Could not reach the validator. Is the local server running on :5000?'); }
    setLoading(false);
  }
  function onFile(e){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => { setText(String(reader.result || '')); setError(null); };
    reader.readAsText(f); e.target.value = '';
  }

  useEffect(()=>{ if(seed && seed.tool==='clean' && seed.payload){ run({text:seed.payload.text}); } }, [seed]);
  useEffect(()=>{ if(data && !data.error) recordRun('clean', (((data.summary&&data.summary.validated)||(data.rows&&data.rows.length))||0)+' emails validated'); }, [data]);

  const rows = data?.rows || [];
  const sm = data?.summary;
  const q = query.trim().toLowerCase();
  const shown = useMemo(()=>{
    let r = cleanOnly ? rows.filter(x=>x.valid) : rows;
    return q ? r.filter(x=>(x.email||'').toLowerCase().includes(q)) : r;
  }, [rows, cleanOnly, q]);

  function csvText(only){
    const f = data.fields;
    const esc = v => { v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const rr = only ? rows.filter(x=>x.valid) : rows;
    return [f.join(','), ...rr.map(r=>f.map(k=>esc(r[k])).join(','))].join('\n');
  }
  function dl(kind){
    const only = cleanOnly;
    const body = kind==='csv' ? csvText(only)
      : JSON.stringify(only ? rows.filter(x=>x.valid) : rows, null, 2);
    const blob = new Blob([body], {type: kind==='csv'?'text/csv;charset=utf-8':'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `clean-emails${only?'.sendable':''}.${kind}`;
    a.click(); URL.revokeObjectURL(a.href);
  }
  function apiSnippet(){
    const base = API_BASE || location.origin;
    const body = { text: 'founder@acme.com, info@stripe.com, x@mailinator.com' };
    return `curl -X POST ${base}/api/clean \\\n  -H 'Content-Type: application/json' \\\n`
      + `  -d '${JSON.stringify(body)}'\n\n`
      + `# Add ?format=csv&only=clean to download just the sendable rows (deliverable + risky).`;
  }
  function copySnippet(){ navigator.clipboard.writeText(apiSnippet()); setCopied(true); setTimeout(()=>setCopied(false),1400); }

  const v = sm?.by_verdict || {};
  const undeliv = (v.undeliverable||0) + (v.invalid||0);

  return html`
  <div class="view">
    <div class="view-head">
      <h1 class="view-h1">Never let a bad address burn your sending domain</h1>
      <p class="view-sub">Paste a list and get one verdict per address: syntax, live MX, disposable, role, and typos, de-duped. No mail is sent.</p>
    </div>

    <div class="glass-card u-cardbody">
      <label class="field-label">Paste emails, or upload a CSV</label>
      <textarea class="copy-area u-ta128" placeholder="One email per line, or paste a whole CSV — addresses are pulled out of any column."
        value=${text} onInput=${e=>setText(e.target.value)}></textarea>
      <div class="u-row u-g10 u-wrap u-mt12">
        <button class="btn btn-primary btn-lg" disabled=${loading} onClick=${()=>run()}>
          ${loading ? html`<${Icon} name="loader" size=15 cls="spin" /> Validating` : html`<${Icon} name="broom" size=15 /> Clean list`}
        </button>
        <button class="btn btn-ghost btn-lg" onClick=${()=>fileRef.current.click()}><${Icon} name="upload" size=15 /> Upload CSV</button>
        <input ref=${fileRef} type="file" accept=".csv,.txt,.tsv" class="u-hidden" onChange=${onFile} />
        <button class="btn btn-ghost btn-lg u-mla" disabled=${loading} onClick=${()=>run({text:CLEAN_SAMPLE})}>Try a sample</button>
      </div>
    </div>

    <div class="deliver">
      <div class="deliver-h" onClick=${()=>setDeliver(d=>!d)}>
        <${Icon} name="code" size=15 /> Call it from an agent
        <span class="u-mla u-cfaint"><${Icon} name=${deliver?'minus':'plus'} size=14 /></span>
      </div>
      ${deliver && html`<div class="deliver-b">
        <div class="dlv-block">
          <div class="dlv-lab"><${Icon} name="code" size=13 /> POST a list, get back validated rows</div>
          <div class="code-blk">
            <button class="copy-mini" onClick=${copySnippet}><${Icon} name=${copied?'check':'copy'} size=12 /> ${copied?'Copied':'Copy'}</button>
            <pre>${apiSnippet()}</pre>
          </div>
          <div class="sig-hint">The JSON response carries one row per address (valid, verdict, score, mx_ok, disposable, role, typo) — the same data this page renders.</div>
        </div>
      </div>`}
    </div>

    ${error && html`<div class="errbox u-mtb18">
      <${Icon} name="alert" size=18 />
      <div><div class="u-fw600 u-mb2">Couldn't clean that list</div>
      <div class="u-fs13 u-op85">${error}</div></div>
    </div>`}

    ${loading && !data && html`<div class="kpi-grid u-mtb18">
      ${[0,1,2,3].map(()=>html`<div class="glass-card kpi"><div class="skel u-h13 u-w55"></div><div class="skel u-h24 u-w40"></div></div>`)}
    </div>`}

    ${data && sm && html`
      <div class="kpi-grid u-m1808">
        ${[
          ['Deliverable', v.deliverable||0, 'sealCheck', 'pill-green'],
          ['Risky',       v.risky||0,     'alert',     'pill-amber'],
          ['Undeliverable', undeliv,       'alert',     'pill-red'],
          ['Duplicates removed', sm.duplicates_removed, 'copy', 'pill-gray'],
        ].map(([l,val,ic,pc])=>html`<div class="glass-card kpi">
          <div class="kpi-top"><span class="kpi-label">${l}</span><span class="chip"><${Icon} name=${ic} size=14 /></span></div>
          <div class="kpi-value">${(val||0).toLocaleString()}</div>
        </div>`)}
      </div>
      <p class="u-pcap">
        ${sm.unique.toLocaleString()} unique address${sm.unique===1?'':'es'} from ${sm.submitted.toLocaleString()} found${sm.truncated?html` · capped at ${sm.max_emails.toLocaleString()}`:''}.
      </p>

      <div class="glass-card">
        <div class="panel-head">
          <div class="seg">
            <button class=${cleanOnly?'':'on'} onClick=${()=>setCleanOnly(false)}>All ${rows.length}</button>
            <button class=${cleanOnly?'on':''} onClick=${()=>setCleanOnly(true)}><${Icon} name="sealCheck" size=13 /> Sendable ${sm.valid}</button>
          </div>
          <div class="u-row u-ac u-g8">
            <div class="search"><${Icon} name="search" size=14 />
              <input placeholder="Search…" value=${query} onInput=${e=>setQuery(e.target.value)} /></div>
            <button class="btn btn-ghost btn-sm" onClick=${()=>dl('csv')}><${Icon} name="download" size=13 /> CSV</button>
            <button class="btn btn-ghost btn-sm" onClick=${()=>dl('json')}><${Icon} name="download" size=13 /> JSON</button>
          </div>
        </div>
        <div class="tbody" ref=${bodyRef}>
          ${shown.length===0 && html`<div class="u-empty">No addresses to show${q?html` for “${query}”`:''}.</div>`}
          ${shown.map(r=>html`<div class="u-emrow">
            <span class="mono u-grow0 u-fs125 u-wrapany">${r.email}</span>
            ${r.typo_suggestion && html`<span class="pill pill-amber">did you mean ${r.typo_suggestion}?</span>`}
            ${r.disposable && html`<span class="pill pill-red">disposable</span>`}
            ${r.role_based && html`<span class="pill pill-gray">role</span>`}
            ${r.free_provider && html`<span class="pill pill-gray">free</span>`}
            <span class=${'pill '+(VERDICT_PILL[r.verdict]||'pill-gray')}>${r.verdict}</span>
          </div>`)}
        </div>
      </div>
      <p class="u-note-tight">
        ${sm.validated.toLocaleString()} validated · ${sm.smtp_checked?'with SMTP probe':'MX + heuristics, no mailbox contacted'} · download is agent-ready CSV or JSON
      </p>`}

    ${!data && !loading && !error && html`
      <div class="note note-blue u-mt18"><${Icon} name="zap" size=16 />
        <div>Deliverable means valid syntax and a live MX record with no junk-domain flags. Risky usually means a role inbox
          (info@, sales@) or a catch-all. Undeliverable is a broken address, a dead domain, or a disposable burner. Sendable
          is everything except undeliverable (deliverable plus risky) — the list an agent can actually send to.</div>
      </div>`}
  </div>`;
}

function PlayRunner({card, onBack}){
  const seed = {};
  card.inputs.forEach(f=>{ seed[f.key] = f.default!=null ? f.default
    : (f.options ? (f.options[0][0]!=null?f.options[0][0]:f.options[0]) : ''); });
  const [vals, setVals]    = useState(seed);
  const [loading, setLoad] = useState(false);
  const [error, setErr]    = useState('');
  const [res, setRes]      = useState(null);
  const resRef             = useRef(null);
  const setVal = (k,v)=> setVals(p=>({...p,[k]:v}));

  async function run(input){
    const data = input || vals;
    const miss = card.inputs.find(f=> f.required && !String(data[f.key]||'').trim());
    if(miss){ setErr(`Enter ${miss.label.toLowerCase()} to run this play.`); return; }
    setLoad(true); setErr(''); setRes(null);
    try{
      const r = await fetch(`${API_BASE}/api/plays`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({play: card.id, input: data}),
      });
      const j = await r.json();
      if(!r.ok){ setErr(j.error || 'The play could not run.'); }
      else setRes(j);
    }catch(e){ setErr('Could not reach the engine. Is the local server running on :5000?'); }
    setLoad(false);
  }

  /* Auto-run on open with the sample so one click shows a full result. */
  useEffect(()=>{ run(seed); }, []);

  /* When a result lands and its tail is below the fold, scroll to it so the
     multi-step output is what the user sees, not the form they just submitted.
     Instant, not smooth: late-loading icons shift layout and cancel a smooth
     animation, leaving the page parked on the form. */
  useEffect(()=>{
    if(res && resRef.current && resRef.current.getBoundingClientRect().bottom > innerHeight)
      requestAnimationFrame(()=> resRef.current && resRef.current.scrollIntoView({block:'start'}));
  }, [res]);

  useEffect(()=>{ if(res && res.steps && res.steps.length){
    const last = res.steps[res.steps.length-1] || {};
    recordRun(card.id, (card.name||card.title||card.id)+(last.summary?(' · '+last.summary):'')); } }, [res]);

  return html`
  <div class="view">
    ${onBack && html`<button class="play-back" onClick=${onBack}><${Icon} name="arrowLeft" size=14 /> All plays</button>`}
    <div class="view-head">
      <h1 class="view-h1">${card.title}</h1>
      <p class="view-sub">${card.desc}</p>
    </div>

    <div class="glass-card u-cardbody">
      ${card.inputs.map(f=> html`
        <div>
          <label class="field-label">${f.label}</label>
          ${f.type==='seg'
            ? html`<div class="seg u-seg-mb">
                ${f.options.map(([id,label])=>html`
                  <button class=${vals[f.key]===id?'on':''} onClick=${()=>setVal(f.key,id)}>${label}</button>`)}
              </div>`
            : html`<input class="input u-mb18" placeholder=${f.placeholder||''}
                value=${vals[f.key]||''} onInput=${e=>setVal(f.key,e.target.value)}
                onKeyDown=${e=>e.key==='Enter'&&run()} />`}
        </div>`)}
      <button class="btn btn-primary btn-lg" disabled=${loading} onClick=${()=>run()}>
        ${loading ? html`<${Icon} name="loader" size=15 cls="spin" /> Running play` : html`<${Icon} name="play" size=15 /> Run play`}
      </button>
    </div>

    ${error && html`<div class="errbox u-mb18">
      <${Icon} name="alert" size=18 />
      <div><div class="u-fw600 u-mb2">Couldn’t run the play</div>
      <div class="u-fs13 u-op85">${error}</div></div>
    </div>`}

    ${loading && !res && html`
      <div class="glass-card u-p22 u-row u-g14 u-mb14">
        <div class="skel u-sq26 u-br50 u-shrink0"></div>
        <div class="u-grow u-row u-col u-g9 u-jc">
          <div class="skel u-h14 u-w35"></div><div class="skel u-h10 u-w60"></div></div>
      </div>`}

    ${res && html`<div class="stack" ref=${resRef}>
      ${res.steps.map((s,i)=>{ const err=s.status==='error'; const last=i===res.steps.length-1; return html`
        <div class="step">
          <div class="step-rail">
            <div class=${'step-dot'+(err?' err':'')}>${err?html`<${Icon} name="alert" size=14 />`:i+1}</div>
            ${!last && html`<div class="step-line"></div>`}
          </div>
          <div class="step-body">
            <div class="step-label">${s.label}</div>
            <div class="step-sum">${s.summary}</div>
            ${s.tool==='extract'  && s.output && s.output.preview && html`<div class="tprev">${s.output.preview}</div>`}
            ${s.tool==='persona'  && s.status==='ok' && s.output && PersonaResult(s.output)}
            ${s.tool==='signals'  && s.output && SignalsEvidence(s.output)}
            ${s.tool==='teardown' && s.status==='ok' && s.output && TeardownResult(s.output)}
            ${s.tool==='trends'   && s.status==='ok' && s.output && TrendResult(s.output)}
            ${s.tool==='contentperf' && s.status==='ok' && s.output && ContentPerfResult(s.output)}
            ${s.tool==='compete'  && s.status==='ok' && s.output && CompeteResult(s.output)}
          </div>
        </div>`; })}
    </div>`}
  </div>`;
}

/* ════════════════════════ APP SHELL ════════════════════════ */
/* ════════════════════════ ACCOUNTS — sign-in modal + run history ════════════════════════ */
function Auth({open, onClose, initialErr}){
  const [email, setEmail] = useState('');
  const [stage, setStage] = useState('entry');   // entry | sent | dev
  const [busy, setBusy]   = useState(false);
  const [err, setErr]     = useState('');
  const [link, setLink]   = useState('');
  useEffect(()=>{ if(open){ setStage('entry'); setErr(initialErr||''); setBusy(false); } }, [open]);
  if(!open) return null;
  const submit = async () => {
    if(busy || !email) return;
    setBusy(true); setErr('');
    try{
      const r = await fetch('/api/auth', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'request', email})});
      const d = await r.json();
      if(d.mode==='dev' && d.link){ setLink(d.link); setStage('dev'); }
      else if(d.ok){ setStage('sent'); }
      else setErr(d.error || 'Could not send the link. Try again.');
    }catch(e){ setErr('Network error. Try again.'); }
    setBusy(false);
  };
  return html`
    <div class="auth-backdrop" onClick=${e=>{ if(e.target.classList.contains('auth-backdrop')) onClose(); }}>
      <div class="auth-card">
        <button class="auth-x" onClick=${onClose} aria-label="Close">×</button>
        ${stage==='entry' && html`
          <div class="auth-mark"><span class="m"><${Icon} name="target" size=16 /></span>GTMstack</div>
          <h2 class="auth-h">Sign in to GTMstack</h2>
          <p class="auth-sub">No password. We email you a one-time sign-in link.</p>
          <label class="auth-label">Email</label>
          <input class="auth-input" type="email" placeholder="you@company.com" value=${email}
            onInput=${e=>setEmail(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter') submit(); }} autofocus />
          ${err && html`<div class="auth-err">${err}</div>`}
          <button class="auth-btn" disabled=${busy||!email} onClick=${submit}>${busy?'Sending…':'Continue with email'}</button>
          <p class="auth-note">Your runs save to your history once you sign in.</p>
          <p class="auth-legal">By continuing you agree to the Terms and Privacy Policy.</p>`}
        ${stage==='sent' && html`
          <div class="auth-ico"><${Icon} name="mail" size=22 /></div>
          <h2 class="auth-h">Check your inbox</h2>
          <p class="auth-sub">We sent a sign-in link to <b>${email}</b>. It expires in 15 minutes.</p>
          <button class="auth-link" onClick=${()=>setStage('entry')}>Use a different email</button>`}
        ${stage==='dev' && html`
          <div class="auth-ico"><${Icon} name="sealCheck" size=22 /></div>
          <h2 class="auth-h">Your sign-in link</h2>
          <p class="auth-sub">Email is not configured in dev, so here is your link directly. It expires in 15 minutes.</p>
          <a class="auth-btn" href=${link}>Open sign-in link</a>
          <button class="auth-link" onClick=${()=>setStage('entry')}>Use a different email</button>`}
      </div>
    </div>`;
}

function RunsModal({open, onClose}){
  const [data, setData] = useState(null);
  useEffect(()=>{ if(open){ setData(null);
    fetch('/api/auth?action=runs').then(r=>r.json()).then(setData).catch(()=>setData({runs:[]})); } }, [open]);
  if(!open) return null;
  const runs = (data&&data.runs)||[];
  const fmt = (iso)=>{ try{ return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } };
  return html`
    <div class="auth-backdrop" onClick=${e=>{ if(e.target.classList.contains('auth-backdrop')) onClose(); }}>
      <div class="auth-card u-mw440">
        <button class="auth-x" onClick=${onClose}>×</button>
        <div class="auth-mark"><span class="m"><${Icon} name="clock" size=16 /></span>Your runs</div>
        ${!data ? html`<div class="auth-empty">Loading…</div>`
          : runs.length ? html`<div>${runs.map(r=>html`
              <div class="auth-runrow"><span class="rt">${r.tool}</span><span class="rs">${r.summary||''}</span><span class="ra">${fmt(r.at)}</span></div>`)}</div>`
          : data.no_db ? html`<div class="auth-empty">You are signed in. Run history starts saving once a database is connected to GTMstack.</div>`
          : html`<div class="auth-empty">No runs yet. Use any tool and it shows up here.</div>`}
      </div>
    </div>`;
}

function WelcomeModal({open, onClose}){
  if(!open) return null;
  return html`
    <div class="auth-backdrop" onClick=${onClose}>
      <div class="auth-card u-center" onClick=${e=>e.stopPropagation()}>
        <div class="auth-ico u-ico-c"><${Icon} name="sparkles" size=22 /></div>
        <h2 class="auth-h">Welcome to GTMstack</h2>
        <p class="auth-sub">You are signed in. Every tool you run now saves to your history.</p>
        <button class="auth-btn" onClick=${onClose}>Start exploring</button>
      </div>
    </div>`;
}

function App(){
  const [tool, setTool] = useState('home');
  const [seed, setSeed] = useState(null);
  const meta = TOOLS[tool];

  /* Pre-fill + run live: stamp a seed (n makes each launch a fresh object so the
     target tool's effect re-fires even on a repeat of the same card), then show it. */
  function launch(toolId, payload){ setSeed({tool:toolId, payload, n:Date.now()}); setTool(toolId); }

  /* accounts: passwordless sign-in, soft-gated (the app stays usable anonymously) */
  const [me, setMe]           = useState(null);   // null=loading; {anon:true} | {anon:false,email}
  const [authOpen, setAuth]   = useState(false);
  const [authErr, setAuthErr] = useState('');
  const [menu, setMenu]       = useState(false);
  const [runsOpen, setRuns]   = useState(false);
  const [welcome, setWelcome] = useState(false);
  const refreshMe = () => fetch('/api/auth?action=me').then(r=>r.json()).then(setMe).catch(()=>setMe({anon:true}));
  useEffect(()=>{
    refreshMe();
    const p = new URLSearchParams(location.search);
    if(p.get('welcome')==='1') setWelcome(true);
    if(p.get('auth')==='expired'){ setAuthErr('That sign-in link expired or was already used. Request a new one.'); setAuth(true); }
    if(p.get('welcome')||p.get('auth')) history.replaceState({}, '', location.pathname);
  }, []);
  const logout = async () => { try{ await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})}); }catch(e){} setMenu(false); refreshMe(); };

  return html`
  <div class="app">
    <aside class="sidebar">
      <div class="side-brand">
        <span class="side-mark"><${Icon} name="target" size=19 /></span>
        <span class="side-name">GTMstack<span class="tag">Cursor for GTM</span></span>
      </div>
      <nav class="side-nav">
        ${NAV.map(id=>{ const t=TOOLS[id]; return html`
          <div class=${'side-item'+(tool===id?' on':'')} onClick=${()=>setTool(id)} title=${t.desc}>
            <span class="si-ic"><${Icon} name=${t.icon} size=17 /></span>
            <span class="si-name">${t.name}</span>
          </div>`; })}
      </nav>
      <div class="side-foot u-relative">
        ${me && !me.anon ? html`
          ${menu && html`<div class="user-menu">
            <button onClick=${()=>{ setRuns(true); setMenu(false); }}><${Icon} name="clock" size=15 /> Your runs</button>
            <button onClick=${logout}><${Icon} name="signout" size=15 /> Sign out</button>
          </div>`}
          <button class="user-chip" onClick=${()=>setMenu(o=>!o)}>
            <span class="user-mono">${(me.email||'?').slice(0,1)}</span>
            <span class="user-meta"><div class="user-email">${me.email}</div><div class="user-act">Account and runs</div></span>
          </button>`
        : html`
          <button class="signin-btn" onClick=${()=>{ setAuthErr(''); setAuth(true); }}><${Icon} name="user" size=15 /> Sign in</button>
          <div class="u-mt11 u-lh155">Preview your go-to-market before you spend on it.</div>`}
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <span class="tb-ic"><${Icon} name=${meta.icon} size=15 /></span>
        <span class="tb-name">${meta.name}</span>
        <span class="tb-desc u-ml2">· ${meta.desc}</span>
      </div>

      <div hidden=${tool!=='home'}><${HomeTool} onLaunch=${launch} /></div>
      <div hidden=${tool!=='persona'}><${PersonaTool} seed=${seed} /></div>
      <div hidden=${tool!=='extract'}><${ExtractTool} seed=${seed} /></div>
      <div hidden=${tool!=='signals'}><${SignalsTool} seed=${seed} /></div>
      <div hidden=${tool!=='clean'}><${CleanTool} seed=${seed} /></div>
      ${tool==='competitor' && html`<div><${CompetitorTool} /></div>`}
      <div hidden=${tool!=='connectors'}><${ConnectorsTool} /></div>
    </main>
    <${Auth} open=${authOpen} initialErr=${authErr} onClose=${()=>setAuth(false)} />
    <${RunsModal} open=${runsOpen} onClose=${()=>setRuns(false)} />
    <${WelcomeModal} open=${welcome} onClose=${()=>setWelcome(false)} />
  </div>`;
}
render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
