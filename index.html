<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GTMstack</title>
<meta name="description" content="Preview how developers react to your go-to-market copy before you launch, then mine real audience language to sharpen every message." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:FILL,GRAD,opsz,wght@0,200,24,300&display=block" rel="stylesheet" />
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  /* ── Frappe Design System tokens (light surface + dark sidebar) ── */
  :root{
    --surface-white:#FFFFFF; --surface-cards:#FFFFFF;
    --surface-gray-1:#F8F8F8; --surface-gray-2:#F3F3F3; --surface-gray-3:#EDEDED; --surface-gray-4:#E2E2E2;
    --surface-blue-1:#F2F9FF; --surface-blue-2:#E6F4FF;
    --surface-green-1:#F2FDF4; --surface-red-1:#FFF7F7; --surface-amber-1:#FDFAED; --surface-violet-1:#F0EBFF;
    --ink-gray-9:#171717; --ink-gray-8:#383838; --ink-gray-7:#525252; --ink-gray-6:#525252;
    --ink-gray-5:#6B6B6B; --ink-gray-4:#707070; --ink-gray-3:#717171;
    --ink-blue-2:#0070CC; --ink-green-2:#137949; --ink-red-3:#CC2929; --ink-amber-2:#B35309; --ink-violet-1:#6846E3;
    --outline-gray-1:#EDEDED; --outline-gray-2:#E2E2E2; --outline-gray-3:#C7C7C7; --outline-gray-4:#999999;
    --outline-blue-1:#A7D7FD; --outline-green-1:#A6EFC0; --outline-red-1:#FDC2C2; --outline-amber-1:#FBDB73;
    /* Sidebar/nav is light mode (was a dark theme). These drive the side and user rules. */
    --menu-bar:#FFFFFF; --menu-cards:#F1F1F2; --menu-line:#E9E9EB; --menu-ink-9:#171717; --menu-ink-6:#525252; --menu-ink-4:#8A8A8A;
    --sidebar-w:200px;
    /* One radius scale for the whole app. sm = chips/tags/dense controls,
       base = buttons/inputs/dropdowns/menus/cells, lg = cards/panels/modals,
       pill = fully round. Circles keep border-radius:50%. */
    --radius-sm:6px; --radius:8px; --radius-lg:12px; --radius-pill:999px;
    /* Floating app-frame: the sidebar and content panel inset from the window by
       --gap and sit on --app-canvas, so both read as floating rounded panels. */
    --gap:4px; --shell-radius:16px; --app-canvas:#F8F8F8;
  }

  /* Graphik LCG (self-hosted, proprietary, served from /fonts). Regular=400,
     Medium=500, Semibold=600, Bold=700 (true weights, no synthetic matching).
     IBM Plex Mono still loads from Google Fonts for the .mono / code styles. */
  @font-face{font-family:'Graphik LCG';font-weight:400;font-style:normal;font-display:swap;
    src:url('/fonts/GraphikLCG-Regular.woff2') format('woff2')}
  @font-face{font-family:'Graphik LCG';font-weight:500;font-style:normal;font-display:swap;
    src:url('/fonts/GraphikLCG-Medium.woff2') format('woff2')}
  @font-face{font-family:'Graphik LCG';font-weight:600;font-style:normal;font-display:swap;
    src:url('/fonts/GraphikLCG-Semibold.woff2') format('woff2')}
  @font-face{font-family:'Graphik LCG';font-weight:700;font-style:normal;font-display:swap;
    src:url('/fonts/GraphikLCG-Bold.woff2') format('woff2')}

  *{box-sizing:border-box}
  html{font-family:'Graphik LCG',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
  body{margin:0;background:var(--app-canvas);color:var(--ink-gray-9);font-size:14px;line-height:1.15;
       letter-spacing:.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  /* Material Symbols Sharp: line icons, 24px, wght 300, GRAD 200, opsz 24 */
  .msi{font-family:'Material Symbols Sharp';font-weight:normal;font-style:normal;line-height:1;
       letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;
       word-wrap:normal;direction:ltr;vertical-align:-0.125em;
       font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 200,'opsz' 24;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--outline-gray-3);border-radius:var(--radius-sm)}

  .glass-card{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:var(--radius-lg)}

  /* ── shared dropdown (Picker) + date range, used across Signals / Reports / Tables ── */
  .pk{position:relative;display:inline-block}
  .pk-btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:13px;font-weight:500;
    height:32px;padding:0 8px;border-radius:var(--radius);border:1px solid var(--outline-gray-3);background:var(--surface-white);
    color:var(--ink-gray-8);cursor:pointer;white-space:nowrap;transition:.12s}
  .pk-btn:hover{background:var(--surface-gray-1);border-color:var(--outline-gray-4)}
  .pk-btn.on{border-color:var(--ink-violet-1);color:var(--ink-violet-1);background:var(--surface-violet-1)}
  .pk-cap{color:var(--ink-gray-5);font-weight:400}
  .pk-pop{position:absolute;top:calc(100% + 6px);min-width:210px;z-index:60;background:var(--surface-cards);
    border:1px solid var(--outline-gray-3);border-radius:var(--radius);
    padding:8px;max-height:340px;overflow:auto}
  .pk-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
    font-family:inherit;font-size:13px;color:var(--ink-gray-8);padding:8px 8px;border-radius:var(--radius);cursor:pointer;white-space:nowrap}
  .pk-item:hover{background:var(--surface-gray-2)}
  .pk-item .pk-ck{margin-left:auto;color:var(--ink-violet-1);display:inline-flex}
  .pk-sep{border-top:1px solid var(--outline-gray-2);margin:4px 0}
  .pk-lbl{font-size:11px;color:var(--ink-gray-5);padding:4px 8px 4px;text-transform:uppercase;letter-spacing:.04em}
  .pk-date{width:100%;font-family:inherit;font-size:12px;padding:8px 8px;border:1px solid var(--outline-gray-3);
    border-radius:var(--radius);color:var(--ink-gray-9);background:var(--surface-white)}

  /* ── buttons / controls ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:14px;font-weight:500;
       height:32px;border-radius:var(--radius);padding:0 16px;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--ink-gray-9);color:#fff}
  .btn-primary:not(:disabled):hover{background:#000}
  .btn-ghost{background:var(--surface-cards);border-color:var(--outline-gray-3);color:var(--ink-gray-8)}
  .btn-ghost:hover{background:var(--surface-gray-2)}
  .btn-lg{height:40px;padding:0 24px;font-size:14px}
  .btn-sm{height:24px;padding:0 8px;font-size:13px}
  .input{width:100%;font-family:inherit;font-size:14px;height:40px;padding:0 16px;border:1px solid var(--outline-gray-3);
         border-radius:var(--radius);background:var(--surface-white);color:var(--ink-gray-9);outline:none;transition:.15s}
  .input:focus{border-color:var(--ink-blue-2);box-shadow:0 0 0 3px var(--surface-blue-1)}
  select.input{cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:32px;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23525252' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center}
  select.input:hover{border-color:var(--outline-gray-4)}
  .copy-area{width:100%;min-height:158px;resize:vertical;font-family:inherit;font-size:14px;line-height:1.6;
             padding:16px;border:1px solid var(--outline-gray-3);border-radius:var(--radius-lg);background:var(--surface-white);
             color:var(--ink-gray-9);outline:none;transition:.15s}
  .copy-area:focus{border-color:var(--ink-blue-2);box-shadow:0 0 0 3px var(--surface-blue-1)}
  .seg{display:inline-flex;background:var(--surface-gray-2);border-radius:var(--radius);padding:4px;gap:4px;flex-wrap:wrap}
  .seg button{border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:500;color:var(--ink-gray-6);
              height:24px;padding:0 8px;border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .seg button.on{background:var(--surface-cards);color:var(--ink-gray-9)}

  /* ── pills ── */
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-pill);font-size:12px;font-weight:500;
        height:24px;padding:0 8px;white-space:nowrap;border:1px solid transparent}
  .pill-blue{background:var(--surface-blue-1);color:var(--ink-blue-2)}
  .pill-green{background:var(--surface-green-1);color:var(--ink-green-2)}
  .pill-amber{background:var(--surface-amber-1);color:var(--ink-amber-2)}
  .pill-red{background:var(--surface-red-1);color:var(--ink-red-3)}
  .pill-gray{background:var(--surface-gray-2);color:var(--ink-gray-6)}

  /* ── app shell (flush, sidebar with a divider) ── */
  .app{min-height:100vh}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
           background:var(--menu-bar);color:var(--menu-ink-6);display:flex;flex-direction:column;
           border-right:1px solid var(--menu-line);z-index:50}
  .side-brand{display:flex;align-items:center;gap:8px;padding:16px 16px 16px}
  .side-mark{width:34px;height:34px;border-radius:var(--radius);background:linear-gradient(150deg,#0070CC,#6846E3);
             display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .side-name{font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--menu-ink-9);line-height:1.1}
  .side-name .tag{display:block;font-size:12px;font-weight:500;color:var(--menu-ink-4);letter-spacing:.01em;margin-top:4px}
  .side-nav{flex:1;overflow-y:auto;padding:8px 8px}
  .side-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--menu-ink-4);
              padding:16px 8px 8px}
  .side-item{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:var(--radius);cursor:pointer;color:var(--menu-ink-6);
             font-size:14px;font-weight:500;transition:.13s;position:relative}
  .side-item:hover{background:var(--menu-cards);color:var(--menu-ink-9)}
  .side-item.on{background:var(--menu-cards);color:var(--menu-ink-9)}
  .side-item .si-ic{flex-shrink:0;color:inherit;opacity:1}
  .side-item .si-star{margin-left:auto;color:#F4B740}
  .side-foot{padding:16px 16px;border-top:1px solid var(--menu-line);font-size:12px;line-height:1.55;color:var(--menu-ink-4)}

  .main{margin-left:var(--sidebar-w);min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:8px;padding:0 32px;
          background:var(--surface-gray-1)}
  .topbar .tb-ic{width:28px;height:28px;border-radius:var(--radius);background:var(--surface-blue-1);border:1px solid var(--outline-blue-1);
          display:flex;align-items:center;justify-content:center;color:var(--ink-blue-2);flex-shrink:0}
  .topbar .tb-name{font-size:14px;font-weight:600}
  .topbar .tb-desc{font-size:12px;color:var(--ink-gray-5)}
  .view{max-width:1000px;margin:0 auto;padding:32px 32px 64px}
  .view.view-wide{max-width:none}
  .view-head{margin-bottom:24px}
  .view-h1{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.12;margin:0}
  .view-sub{font-size:16px;color:var(--ink-gray-6);line-height:1.55;margin:8px 0 0;max-width:720px}
  .field-label{font-size:12px;font-weight:600;color:var(--ink-gray-7);margin-bottom:8px;display:block}
  .stack{display:flex;flex-direction:column;gap:24px}
  .note{display:flex;gap:8px;padding:16px 16px;border-radius:var(--radius);background:var(--surface-amber-1);
        border:1px solid var(--outline-amber-1);color:var(--ink-amber-2);font-size:12px;line-height:1.55}
  .note.note-blue{background:var(--surface-blue-1);border-color:var(--outline-blue-1);color:var(--ink-blue-2)}
  .errbox{display:flex;gap:16px;padding:16px;border:1px solid var(--outline-red-1);background:var(--surface-red-1);border-radius:var(--radius-lg);color:var(--ink-red-3)}
  .skel{background:var(--surface-gray-2);border-radius:var(--radius-sm);animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .spin{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── persona chips ── */
  .pchips{display:flex;gap:8px;flex-wrap:wrap}
  .pchip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--outline-gray-3);
         border-radius:var(--radius);background:var(--surface-white);cursor:pointer;transition:.13s;text-align:left}
  .pchip:hover{border-color:var(--outline-gray-4)}
  .pchip.on{background:var(--surface-blue-1);border-color:var(--outline-blue-1)}
  .pchip .pe{font-size:20px;line-height:1}
  .pchip .pn{font-size:14px;font-weight:500;color:var(--ink-gray-8)}
  .pchip.on .pn{color:var(--ink-blue-2)}
  .pchip .pck{color:var(--ink-blue-2);opacity:0;transition:.13s}
  .pchip.on .pck{opacity:1}

  /* ── persona results ── */
  .gauge{display:flex;align-items:center;gap:24px;padding:24px 24px}
  .gauge-num{font-size:20px;font-weight:600;line-height:.95;letter-spacing:-.02em}
  .gauge-bar{height:10px;border-radius:var(--radius-sm);background:var(--surface-gray-2);overflow:hidden}
  .gauge-fill{height:100%;border-radius:var(--radius-sm);transition:width .5s ease}
  .pcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:16px}
  .pcard{padding:16px 16px;display:flex;flex-direction:column;gap:8px}
  .pcard-head{display:flex;align-items:flex-start;gap:8px}
  .pcard-emoji{font-size:20px;line-height:1.1}
  .pcard-name{font-size:14px;font-weight:600;color:var(--ink-gray-9)}
  .pcard-tag{font-size:12px;color:var(--ink-gray-5);line-height:1.4;margin-top:4px}
  .scorebar{height:7px;border-radius:var(--radius-sm);background:var(--surface-gray-2);overflow:hidden}
  .scorefill{height:100%;border-radius:var(--radius-sm);transition:width .5s ease}
  .score-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-gray-5);font-weight:500}
  .quote{background:var(--surface-gray-1);border-left:3px solid var(--outline-gray-3);border-radius:0 8px 8px 0;
         padding:8px 16px;font-size:14px;line-height:1.55;color:var(--ink-gray-8);font-style:italic}
  .kv{display:flex;gap:8px;font-size:12px;line-height:1.5;color:var(--ink-gray-7)}
  .kv-ic{flex-shrink:0;margin-top:4px}
  .kv b{color:var(--ink-gray-9);font-weight:600}

  /* ── extractor results ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media(max-width:760px){ .kpi-grid{grid-template-columns:repeat(2,1fr)} }
  .kpi{padding:16px;display:flex;flex-direction:column;gap:8px}
  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-label{font-size:12px;font-weight:600;color:var(--ink-gray-5)}
  .kpi-value{font-size:20px;font-weight:600;color:var(--ink-gray-9);line-height:1.1}
  .chip{padding:8px;border-radius:var(--radius);background:var(--surface-gray-1);display:inline-flex;color:var(--ink-blue-2)}
  .track{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--outline-gray-3);background:var(--surface-white);
         color:var(--ink-gray-7);border-radius:var(--radius);padding:8px 8px;font-size:12px;cursor:pointer;transition:.15s}
  .track:hover{background:var(--surface-gray-1)}
  .track.on{background:var(--surface-blue-1);border-color:var(--outline-blue-1);color:var(--ink-blue-2);font-weight:500}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 16px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:8px;height:32px;border:1px solid var(--outline-gray-3);border-radius:var(--radius);padding:0 8px;background:var(--surface-white)}
  .search input{border:none;outline:none;font-family:inherit;font-size:14px;padding:0;background:transparent;color:var(--ink-gray-9);width:140px}
  .tbody{padding:8px 8px;max-height:56vh;overflow-y:auto}
  .cue{display:flex;gap:16px;padding:8px 16px;border-radius:var(--radius-sm)}
  .cue:hover{background:var(--surface-gray-1)}
  .cue-ts{flex-shrink:0;color:var(--ink-blue-2);font-size:12px;width:52px;padding-top:4px}
  .cue-text{color:var(--ink-gray-8);font-size:14px;line-height:1.55}
  .plain{padding:8px 16px;color:var(--ink-gray-8);font-size:14px;line-height:1.75;white-space:pre-wrap}
  mark{background:#FFF1A8;color:inherit;border-radius:var(--radius-sm);padding:0 4px}

  /* ── home / templates ── */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .home-card{padding:24px;cursor:pointer;display:flex;flex-direction:column;transition:border-color .14s,box-shadow .14s}
  .home-card:hover{border-color:var(--outline-blue-1)}
  .home-card:hover .hc-go{color:var(--ink-blue-2)}
  .hc-top{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .hc-ic{width:36px;height:36px;border-radius:var(--radius);background:linear-gradient(150deg,#0070CC,#6846E3);
         display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .hc-cat{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-gray-5)}
  .hc-title{font-size:16px;font-weight:600;color:var(--ink-gray-9);line-height:1.32;margin:0 0 8px}
  .hc-desc{font-size:14px;line-height:1.55;color:var(--ink-gray-6);margin:0;flex:1}
  .hc-apps{display:flex;align-items:center;gap:8px;margin-top:16px}
  .hc-app{display:inline-flex}
  .hc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px}
  .hc-eg{font-size:12px;color:var(--ink-gray-5);min-width:0;overflow-wrap:anywhere}
  .hc-eg b{color:var(--ink-gray-7);font-weight:600}
  .hc-go{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
         color:var(--ink-gray-7);transition:.14s;white-space:nowrap}

  /* ── multi-step plays ── */
  .home-sec{margin-top:32px}
  .home-sec-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-gray-9);margin-bottom:4px}
  .home-sec-h .hs-ic{display:inline-flex;color:var(--ink-violet-1)}
  .home-sec-sub{font-size:12px;color:var(--ink-gray-5);margin:0 0 16px;line-height:1.55;max-width:680px}
  .play-card:hover{border-color:var(--ink-violet-1)}
  .play-card .hc-ic{background:linear-gradient(150deg,#6846E3,#A855F7)}
  .play-back{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink-gray-6);
             cursor:pointer;background:none;border:none;padding:0;margin-bottom:16px;font-family:inherit}
  .play-back:hover{color:var(--ink-blue-2)}
  .step{display:flex;gap:16px}
  .step-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
  .step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:12px;font-weight:600;flex-shrink:0;background:var(--surface-blue-1);
            color:var(--ink-blue-2);border:1px solid var(--outline-blue-1)}
  .step-dot.err{background:var(--surface-red-1);color:var(--ink-red-3);border-color:var(--outline-red-1)}
  .step-line{flex:1;width:2px;background:var(--outline-gray-2);margin:4px 0;min-height:14px}
  .step-body{flex:1;min-width:0;padding-bottom:24px}
  .step-label{font-size:14px;font-weight:600;color:var(--ink-gray-9)}
  .step-sum{font-size:12px;color:var(--ink-gray-6);margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
  .tprev{margin-top:8px;padding:16px 16px;background:var(--surface-gray-1);border:1px solid var(--outline-gray-2);
         border-radius:var(--radius);font-size:14px;line-height:1.65;color:var(--ink-gray-7);white-space:pre-wrap;
         max-height:170px;overflow:auto;overflow-wrap:anywhere}
  /* signals evidence (inside a play step) */
  .ev-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
  .ev-list{display:flex;flex-direction:column;gap:8px}
  .ev-post{display:flex;gap:8px;padding:8px 16px;background:var(--surface-gray-1);
           border:1px solid var(--outline-gray-2);border-radius:var(--radius)}
  .ev-ic{flex-shrink:0;color:var(--ink-gray-5);margin-top:4px}
  .ev-body{flex:1;min-width:0}
  .ev-meta{font-size:12px;color:var(--ink-gray-4);text-transform:uppercase;letter-spacing:.03em;
           margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
  .ev-text{font-size:14px;color:var(--ink-gray-7);line-height:1.55;overflow-wrap:anywhere}
  .ev-eng{font-size:12px;color:var(--ink-gray-4);margin-top:4px}
  /* teardown patterns (inside a play step) */
  .td-sum{font-size:14px;color:var(--ink-gray-7);line-height:1.6;margin:8px 0 4px}
  .td-facet{margin-top:16px}
  .td-facet-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;
              letter-spacing:.04em;color:var(--ink-gray-5);margin-bottom:8px}
  .td-facet-h .fi{display:inline-flex;color:var(--ink-violet-1)}
  .td-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
  .td-list li{display:flex;gap:8px;font-size:14px;line-height:1.55;color:var(--ink-gray-7);overflow-wrap:anywhere}
  .td-list li::before{content:'';flex-shrink:0;width:6px;height:6px;border-radius:50%;
                      background:var(--ink-violet-1);margin-top:8px}
  .td-cadence{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-gray-6);margin-top:16px}
  .td-steal{margin-top:16px;padding:16px 16px;border-radius:var(--radius-lg);
            background:linear-gradient(150deg,rgba(104,70,227,.07),rgba(168,85,247,.07));
            border:1px solid rgba(104,70,227,.22)}
  .td-steal-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;
              text-transform:uppercase;color:var(--ink-violet-1);margin-bottom:4px}
  .td-steal-t{font-size:14px;color:var(--ink-gray-8);line-height:1.6;overflow-wrap:anywhere}
  /* reliability: per-insight citations + confidence + thin-evidence flag */
  .td-li-body{display:flex;flex-direction:column;gap:4px;min-width:0}
  .td-it{overflow-wrap:anywhere}
  .td-unv{margin-left:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
          color:var(--ink-gray-5);background:rgba(0,0,0,.05);padding:4px 8px;border-radius:var(--radius-sm);white-space:nowrap}
  .td-cites{display:flex;flex-wrap:wrap;gap:4px}
  .td-cite{font-size:12px;color:var(--ink-violet-1);background:rgba(104,70,227,.07);
           border:1px solid rgba(104,70,227,.18);padding:4px 8px;border-radius:var(--radius-sm);white-space:nowrap;cursor:default}
  .td-thin{display:flex;align-items:center;gap:8px;font-size:12px;color:#b45309;
           background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.22);padding:8px 8px;border-radius:var(--radius);margin:8px 0 4px}
  .td-audit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-gray-5);margin:16px 0 0;overflow-wrap:anywhere}
  /* trends (agent 14): velocity badge + top-voice rows */
  .tr-vel{font-weight:700;color:var(--ink-violet-1)}
  .tr-voices{display:flex;flex-direction:column;gap:8px}
  .tr-voice{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-gray-7);min-width:0}
  .tr-voice .ev-ic{flex-shrink:0}
  .tr-voice .vn{font-weight:600;color:var(--ink-gray-8);white-space:nowrap}
  .tr-voice .vw{color:var(--ink-gray-5);font-size:12px;overflow-wrap:anywhere;min-width:0}
  /* content performance (agent 12): best-time rows + cross-run trend */
  .cp-times{display:flex;flex-direction:column;gap:8px}
  .cp-time{display:flex;gap:8px;font-size:14px;color:var(--ink-gray-7);flex-wrap:wrap}
  .cp-time .cw{font-weight:600;color:var(--ink-gray-8);min-width:84px}
  .cp-time .cm{color:var(--ink-gray-5);font-size:12px}
  .cp-trend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-gray-6);margin-top:16px;overflow-wrap:anywhere}
  /* competitor intelligence — frappe-style cards */
  .ci-wrap{display:flex;flex-direction:column;gap:16px;margin-top:8px}
  .ci-card{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:var(--radius);padding:16px 16px}
  .ci-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media(max-width:720px){ .ci-grid2{grid-template-columns:1fr} }
  .ci-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-gray-5);margin:0 0 16px}
  .ci-h .fi{color:var(--ink-violet-1);display:inline-flex}
  .brand-logo{border-radius:var(--radius-sm);flex-shrink:0;object-fit:contain;background:#fff;vertical-align:middle}
  .ci-thead,.ci-trow{display:grid;grid-template-columns:24px minmax(104px,1.5fr) minmax(88px,1.25fr) 44px 88px;gap:8px;align-items:center;min-width:0}
  .ci-thead{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-gray-4);padding-bottom:8px;border-bottom:1px solid var(--outline-gray-1)}
  .ci-thead .rt{text-align:right}
  .ci-trow{padding:8px 0;border-bottom:1px solid var(--outline-gray-1);font-size:14px}
  .ci-trow:last-child{border-bottom:none;padding-bottom:0}
  .ci-rank{font-size:12px;color:var(--ink-gray-4);font-variant-numeric:tabular-nums}
  .ci-rank.r1{color:var(--ink-violet-1);font-weight:700}
  .ci-brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-gray-8);min-width:0}
  .ci-brand.you{color:var(--ink-violet-1)}
  .ci-bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci-reach{display:flex;align-items:center;gap:8px;min-width:0}
  .ci-bar{flex:1;height:7px;border-radius:var(--radius-sm);background:var(--surface-gray-3);min-width:20px}
  .ci-bar>i{display:block;height:100%;border-radius:var(--radius-sm);background:var(--ink-violet-1)}
  .ci-pct{font-size:12px;color:var(--ink-gray-7);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
  .ci-num{text-align:right;font-size:12px;color:var(--ink-gray-7);font-variant-numeric:tabular-nums}
  .ci-li{justify-self:end;font-size:12px;color:var(--ink-gray-7);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ci-li.muted{color:var(--ink-gray-4)}
  .ci-li .lic{color:#0A66C2;display:inline-flex;flex-shrink:0}
  .ci-foot{font-size:12px;color:var(--ink-gray-4);margin:16px 0 0;line-height:1.5}
  .ci-quad svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
  .ci-prov{font-size:12px;color:var(--ink-gray-5);margin:0 0 16px;line-height:1.5}
  .ci-ov{display:flex;flex-direction:column;gap:8px}
  .ci-ov-row{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--ink-gray-7);min-width:0}
  .ci-ov-row .vn{font-weight:600;color:var(--ink-gray-8);white-space:nowrap}
  .ci-ov-row .vb{color:var(--ink-gray-5);font-size:12px;overflow-wrap:anywhere;min-width:0}
  /* connectors tab */
  .conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:8px}
  .conn-card{padding:16px;display:flex;flex-direction:column;gap:8px}
  .conn-top{display:flex;align-items:center;justify-content:space-between}
  .conn-ic{color:var(--ink-violet-1);display:inline-flex}
  .conn-cat{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-gray-5)}
  .conn-name{font-size:16px;font-weight:600;color:var(--ink-gray-9);margin:0}
  .conn-btn{align-self:flex-start;gap:8px;opacity:.75;cursor:not-allowed}
  .conn-soon{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-gray-5);background:rgba(0,0,0,.05);padding:4px 8px;border-radius:var(--radius-sm)}
  /* competitor intelligence: opinionated insights */
  .ci-ins{display:flex;flex-direction:column;gap:8px}
  .ci-ins-row{display:flex;gap:8px;align-items:flex-start;min-width:0}
  .ci-ins-dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;margin-top:8px;background:var(--ink-violet-1)}
  .ci-ins-dot.win{background:var(--ink-green-2)}
  .ci-ins-dot.gap{background:#f59e0b}
  .ci-ins-h{font-weight:600;color:var(--ink-gray-9);font-size:14px;overflow-wrap:anywhere}
  .ci-ins-d{color:var(--ink-gray-6);font-size:12px;line-height:1.5;overflow-wrap:anywhere}

  /* ── accounts: auth modal + user chip ── */
  .auth-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px}
  .auth-card{position:relative;background:#fff;border:1px solid var(--outline-gray-2);border-radius:var(--radius-lg);width:100%;max-width:400px;padding:32px 32px 24px}
  .auth-mark{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-gray-9);font-size:16px;margin-bottom:16px}
  .auth-mark .m{width:30px;height:30px;border-radius:var(--radius);background:var(--ink-violet-1);color:#fff;display:inline-flex;align-items:center;justify-content:center}
  .auth-ico{width:46px;height:46px;border-radius:50%;background:var(--surface-violet-1);color:var(--ink-violet-1);display:flex;align-items:center;justify-content:center;margin:0 0 16px}
  .auth-h{font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink-gray-9);margin:0 0 8px}
  .auth-sub{font-size:14px;color:var(--ink-gray-5);line-height:1.55;margin:0 0 24px}
  .auth-sub b{color:var(--ink-gray-8)}
  .auth-label{font-size:12px;font-weight:600;color:var(--ink-gray-7);margin:0 0 8px;display:block}
  .auth-input{width:100%;height:40px;border:1px solid var(--outline-gray-3);border-radius:var(--radius);padding:0 16px;font-family:inherit;font-size:14px;color:var(--ink-gray-9);outline:none;transition:.14s;background:#fff}
  .auth-input:focus{border-color:var(--ink-violet-1);box-shadow:0 0 0 3px var(--surface-violet-1)}
  .auth-btn{display:flex;align-items:center;justify-content:center;width:100%;height:40px;border:none;border-radius:var(--radius);background:var(--ink-violet-1);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px;transition:.14s;text-decoration:none}
  .auth-btn:hover{background:#5a3bd0}
  .auth-btn:disabled{opacity:.55;cursor:not-allowed}
  .auth-note{font-size:12px;color:var(--ink-gray-5);line-height:1.5;margin:16px 0 0}
  .auth-err{font-size:12px;color:var(--ink-red-3);margin:8px 0 0;line-height:1.45}
  .auth-legal{font-size:12px;color:var(--ink-gray-4);text-align:center;margin:16px 0 0;line-height:1.5}
  .auth-x{position:absolute;top:13px;right:15px;background:none;border:none;color:var(--ink-gray-4);cursor:pointer;font-size:20px;line-height:1}
  .auth-link{color:var(--ink-violet-1);background:none;border:none;font-family:inherit;font-size:14px;cursor:pointer;padding:0;margin-top:16px}
  .auth-runrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--outline-gray-1);font-size:14px}
  .auth-runrow:last-child{border-bottom:none}
  .auth-runrow .rt{color:var(--ink-gray-9);font-weight:600;text-transform:capitalize}
  .auth-runrow .rs{color:var(--ink-gray-5);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .auth-runrow .ra{color:var(--ink-gray-4);font-size:12px;white-space:nowrap}
  .auth-empty{text-align:center;color:var(--ink-gray-5);font-size:14px;padding:24px 0;line-height:1.6}
  /* user chip + menu in the dark sidebar foot */
  .user-chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;cursor:pointer;color:var(--menu-ink-6);padding:4px;border-radius:var(--radius);transition:.13s}
  .user-chip:hover{background:var(--menu-cards)}
  .user-mono{width:30px;height:30px;border-radius:50%;background:var(--ink-violet-1);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;text-transform:uppercase}
  .user-meta{min-width:0;flex:1}
  .user-email{font-size:12px;color:var(--menu-ink-9);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-act{font-size:12px;color:var(--menu-ink-4)}
  .signin-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;padding:0 16px;border-radius:var(--radius);background:var(--ink-violet-1);color:#fff;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .signin-btn:hover{background:#5a3bd0}
  .user-menu{position:absolute;bottom:60px;left:14px;right:14px;background:var(--surface-white);border:1px solid var(--menu-line);border-radius:var(--radius);overflow:hidden}
  .user-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--menu-ink-6);padding:8px 16px;font-family:inherit;font-size:14px;cursor:pointer}
  .user-menu button:hover{background:var(--menu-cards);color:var(--menu-ink-9)}

  /* ── live signals ── */
  .conn-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;margin-bottom:16px;
              background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:var(--radius-lg)}
  .conn-strip .cs-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-gray-5);margin-right:4px}
  .conn{display:inline-flex;align-items:center;gap:8px;padding:4px 8px;border-radius:var(--radius);font-size:12px;font-weight:500;
        border:1px solid var(--outline-gray-2);background:var(--surface-gray-1);color:var(--ink-gray-7)}
  .conn .cn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--outline-gray-4)}
  .conn.ready{background:var(--surface-green-1);border-color:var(--outline-green-1);color:var(--ink-green-2)}
  .conn.ready .cn-dot{background:var(--ink-green-2)}

  .sig-srcs{display:flex;gap:8px;flex-wrap:wrap}
  .sig-src{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--outline-gray-3);
           border-radius:var(--radius);background:var(--surface-white);cursor:pointer;transition:.13s;font-size:14px;font-weight:500;
           color:var(--ink-gray-7);user-select:none}
  .sig-src:hover{border-color:var(--outline-gray-4)}
  .sig-src.on{color:#fff;border-color:transparent}
  .sig-src .ss-ic{display:inline-flex}
  .sig-src .ss-ck{margin-left:4px;opacity:.9}

  .sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
  .sig-card{display:flex;flex-direction:column;overflow:hidden}
  .sig-card.dim{background:var(--surface-gray-1)}
  .sig-head{display:flex;align-items:flex-start;gap:16px;padding:16px 16px;position:relative}
  .sig-ava{width:46px;height:46px;border-radius:var(--radius-lg);flex-shrink:0;position:relative;overflow:hidden;
           display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;letter-spacing:.02em}
  .sig-id{min-width:0;flex:1}
  .sig-plat{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
  .sig-name{font-size:16px;font-weight:600;color:var(--ink-gray-9);line-height:1.25;overflow-wrap:anywhere}
  .sig-headline{font-size:12px;color:var(--ink-gray-6);line-height:1.45;margin-top:4px;overflow-wrap:anywhere}
  .sig-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-gray-5);margin-top:8px}
  .sig-meta span{display:inline-flex;align-items:center;gap:4px}
  .sig-stats{display:flex;gap:16px;padding:16px 16px;flex-wrap:wrap}
  .sig-stat{display:flex;flex-direction:column;gap:4px}
  .sig-stat b{font-size:16px;font-weight:600;color:var(--ink-gray-9);font-family:'IBM Plex Mono',monospace}
  .sig-stat span{font-size:12px;color:var(--ink-gray-5)}

  .sig-body{padding:8px 8px;display:flex;flex-direction:column;max-height:344px;overflow-y:auto}
  .sig-act{display:flex;gap:8px;padding:8px 8px;border-radius:var(--radius);transition:.12s}
  .sig-act:hover{background:var(--surface-gray-1)}
  .sig-act-ic{width:26px;height:26px;border-radius:var(--radius);flex-shrink:0;display:flex;align-items:center;justify-content:center;
              background:var(--surface-gray-2);color:var(--ink-gray-6);margin-top:4px}
  .sig-act-main{min-width:0;flex:1}
  .sig-act-text{font-size:14px;line-height:1.5;color:var(--ink-gray-8);overflow-wrap:anywhere}
  .sig-act-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-gray-5);margin-top:4px}
  .sig-act-meta .dotsep{width:2px;height:2px;border-radius:50%;background:var(--outline-gray-4)}
  .sig-act-eng{display:inline-flex;align-items:center;gap:4px;color:var(--ink-gray-6);font-weight:500}

  .sig-empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px}
  .sig-empty .se-ic{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
                    background:var(--surface-gray-2);color:var(--ink-gray-5)}
  .sig-empty .se-title{font-size:14px;font-weight:600;color:var(--ink-gray-8)}
  .sig-empty .se-note{font-size:12px;color:var(--ink-gray-5);line-height:1.55}
  @media(max-width:560px){ .sig-grid{grid-template-columns:1fr} }

  /* ── signals: units, people roster, keyword feed, delivery, jobs ── */
  .sig-hint{font-size:12px;color:var(--ink-gray-5);margin-top:8px;line-height:1.5}
  .sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-gray-8);
         margin:24px 0 16px;text-transform:uppercase;letter-spacing:.04em}
  .sec-h .sec-ic{display:inline-flex;color:var(--ink-gray-5)}
  .sec-h .sec-n{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-gray-5)}

  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:8px}
  .rost{display:flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--outline-gray-2);
        border-radius:var(--radius-lg);background:var(--surface-cards);transition:.12s;min-width:0}
  .rost:hover{border-color:var(--outline-gray-3);background:var(--surface-gray-1)}
  .rost-ava{width:36px;height:36px;border-radius:var(--radius);flex-shrink:0;overflow:hidden;position:relative;
            display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
  .rost-id{min-width:0;flex:1}
  .rost-name{font-size:14px;font-weight:600;color:var(--ink-gray-9);overflow-wrap:anywhere;line-height:1.2}
  .rost-sub{font-size:12px;color:var(--ink-gray-5);display:inline-flex;align-items:center;gap:4px;margin-top:4px}

  .feed{display:flex;flex-direction:column;gap:0;border:1px solid var(--outline-gray-2);border-radius:var(--radius-lg);
        overflow:hidden;background:var(--surface-cards)}
  .feed-row{display:flex;gap:16px;padding:16px 16px;border-top:1px solid var(--outline-gray-2)}
  .feed-row:first-child{border-top:none}
  .feed-row:hover{background:var(--surface-gray-1)}
  .feed-plat{width:30px;height:30px;border-radius:var(--radius);flex-shrink:0;display:flex;align-items:center;
             justify-content:center;color:#fff}
  .feed-main{min-width:0;flex:1}
  .feed-text{font-size:14px;line-height:1.5;color:var(--ink-gray-8);overflow-wrap:anywhere}
  .feed-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-gray-5);margin-top:8px}
  .feed-meta .feed-au{font-weight:600;color:var(--ink-gray-7)}
  .feed-eng{display:inline-flex;align-items:center;gap:4px;color:var(--ink-gray-6);font-weight:500}

  .deliver{margin-top:16px;border:1px solid var(--outline-gray-2);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-cards)}
  .deliver-h{display:flex;align-items:center;gap:8px;padding:16px 16px;cursor:pointer;font-size:14px;
             font-weight:600;color:var(--ink-gray-8);user-select:none}
  .deliver-h:hover{background:var(--surface-gray-1)}
  .deliver-b{padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px}
  .dlv-block .dlv-lab{font-size:12px;font-weight:600;color:var(--ink-gray-7);display:flex;align-items:center;gap:8px;margin:16px 0 8px}
  .code-blk{position:relative;background:#0F0F0F;border-radius:var(--radius);padding:16px 16px;overflow-x:auto}
  .code-blk pre{margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;line-height:1.6;
                color:#E8E8E8;white-space:pre;overflow-wrap:normal}
  .code-blk .tok{color:#7FD1B9}
  .copy-mini{position:absolute;top:9px;right:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
             color:#D4D4D4;border-radius:var(--radius);padding:4px 8px;font-size:12px;font-family:inherit;cursor:pointer;
             display:inline-flex;align-items:center;gap:4px;transition:.12s}
  .copy-mini:hover{background:rgba(255,255,255,.12);color:#fff}

  .job-strip{display:flex;align-items:center;gap:8px;padding:16px 16px;border:1px solid var(--outline-blue-1);
             background:var(--surface-blue-1);border-radius:var(--radius-lg);margin-bottom:16px;flex-wrap:wrap}
  .job-strip .js-id{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-gray-6)}
  .bulk-item{border:1px solid var(--outline-gray-2);border-radius:var(--radius-lg);margin-bottom:16px;overflow:hidden;background:var(--surface-cards)}
  .bulk-head{display:flex;align-items:center;gap:8px;padding:16px 16px;cursor:pointer;user-select:none}
  .bulk-head:hover{background:var(--surface-gray-1)}
  .bulk-q{font-size:14px;font-weight:600;color:var(--ink-gray-9);overflow-wrap:anywhere}
  .bulk-sum{font-size:12px;color:var(--ink-gray-5);margin-left:auto;flex-shrink:0}
  .bulk-body{padding:16px 16px}
  @media(max-width:560px){ .sig-grid{grid-template-columns:1fr} .roster{grid-template-columns:1fr} }

  /* ── tables (Airtable/Notion-like grid) ── */
  .tbl-th{position:sticky;top:0;background:var(--surface-gray-1);z-index:3;cursor:pointer;user-select:none;
          padding:8px 8px;text-align:left;color:var(--ink-gray-5);font-weight:600;white-space:nowrap}
  .tbl-th:hover{background:var(--surface-gray-2)}
  .tbl-td{padding:8px 8px;min-width:0;overflow-wrap:anywhere;border-top:1px solid var(--outline-gray-1);vertical-align:middle}
  .cell-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .tbl-grouphead{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface-gray-1);
                 cursor:pointer;border-top:1px solid var(--outline-gray-2)}
  .tbl-menu{position:absolute;z-index:20;top:calc(100% + 6px);left:0;background:var(--surface-cards);
            border:1px solid var(--outline-gray-2);border-radius:var(--radius-lg);padding:8px;min-width:180px;
            max-height:340px;overflow-y:auto;overscroll-behavior:contain;
            animation:menuIn .12s ease-out;transform-origin:top}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  .search-mini{width:100%;border:1px solid var(--outline-gray-2);border-radius:var(--radius-sm);padding:4px 8px;
               font-size:12px;font-family:inherit;background:var(--surface-white);color:var(--ink-gray-9)}
  /* in-place cell editor: sized to the cell so clicking does NOT enlarge the row
     (Google Sheets / Airtable behaviour). Small padding, 12px, subtle focus ring. */
  .cell-edit{width:100%;box-sizing:border-box;font-family:inherit;font-size:12px;padding:4px 4px;margin:-1px 0;
             border:1px solid var(--ink-blue-2);border-radius:var(--radius-sm);background:var(--surface-white);
             color:var(--ink-gray-9);outline:none;line-height:1.4}
  textarea.cell-edit{resize:vertical;min-height:46px;line-height:1.45}
  /* every editing surface in the Tables feature stays 12px so clicking a cell
     never jumps the text size (inline editors + the row/field detail modals) */
  .tbl-frame input,.tbl-frame select,.tbl-frame textarea{font-size:12px}
  .tbl-modal .input,.tbl-modal select,.tbl-modal textarea{font-size:12px}
  /* a11y: a visible keyboard focus ring app-wide (was missing) */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [tabindex]:focus-visible, .iconbtn:focus-visible{
    outline:2px solid var(--ink-blue-2); outline-offset:1px; border-radius:var(--radius-sm)}
  /* a bare, keyboard-focusable icon button (replaces click-only <span> icons) */
  .iconbtn{background:none;border:none;margin:0;padding:4px;cursor:pointer;color:var(--ink-gray-6);
           display:inline-flex;align-items:center;line-height:0;border-radius:var(--radius-sm)}
  .iconbtn:hover{background:var(--surface-gray-2);color:var(--ink-gray-9)}
  .iconbtn:disabled{opacity:.5;cursor:default}

  /* bordered grid: a framed table with row + column separators. The whole table
     context is a uniform 12px per the type spec (cells, headers, list, board). */
  .tbl-frame{border:1px solid var(--outline-gray-2);border-radius:var(--radius);font-size:12px;display:block;width:fit-content;min-width:100%}
  .board-wrap{font-size:12px}
  /* separate (not collapse): collapse makes sticky headers flicker + drop borders
     on scroll in Chrome; separate + spacing 0 keeps the same look but scrolls clean */
  .tbl-frame table{border-collapse:separate;border-spacing:0}
  .tbl-frame table,.tbl-th,.tbl-td,.list-title,.board-card,.board-card-title{font-size:12px}
  .tbl-th{border-right:1px solid var(--outline-gray-1);border-bottom:1px solid var(--outline-gray-2)}
  .tbl-td{border-right:1px solid var(--outline-gray-1)}
  .tbl-th:last-child, .tbl-td:last-child{border-right:none}
  .tbl-frame tbody tr:hover .tbl-td{background:var(--surface-gray-1)}
  /* frozen gutter + primary column (Airtable): they stay pinned while the rest
     of the grid scrolls horizontally. Fixed gutter width so the hover swap from
     row number to actions never jitters the column. */
  /* z-index layers: body cells 0, sticky-left body cells 2, header row 3, sticky
     corners 4. Clear separation stops the corner from flickering under scroll. */
  .tbl-actcol{box-sizing:border-box;padding:8px;
              position:sticky;left:0;background:var(--surface-cards);z-index:2}
  th.tbl-actcol{z-index:4;background:var(--surface-gray-1)}
  .tbl-sticky1{position:sticky;left:80px;background:var(--surface-cards);z-index:2;
               border-right:1px solid var(--outline-gray-1)}
  th.tbl-sticky1{z-index:4}
  /* drag-and-drop reordering indicators */
  .tbl-drop-col{box-shadow:inset 3px 0 0 var(--ink-blue-2)}
  tr.tbl-droprow td{border-top:2px solid var(--ink-blue-2)}
  .tbl-rowdrag{cursor:grab}
  .tbl-rowdrag:active{cursor:grabbing}
  .tbl-th{user-select:none}
  /* column resize grip on the right edge of each header */
  .col-resize{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:6;touch-action:none}
  .col-resize::after{content:"";position:absolute;top:0;right:2px;width:2px;height:100%;background:transparent;transition:background .1s}
  .col-resize:hover::after{background:var(--ink-blue-2)}
  /* row actions are always legible (color, not a near-invisible opacity), and
     darken on row hover; delete goes red on hover */
  .tbl-row-acts{display:inline-flex;gap:8px}
  .tbl-row-acts .iconbtn{color:var(--ink-gray-5)}
  tr:hover .tbl-row-acts .iconbtn{color:var(--ink-gray-8)}
  .tbl-row-acts .acts-del:hover{color:var(--ink-red-3)}
  .tbl-newrow{display:flex;align-items:center;gap:8px;width:100%;padding:8px 16px;color:var(--ink-gray-5);
              cursor:pointer;border:none;border-top:1px solid var(--outline-gray-2);font-size:12px;
              background:none;font-family:inherit;text-align:left}
  .tbl-newrow:hover{background:var(--surface-gray-1);color:var(--ink-gray-8)}
  .tbl-mi{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:var(--radius);cursor:pointer;font-size:13px;
          white-space:nowrap;width:100%;background:none;border:none;font-family:inherit;text-align:left;
          color:var(--ink-gray-8);line-height:1.3}
  .tbl-mi:hover{background:var(--surface-gray-2)}
  .tbl-mi:active{background:var(--surface-gray-3)}
  .tbl-mi-label{display:flex;align-items:center;gap:8px;padding:4px 8px 4px;font-size:11px;font-weight:600;
                text-transform:uppercase;letter-spacing:.04em;color:var(--ink-gray-5)}
  .tbl-mi-sep{height:1px;background:var(--outline-gray-2);margin:4px 0}
  /* the active checkmark sits flush right, like a native menu */
  /* trailing indicator (check / sort caret) sits at the right edge; the old
     .msi:last-child selector also matched items whose ONLY icon was the leading
     one, shoving their icon + label to the right */
  .tbl-mi .mi-end{margin-left:auto;color:var(--ink-blue-2);display:inline-flex}
  .tbl-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:flex-start;
               justify-content:center;padding:8vh 16px;z-index:60}
  .tbl-modal{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:var(--radius-lg);
             padding:24px;width:100%;max-width:440px;max-height:80vh;overflow:auto}
  .fld{display:block;font-size:12px;color:var(--ink-gray-6);margin-bottom:16px}
  .fld input,.fld select{display:block;width:100%;margin-top:4px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* compact single-row table toolbar (Notion-style) */
  .tbl-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .tbar-btn{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 8px;border:1px solid var(--outline-gray-3);
            border-radius:var(--radius);background:var(--surface-white);color:var(--ink-gray-7);font-size:12px;
            font-family:inherit;cursor:pointer;white-space:nowrap}
  .tbar-btn:hover{background:var(--surface-gray-1)}
  .tbar-btn.on{background:var(--surface-blue-1);border-color:var(--outline-blue-1);color:var(--ink-blue-2)}
  /* passive toolbar indicator (row count): styled like a button but inert */
  .tbar-chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 8px;border:1px solid var(--outline-gray-2);
             border-radius:var(--radius);background:var(--surface-gray-1);color:var(--ink-gray-6);font-size:14px;white-space:nowrap}
  /* ghost filler rows: spreadsheet-style empty grid below the data; a click adds a row */
  .tbl-ghostrow{cursor:pointer}
  .tbl-ghostrow .tbl-td{height:41px}
  /* toggle switch (columns menu show/hide) */
  .tswitch{width:32px;height:18px;border-radius:var(--radius-pill);border:none;background:var(--outline-gray-3);
           position:relative;cursor:pointer;flex-shrink:0;padding:0;transition:background .15s}
  .tswitch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
                  background:#fff;transition:left .15s}
  .tswitch.on{background:var(--ink-blue-2)}
  .tswitch.on::after{left:16px}
  /* toolbar controls are UI chrome, not table data, so they sit at the 14px base
     (Table / List / Board / JSON / Group / Fields / Search / New) */
  .tbl-bar .seg button,.tbl-bar .tbar-btn,.tbl-bar .btn,.tbl-bar .search input{font-size:14px}
  .tbl-bar .tbar-btn{padding:0 8px}
  /* Airtable-style two-pane: inner view sidebar + full-bleed grid */
  .tbl-shell{display:flex;height:calc(100vh - 56px);overflow:hidden}
  .tbl-viewbar{width:212px;flex-shrink:0;border-right:1px solid var(--outline-gray-2);background:var(--surface-gray-1);
               display:flex;flex-direction:column;gap:8px;padding:16px 8px;overflow-y:auto}
  .tbl-vb-title{font-size:15px;font-weight:600;color:var(--ink-gray-9);margin:0;cursor:text;padding:4px 8px;border-radius:var(--radius-sm);
                display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit}
  .tbl-vb-title:hover{background:var(--surface-gray-3)}
  .tbl-vb-search{background:var(--surface-white);border-color:var(--outline-gray-2)}
  .tbl-vb-search input{width:100%}
  .tbl-vb-list{display:flex;flex-direction:column;gap:4px}
  .tbl-vitem{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:var(--radius);border:none;background:none;
             font-family:inherit;font-size:14px;color:var(--ink-gray-7);cursor:pointer;text-align:left;width:100%}
  .tbl-vitem:hover{background:var(--surface-gray-3)}
  .tbl-vitem.on{background:var(--surface-blue-1);color:var(--ink-blue-2);font-weight:600}
  .tbl-mainpane{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-white)}
  .tbl-frame{background:var(--surface-white)}
  .tbl-mainpane .tbl-bar{margin:0;padding:8px 16px;border-bottom:1px solid var(--outline-gray-2);flex-shrink:0}
  .tbl-scroll{flex:1;overflow:auto;padding:16px 16px}
  .tbl-foot{flex-shrink:0;border-top:1px solid var(--outline-gray-2);padding:8px 16px;font-size:12px;color:var(--ink-gray-5)}
  /* row-number gutter: number at rest, actions on hover (Airtable) */
  /* number and actions occupy the SAME grid cell and cross-fade on hover (opacity,
     not display) so moving the cursor across rows never triggers a reflow */
  /* gutter: [checkbox <-> row number overlay] + hover actions. The checkbox
     replaces the number on hover or while selected (Airtable behaviour). */
  .gutter-stack{display:flex;align-items:center;gap:4px}
  .gs-left{display:grid;place-items:center start;width:16px;flex-shrink:0}
  .gs-left > *{grid-area:1/1}
  .tbl-rowck{width:14px;height:14px;margin:0;accent-color:var(--ink-violet-1);cursor:pointer}
  tbody .tbl-rowck{opacity:0;transition:opacity .1s}
  tbody tr:hover .tbl-rowck, tbody .tbl-rowck:checked{opacity:1}
  tbody tr:hover .tbl-rownum, tbody tr.rowsel .tbl-rownum{opacity:0}
  .tbl-frame tbody tr.rowsel .tbl-td{background:var(--surface-blue-1)}
  .tbl-rownum{color:var(--ink-gray-5);font-size:11px;font-variant-numeric:tabular-nums;padding-left:4px;
              opacity:1;transition:opacity .1s}
  .tbl-actcol .tbl-row-acts{opacity:0;pointer-events:none;transition:opacity .1s}
  tr:hover .tbl-rownum{opacity:0}
  tr:hover .tbl-actcol .tbl-row-acts{opacity:1;pointer-events:auto}
  /* list view */
  .list-row{display:flex;align-items:center;gap:16px;padding:8px 16px;border-top:1px solid var(--outline-gray-2)}
  .list-row:first-child{border-top:none}
  .list-row:hover{background:var(--surface-gray-1)}
  .list-title{background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-gray-9);
              cursor:pointer;text-align:left;padding:0;min-width:130px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list-title:hover{color:var(--ink-violet-1)}
  .list-props{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0;font-size:12px}
  .list-prop{display:inline-flex;align-items:center;gap:4px}
  .list-plabel{color:var(--ink-gray-5);font-size:12px}
  /* board / kanban view */
  .board-wrap{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
  .board-lane{flex:0 0 260px;background:var(--surface-gray-1);border:1px solid var(--outline-gray-2);border-radius:var(--radius);padding:8px}
  .board-lane.drop-over{border-color:var(--ink-blue-2);background:var(--surface-blue-1)}
  .board-lanehead{display:flex;align-items:center;gap:8px;padding:4px 4px 8px}
  .board-cards{display:flex;flex-direction:column;gap:8px}
  .board-card{background:var(--surface-cards);border:1px solid var(--outline-gray-2);border-radius:var(--radius);padding:8px 8px;cursor:grab}
  .board-card:active{cursor:grabbing}
  .board-card-title{background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-gray-9);
                    cursor:pointer;text-align:left;padding:0;flex:1;overflow-wrap:anywhere}
  .board-card-title:hover{color:var(--ink-violet-1)}
  .board-field{margin-top:8px;font-size:12px}

  /* ── responsive: drop the floating frame, sidebar becomes a top strip ── */
  @media(max-width:900px){
    html,body{height:auto}
    body{overflow:auto;background:var(--surface-gray-1)}
    .app{height:auto}
    .sidebar{position:static;inset:auto;width:100%;height:auto;flex-direction:row;align-items:center;
             border:none;border-bottom:1px solid var(--menu-line);border-radius:0;box-shadow:none;overflow-x:auto}
    .side-brand{padding:16px 16px;flex-shrink:0}
    .side-nav{display:flex;align-items:center;gap:4px;padding:8px 8px;overflow-x:visible}
    .side-label{display:none}
    .side-item{white-space:nowrap;padding:8px 16px}
    .side-item.on::before{display:none}
    .side-item.on{box-shadow:inset 0 0 0 1px var(--menu-line)}
    .side-foot{display:none}
    .main{position:static;inset:auto;margin:0;border-radius:0;box-shadow:none;overflow:visible;min-height:100vh}
    .tbl-shell{height:calc(100vh - 56px)}
    .view-h1{font-size:20px}
  }
  @media(max-width:560px){
    .view{padding:24px 16px 48px} .topbar{padding:0 16px}
    .side-item .si-name{display:none}
  }
</style>
</head>
