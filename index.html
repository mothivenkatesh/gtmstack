/* Competitor intelligence: share of voice, a 2x2 market-positioning plot, and
   the voices shared across competitors. Plain SVG, no chart library. */
function CompeteResult(o){
  const sov=o.share_of_voice||[];
  const pos=o.positioning||[];
  const ic=(plat)=>(PLAT_META[plat]||['globe',plat])[0];
  const fmtDate=(iso)=>{ if(!iso) return '?'; try{ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return '?'; } };
  const dr=o.date_range||{};
  const maxReach=Math.max(1,...sov.map(r=>r.reach_pct));
  const maxVol=Math.max(1,...pos.map(p=>p.x_volume));
  const maxEng=Math.max(1,...pos.map(p=>p.y_engagement));
  const W=400,H=280,pad=40;
  const px=(v)=>pad+(v/maxVol)*(W-2*pad);
  const py=(v)=>H-pad-(v/maxEng)*(H-2*pad);
  const liCell=(r)=>{ const l=r.linkedin||{};
    if(l.followers_h) return html`<span class="ci-li"><span class="lic"><${Icon} name="linkedin" size=13 /></span>${l.followers_h}</span>`;
    if(l.staff_h)     return html`<span class="ci-li muted"><span class="lic"><${Icon} name="linkedin" size=13 /></span>~${l.staff_h} staff</span>`;
    return html`<span class="ci-li muted">—</span>`;
  };
  const anyLi=sov.some(r=>r.linkedin&&(r.linkedin.followers_h||r.linkedin.staff_h));
  return html`
    <div class="ci-wrap">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="pill pill-gray"><${Icon} name="radar" size=12 /> ${(o.brands||[]).length} brands · live read</span>
      </div>
      ${(o.insights||[]).length?html`<div class="ci-card">
        <div class="ci-h"><span class="fi"><${Icon} name="sparkles" size=14 /></span>What this means</div>
        <div class="ci-ins">${o.insights.map(i=>html`
          <div class="ci-ins-row">
            <span class=${'ci-ins-dot '+(i.kind||'')}></span>
            <div style="min-width:0"><div class="ci-ins-h">${i.headline}</div><div class="ci-ins-d">${i.detail}</div></div>
          </div>`)}</div>
      </div>`:null}
      <div class="ci-card">
        <div class="ci-h"><span class="fi"><${Icon} name="chartLine" size=14 /></span>Share of voice</div>
        <div class="ci-thead">
          <span></span><span>Brand</span><span>Reach</span><span class="rt">Posts</span><span class="rt">LinkedIn</span>
        </div>
        ${sov.map(r=>html`
          <div class="ci-trow">
            <span class=${'ci-rank'+(r.rank===1?' r1':'')}>${r.rank}</span>
            <span class=${'ci-brand'+(r.you?' you':'')}>${Logo(domainOf(r.brand),16)}<span class="ci-bn">${r.brand}</span></span>
            <span class="ci-reach"><span class="ci-bar"><i style=${'width:'+Math.max(3,r.reach_pct/maxReach*100)+'%'}></i></span><span class="ci-pct">${r.reach_pct}%</span></span>
            <span class="ci-num">${r.posts}</span>
            ${liCell(r)}
          </div>`)}
        <p class="ci-foot">Reach is each brand's share of total engagement.${anyLi?'':' LinkedIn follower counts need a connected LinkedIn session.'}</p>
      </div>
      <div class="ci-grid2">
        <div class="ci-card ci-quad">
          <div class="ci-h"><span class="fi"><${Icon} name="target" size=14 /></span>Market positioning</div>
          <svg viewBox=${'0 0 '+W+' '+H} role="img" aria-label="positioning quadrant">
            <line x1=${W/2} y1=${pad-8} x2=${W/2} y2=${H-pad+8} stroke="var(--outline-gray-2)" stroke-width="1"/>
            <line x1=${pad-8} y1=${H/2} x2=${W-pad+8} y2=${H/2} stroke="var(--outline-gray-2)" stroke-width="1"/>
            <text x=${W-pad} y=${pad-14} text-anchor="end" font-size="10" fill="var(--ink-gray-4)">LEADER</text>
            <text x=${pad} y=${pad-14} text-anchor="start" font-size="10" fill="var(--ink-gray-4)">PUNCHING ABOVE</text>
            <text x=${W-pad} y=${H-pad+22} text-anchor="end" font-size="10" fill="var(--ink-gray-4)">AGGRESSIVE</text>
            <text x=${pad} y=${H-pad+22} text-anchor="start" font-size="10" fill="var(--ink-gray-4)">STARTER</text>
            <text x=${W/2} y=${H-4} text-anchor="middle" font-size="9" fill="var(--ink-gray-4)">post volume</text>
            <text x="10" y=${H/2} text-anchor="middle" font-size="9" fill="var(--ink-gray-4)" transform=${'rotate(-90 10 '+(H/2)+')'}>engagement / post</text>
            ${pos.map(p=>{ const x=px(p.x_volume), y=py(p.y_engagement);
              const anchor=x<pad+34?'start':x>W-pad-34?'end':'middle';
              const ly=y<pad+24?y+16:y-11; return html`<g>
              <circle cx=${x} cy=${y} r=${p.you?7:5} fill=${p.you?'var(--ink-violet-1)':'var(--ink-gray-5)'} opacity=${p.you?1:.72}/>
              <text x=${x} y=${ly} text-anchor=${anchor} font-size="10.5" font-weight=${p.you?700:500} fill=${p.you?'var(--ink-violet-1)':'var(--ink-gray-7)'}>${p.brand}</text>
            </g>`; })}
          </svg>
        </div>
        ${(o.overlap||[]).length?html`<div class="ci-card">
          <div class="ci-h"><span class="fi"><${Icon} name="users" size=14 /></span>Shared voices · engage these</div>
          <div class="ci-ov">${o.overlap.map(v=>html`
            <div class="ci-ov-row">
              <span class="ev-ic"><${Icon} name=${ic(v.platform)} size=15 /></span>
              <span class="vn">@${v.author}</span>
              <span class="vb">talks about ${v.brands.join(', ')} · ${v.shared_across} brands</span>
            </div>`)}</div>
        </div>`:null}
      </div>
      <div class="ci-card">
        <div class="ci-h"><span class="fi"><${Icon} name="sealCheck" size=14 /></span>What was scanned</div>
        <p class="ci-prov">${dr.total||0} posts, realtime, ${dr.earliest?html`<b>${fmtDate(dr.earliest)}</b> to <b>${fmtDate(dr.latest)}</b>`:'dates unavailable'}${dr.dated?(' ('+dr.dated+' dated)'):''}. The most-engaged of them:</p>
        <div class="ev-list">${(o.evidence||[]).slice(0,6).map(e=>html`
          <div class="ev-post">
            <span class="ev-ic"><${Icon} name=${ic(e.platform)} size=15 /></span>
            <div class="ev-body">
              <div class="ev-meta">${Logo(domainOf(e.brand),13)} ${e.brand} · ${e.platform}${e.author?(' · @'+e.author):''}${e.ago?(' · '+e.ago):''}</div>
              <div class="ev-text">${e.text}</div>
            </div>
          </div>`)}</div>
        <p class="ci-foot">Built from public posts and mentions across X, GitHub, YouTube, and Reddit, not scraped engager lists. LinkedIn shows audience size from each brand's public company page.</p>
      </div>
    </div>`;
}

/* ════════════════════════ TOOL 1 — PERSONA PREVIEW ════════════════════════ */
function PersonaTool({seed}){
  const [ctype, setCtype]   = useState('landing');
  const [copy, setCopy]     = useState('');
  const [selected, setSel]  = useState(PERSONAS.map(p=>p.id));
  const [loading, setLoad]  = useState(false);
  const [data, setData]     = useState(null);
  const [error, setErr]     = useState(null);

  const toggle = id => setSel(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);

  async function preview(opts = {}){
    const text = (opts.text ?? copy).trim();
    const type = opts.type || ctype;
    const who  = opts.personas || selected;
    if(!text){ setErr('Paste some copy first.'); return; }
    if(who.length===0){ setErr('Pick at least one developer to react.'); return; }
    setLoad(true); setErr(null);
    if(opts.text){ setCopy(text); setCtype(type); }
    try{
      const r = await fetch(`${API_BASE}/api/persona`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text, type, personas:who}),
      });
      const j = await r.json();
      if(!r.ok){ setErr(j.error || 'Request failed.'); setData(null); }
      else setData(j);
    }catch(e){ setErr('Could not reach the engine. Is the local server running on :5000?'); }
    setLoad(false);
  }

  useEffect(()=>{ if(seed && seed.tool==='persona' && seed.payload){
    preview({text:seed.payload.copy, type:seed.payload.ctype||'landing'}); } }, [seed]);

  return html`
  <div class="view">
    <div class="view-head">
      <h1 class="view-h1">Catch the copy that kills your launch, before launch day</h1>
      <p class="view-sub">Paste a headline, email, or ad. Five synthetic developers tell you what they’d think, and the fix worth the most.</p>
    </div>

    <div class="glass-card" style="padding:20px;margin-bottom:18px">
      <label class="field-label">1 · What kind of copy is this?</label>
      <div class="seg" style="margin-bottom:18px">
        ${CTYPES.map(([id,label])=>html`
          <button class=${ctype===id?'on':''} onClick=${()=>setCtype(id)}>${label}</button>`)}
      </div>

      <label class="field-label">2 · Paste your copy</label>
      <textarea class="copy-area" placeholder="e.g. Add payments to your app in 15 minutes. One install, six lines of code, live today..."
        value=${copy} onInput=${e=>setCopy(e.target.value)}></textarea>
      <div style="margin-top:9px;font-size:12px;color:var(--ink-gray-5)">
        Not sure what to try?
        <a style="color:var(--ink-blue-2);cursor:pointer;text-decoration:underline"
           onClick=${()=>{setCopy(SAMPLE_COPY);setCtype('landing');}}>Load sample landing-page copy</a>
      </div>

      <label class="field-label" style="margin-top:18px">3 · Who should react? <span style="font-weight:400;color:var(--ink-gray-5)">(${selected.length} selected)</span></label>
      <div class="pchips">
        ${PERSONAS.map(p=>html`
          <div class=${'pchip'+(selected.includes(p.id)?' on':'')} onClick=${()=>toggle(p.id)} title=${p.tag}>
            <span class="pe">${p.emoji}</span><span class="pn">${p.name}</span>
            <span class="pck"><${Icon} name="check" size=14 /></span>
          </div>`)}
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap">
        <button class="btn btn-primary btn-lg" disabled=${loading} onClick=${preview}>
          ${loading ? html`<${Icon} name="loader" size=15 cls="spin" /> Reading reactions` : html`<${Icon} name="sparkles" size=15 /> Preview reactions`}
        </button>
        <span style="font-size:12px;color:var(--ink-gray-5)">Simulated reactions to sharpen your copy. Not real people.</span>
      </div>
    </div>

    ${error && html`<div class="errbox" style="margin-bottom:18px">
      <${Icon} name="alert" size=18 />
      <div><div style="font-weight:600;margin-bottom:2px">Couldn’t run the preview</div>
      <div style="font-size:14px;opacity:.85">${error}</div></div>
    </div>`}

    ${loading && !data && html`
      <div class="glass-card" style="padding:22px;margin-bottom:14px;display:flex;gap:18px">
        <div class="skel" style="height:48px;width:48px;border-radius:10px"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:9px;justify-content:center">
          <div class="skel" style="height:14px;width:40%"></div><div class="skel" style="height:10px;width:70%"></div></div>
      </div>
      <div class="pcard-grid">
        ${[0,1,2].map(()=>html`<div class="glass-card pcard"><div class="skel" style="height:46px;width:60%"></div>

/* ════════════════════════ TOOL 2 — CONTENT EXTRACTOR ════════════════════════ */
const TRANSLATE_TARGETS = [['','Original'],['hi','Hindi'],['es','Spanish'],['fr','French'],['de','German'],['ja','Japanese'],['zh-Hant','Chinese'],['ar','Arabic'],['pt','Portuguese'],['ru','Russian']];

function ExtractTool({seed}){
  const [url, setUrl] = useState('');
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [view, setView] = useState('stamped');
  const [query, setQuery] = useState('');
  const [tlang, setTlang] = useState('');
  const [copied, setCopied] = useState(false);
  const bodyRef = useRef();

  async function run(opts = {}){
    const u = (opts.url ?? url).trim();
    if(!u){ setError('Paste a YouTube link first.'); return; }
    setLoading(true); setError(null); if(opts.url) setUrl(u);
    const p = new URLSearchParams({ url: u });
    if(opts.lang) p.set('lang', opts.lang);
    if(opts.translate) p.set('translate', opts.translate);
    try{
      const r = await fetch(`${API_BASE}/api/transcript?` + p.toString());
      const j = await r.json();
      if(!r.ok){ setError(j.error || 'Request failed.'); if(!opts.lang && !opts.translate) setData(null); }
      else { setData(j); setQuery(''); if(bodyRef.current) bodyRef.current.scrollTop = 0; }
    }catch(e){ setError('Could not reach the extractor. Is the local server running on :5000?'); }
    setLoading(false);
  }

  useEffect(()=>{ if(seed && seed.tool==='extract' && seed.payload){ run({url:seed.payload.url}); } }, [seed]);

  const cues = data?.cues || [];
  const q = query.trim().toLowerCase();
  const filtered = useMemo(()=> q ? cues.filter(c=>c.text.toLowerCase().includes(q)) : cues, [cues, q]);
  const plainText = useMemo(()=> filtered.map(c=>c.text).join(' '), [filtered]);

  function hl(text){
    if(!q) return text;
    const parts = text.split(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'ig'));
    return parts.map(p => p.toLowerCase()===q ? html`<mark>${p}</mark>` : p);
  }
  function copyAll(){
    const t = view==='stamped' ? filtered.map(c=>`[${c.ts}] ${c.text}`).join('\n') : plainText;
    navigator.clipboard.writeText(t); setCopied(true); setTimeout(()=>setCopied(false),1400);
  }
  function downloadFile(){
    const t = view==='stamped' ? filtered.map(c=>`[${c.ts}] ${c.text}`).join('\n') : plainText;
    const blob = new Blob([t], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${data.video_id}.${view==='stamped'?'timestamped':'plain'}.txt`;
    a.click(); URL.revokeObjectURL(a.href);
  }

  return html`
  <div class="view">
    <div class="view-head">
      <h1 class="view-h1">Write in your market’s exact words, lifted from any video</h1>
      <p class="view-sub">Paste any link and get a timestamped transcript in seconds, ready to mine for the exact words your market uses.</p>
    </div>

    <div class="glass-card" style="padding:20px;margin-bottom:18px">
      <label class="field-label">Paste a YouTube link</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input class="input" style="flex:1;min-width:240px" placeholder="A watch, youtu.be, shorts, or embed link (or a video ID)"
          value=${url} onInput=${e=>setUrl(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&run()} />
        <button class="btn btn-primary btn-lg" disabled=${loading} onClick=${()=>run()}>
          ${loading ? html`<${Icon} name="loader" size=15 cls="spin" /> Pulling text` : html`<${Icon} name="captions" size=15 /> Get transcript`}
        </button>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--ink-gray-5)">
        Try a sample:
        <a style="color:var(--ink-blue-2);cursor:pointer;text-decoration:underline" onClick=${()=>run({url:'https://www.youtube.com/watch?v=T1Lowy1mnEg'})}>youtube.com/watch?v=T1Lowy1mnEg</a>
      </div>
    </div>

    ${error && html`<div class="errbox" style="margin-bottom:18px">
      <${Icon} name="alert" size=18 />
      <div><div style="font-weight:600;margin-bottom:2px">Couldn’t fetch that transcript</div>
      <div style="font-size:14px;opacity:.85">${error}</div></div>
    </div>`}

    ${loading && !data && html`<div class="kpi-grid" style="margin-bottom:18px">
      ${[0,1,2,3].map(()=>html`<div class="glass-card kpi"><div class="skel" style="height:13px;width:60%"></div><div class="skel" style="height:24px;width:75%"></div></div>`)}
    </div>`}

    ${data && html`
      <div class="kpi-grid" style="margin-bottom:16px">
        ${[
          ['Words', (data.word_count||0).toLocaleString(), 'type'],
          ['Duration', data.duration_ts, 'clock'],
          ['Segments', (data.cues.length||0).toLocaleString(), 'hash'],
        ].map(([l,v,ic])=>html`<div class="glass-card kpi">
          <div class="kpi-top"><span class="kpi-label">${l}</span><span class="chip"><${Icon} name=${ic} size=14 /></span></div>
          <div class="kpi-value">${v}</div>
        </div>`)}
        <div class="glass-card kpi">
          <div class="kpi-top"><span class="kpi-label">Source</span><span class="chip"><${Icon} name="captions" size=14 /></span></div>
          <div style="display:flex;align-items:center;gap:7px;margin-top:2px">
            <span class=${'pill '+(data.kind==='manual'?'pill-green':data.kind==='translated'?'pill-amber':'pill-blue')}>
              ${data.kind==='manual'?'Manual subs':data.kind==='translated'?'Translated':'Auto (ASR)'}
            </span>
            <span class="mono" style="font-size:12px;color:var(--ink-gray-6)">${data.code}</span>
          </div>
        </div>
      </div>

      <div class="glass-card" style="padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:600;color:var(--ink-gray-5)">TRACKS</span>
        <div style="display:flex;gap:7px;flex-wrap:wrap;flex:1">
          ${data.tracks.map(t=>html`<button class=${'track'+(t.code===data.code&&!data.translated_to?' on':'')} onClick=${()=>run({lang:t.code})}>
            ${t.code} <span class=${'pill '+(t.kind==='manual'?'pill-green':'pill-blue')} style="padding:1px 6px;font-size:12px">${t.kind==='manual'?'manual':'ASR'}</span>
          </button>`)}
        </div>
        <div style="display:flex;align-items:center;gap:7px">
          <${Icon} name="globe" size=14 />
          <select class="input" style="width:auto;padding:7px 26px 7px 10px;font-size:12px" value=${tlang} onChange=${e=>setTlang(e.target.value)}>
            ${TRANSLATE_TARGETS.map(([c,n])=>html`<option value=${c}>${n}</option>`)}
          </select>
          <button class="btn btn-ghost btn-sm" disabled=${loading||!tlang} onClick=${()=>run({translate:tlang})}>Translate</button>
        </div>
      </div>

      <div class="glass-card">
        <div class="panel-head">
          <div class="seg">
            <button class=${view==='stamped'?'on':''} onClick=${()=>setView('stamped')}><${Icon} name="list" size=13 /> Timestamped</button>
            <button class=${view==='plain'?'on':''} onClick=${()=>setView('plain')}><${Icon} name="type" size=13 /> Plain text</button>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="search"><${Icon} name="search" size=14 />
              <input placeholder="Search…" value=${query} onInput=${e=>setQuery(e.target.value)} /></div>
            <button class="btn btn-ghost btn-sm" onClick=${copyAll}>
              <${Icon} name=${copied?'check':'copy'} size=13 /> ${copied?'Copied':'Copy'}
            </button>
            <button class="btn btn-ghost btn-sm" onClick=${downloadFile}><${Icon} name="download" size=13 /> .txt</button>
          </div>
        </div>
        <div class="tbody" ref=${bodyRef}>
          ${filtered.length===0 && html`<div style="padding:24px;text-align:center;color:var(--ink-gray-5);font-size:14px">No lines match “${query}”.</div>`}
          ${view==='stamped'
            ? filtered.map(c=>html`<div class="cue"><span class="cue-ts mono">${c.ts}</span><span class="cue-text">${hl(c.text)}</span></div>`)
            : html`<div class="plain">${query ? hl(plainText) : plainText}</div>`}
        </div>
      </div>
      <p style="font-size:12px;color:var(--ink-gray-4);margin-top:10px;text-align:center">
        video <span class="mono">${data.video_id}</span> · ${data.tracks.length} track(s) available · fetched for you, no API key
      </p>`}

    ${!data && !loading && !error && html`
      <div class="note note-blue"><${Icon} name="zap" size=16 />
        <div>This reads YouTube’s own caption track, so most spoken-word videos return text in a second or two.
          Uploaded video or audio files are not supported here: those need a separate speech-to-text service.</div>
      </div>`}
  </div>`;
}

const ACT_ICON = {post:'pen', comment:'message', reply:'message', share:'refresh', repost:'refresh', like:'star',
  commit:'code', pr:'code', issue:'alert', star:'star', fork:'refresh', create:'plus', release:'zap', video:'film',

/* Three lookup units. Each has its own source set + framing. Person resolves a
   single footprint; company adds the people who work there; keyword is a live
   mentions feed. The source order per unit matches the engine's adapters. */
const UNIT_META = {
  person:  {icon:'userSearch', label:'Person',  sources:['github','reddit','linkedin','x','youtube'],
            ph:'A handle or profile URL (GitHub, Reddit, LinkedIn, X, or YouTube)',
            bulkPh:'One handle or profile URL per line', cta:'Find footprint',
            hint:'Who someone is and what they posted most recently across their channels.'},
  company: {icon:'building',   label:'Company', sources:['github','linkedin','x','reddit','youtube'],
            ph:'A company name or domain, e.g. stripe.com',
            bulkPh:'One company name or domain per line', cta:'Map the company',

  keyword: {icon:'hash',       label:'Keyword', sources:['github','x','reddit','youtube','trustpilot','quora'],
            ph:'A topic or phrase to track, e.g. model context protocol',
            bulkPh:'One topic or phrase per line', cta:'Track mentions',
            hint:'A live mentions feed: what is being said about this right now.'},
};
const initialsOf = s => ((s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('') || '?').toUpperCase();
const joinDots = nodes => nodes.filter(Boolean).flatMap((n,i)=> i ? [html`<span class="dotsep"></span>`, n] : [n]);

/* Classify the search box. Signals keys off a handle or profile URL, never a
   display name (no source resolves "First Last"). A pasted profile link routes
   straight to its one source. Returns one of:
   {kind:'empty'} | {kind:'url', platform, handle} | {kind:'url-unknown'}
   | {kind:'email', value} | {kind:'handle', value} | {kind:'name', value} */
function parseQuery(raw){
  const q = (raw || '').trim();
  if(!q) return {kind:'empty'};
  if(/^https?:\/\//i.test(q) || /\b(?:github|linkedin|reddit|x|twitter|youtube)\.com\//i.test(q)){
    const host = (q.match(/(github|linkedin|reddit|x|twitter|youtube)\.com/i) || [])[1];
    if(host){
      const h = host.toLowerCase();
      const path = q.replace(/^https?:\/\//i,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
      if(h === 'github'){ const m = path.match(/github\.com\/([^\/]+)/i);
             if(m && !/^(orgs|topics|search|marketplace|sponsors|features|about|pricing|collections|trending|notifications|settings|explore)$/i.test(m[1])) return {kind:'url', platform:'github', handle:m[1]}; }
      else if(h === 'linkedin'){ const m = path.match(/\/in\/([^\/]+)/i); if(m) return {kind:'url', platform:'linkedin', handle:decodeURIComponent(m[1])}; }
      else if(h === 'reddit'){ const m = path.match(/\/(?:user|u)\/([^\/]+)/i); if(m) return {kind:'url', platform:'reddit', handle:m[1]}; }
      else if(h === 'youtube'){ const m = path.match(/youtube\.com\/(?:@|c\/|user\/|channel\/)?([^\/]+)/i);
             if(m && !/^(watch|results|feed|playlist|shorts|hashtag|embed)$/i.test(m[1])) return {kind:'url', platform:'youtube', handle:m[1].replace(/^@/,'')}; }
      else { const seg = path.split('/').slice(1).find(Boolean);
             if(seg && !/^(i|home|search|hashtag|explore|messages|notifications)$/i.test(seg)) return {kind:'url', platform:'x', handle:seg.replace(/^@/,'')}; }
    }
    return {kind:'url-unknown'};
  }
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(q)) return {kind:'email', value:q};
  if(!/\s/.test(q)) return {kind:'handle', value:q.replace(/^@/,'')};
  return {kind:'name', value:q};
}

      : html`<div class="sig-empty">

/* Render one lookup payload by its unit. */
function UnitResult({payload, onPick}){
  if(payload.unit === 'keyword')

  return html`
    <div class="sig-grid">${(payload.sources||[]).map(s=>html`<${SignalCard} s=${s} />`)}</div>

/* One row of a bulk job result: a query with its payload, collapsed by default. */
function BulkItem({item, onPick}){
  const [open, setOpen] = useState(false);
  const p = item.payload;
  const sum = item.error ? 'error'
    : p.unit==='keyword' ? `${(p.feed||[]).length} mentions`
    : p.unit==='company' ? `${p.summary.platforms_found}/${p.summary.platforms_searched} sources · ${(p.people||[]).length} people`
    : `${p.summary.platforms_found}/${p.summary.platforms_searched} sources matched`;
  return html`<div class="bulk-item">
    <div class="bulk-head" onClick=${()=>!item.error && setOpen(o=>!o)}>
      <${Icon} name=${item.error?'alert':(open?'minus':'plus')} size=14 />
      <span class="bulk-q">${item.query}</span>
      <span class="bulk-sum">${sum}</span>
    </div>
    ${open && !item.error && html`<div class="bulk-body"><${UnitResult} payload=${p} onPick=${onPick} /></div>`}
    ${item.error && html`<div class="bulk-body" style="font-size:12px;color:var(--ink-red-3)">${item.error}</div>`}
  </div>`;
}

  const [webhook, setWebhook] = useState('');
  const [deliver, setDeliver] = useState(false);
  const [copied, setCopied]   = useState(false);
  const [loading, setLoading] = useState(false);
  const [data, setData]       = useState(null);
  const [job, setJob]         = useState(null);
  const [error, setError]     = useState(null);
  const [conn, setConn]       = useState(null);

  useEffect(()=>{
    fetch(`${API_BASE}/api/signals`).then(r=>r.json()).then(j=>setConn(j.sources||null)).catch(()=>{});
  }, []);

  const um = UNIT_META[unit];
  const chosen = um.sources.filter(s=>sel[s] !== false);   // every unit source on unless explicitly toggled off
  const isBulk = data && data.items;

  function pickUnit(u){
    if(u === unit) return;
    setUnit(u); setData(null); setJob(null); setError(null); setBulk(false);
    setSel({});   // {} means every source for the new unit is on by default
    if(u !== 'person') setAdv(false);
  }

  function buildSingleBody(force){
    if(unit === 'person'){
      const advHandle = adv && Object.values(handles).some(v=>v && v.trim());
      const parsed = parseQuery(query);
      if(parsed.kind === 'empty' && !advHandle) return {error:'Enter a handle or a profile URL.'};
      if(parsed.kind === 'name' && !advHandle){ setAdv(true);
        return {error:"That looks like a topic or full name. People are looked up by handle or profile link. To see live mentions of it, search it as a keyword."}; }
      if(parsed.kind === 'email' && !advHandle)
        return {error:"Email lookup needs an enrichment source we have not wired yet. Paste a profile URL or type a handle for now."};
      if(parsed.kind === 'url-unknown' && !advHandle)
        return {error:"That link is not a supported source. Use a GitHub, Reddit, LinkedIn, X, or YouTube profile URL, or type a handle."};
      if(parsed.kind === 'url')
        return {body:{ unit, query: parsed.handle, sources:[parsed.platform], handles:{[parsed.platform]: parsed.handle}, force }};
      if(chosen.length === 0) return {error:'Pick at least one source to look in.'};
      const q = parsed.kind === 'handle' ? parsed.value : query.trim();
      return {body:{ unit, query:q, sources:chosen, handles: adv ? handles : undefined, force }};
    }
    if(!query.trim()) return {error: unit==='company' ? 'Enter a company name or domain.' : 'Enter a topic or phrase to track.'};
    if(chosen.length === 0) return {error:'Pick at least one source.'};
    return {body:{ unit, query: query.trim(), sources:chosen, force }};
  }

  async function pollJob(id){
    for(let i=0;i<45;i++){
      await new Promise(res=>setTimeout(res, 1100));
      try{ const r = await fetch(`${API_BASE}/api/jobs?id=${id}`); const j = await r.json();
        if(j.status === 'done' || j.status === 'error') return j; }catch(e){}
    }
    return null;
  }

  async function runJob(body){
    setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/jobs`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      let j = await r.json(); setJob(j);
      if(j.status !== 'done' && j.status !== 'error') j = await pollJob(j.id);
      if(!j){ setError('Job timed out. Try a smaller batch or retry.'); setLoading(false); return; }
      setJob(j);
      if(j.status === 'error') setError(j.error || 'Job failed.');
      else setData(j.result);
    }catch(e){ setError('Could not reach the jobs API. Is the local server running on :5000?'); }
    setLoading(false);
  }

  async function run(force=false){
    setError(null); setJob(null);
    if(bulk){
      const queries = bulkText.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!queries.length){ setError('Add at least one query, one per line.'); return; }
      if(chosen.length === 0){ setError('Pick at least one source.'); return; }
      return runJob({ kind:'bulk', unit, queries, sources:chosen, force,
                      webhook: webhook.trim() || undefined });
    }
    const b = buildSingleBody(force);
    if(b.error){ setError(b.error); return; }
    if(webhook.trim())
      return runJob({ kind:'lookup', ...b.body, webhook: webhook.trim() });
    setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/signals`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(b.body)});
      const j = await r.json();
      if(!r.ok) setError(j.error || 'Lookup failed.'); else setData(j);
    }catch(e){ setError('Could not reach Signals. Is the local server running on :5000?'); }
    setLoading(false);
  }

  /* bridge: run the current query as a Keyword lookup (offered when a person/company
     search of a topic phrase comes back empty or errors) */
  async function searchAsKeyword(){
    const q = query.trim(); if(!q) return;
    setUnit('keyword'); setBulk(false); setAdv(false); setSel({});
    setError(null); setJob(null); setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/signals`, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({unit:'keyword', query:q, sources: UNIT_META.keyword.sources})});
      const j = await r.json();
      if(!r.ok) setError(j.error||'Lookup failed.'); else setData(j);
    }catch(e){ setError('Could not reach Signals. Is the local server running on :5000?'); }
    setLoading(false);
  }

  /* Build a sel map ({source: bool}) covering every source of the unit, so no
     source (e.g. youtube) is left undefined and silently defaulted on. */
  function selFor(u, on){
    const m = {};
    (UNIT_META[u].sources || []).forEach(s => { m[s] = on(s); });
    return m;
  }

  async function pickPerson(p){
    setUnit('person'); setBulk(false); setAdv(false); setWebhook('');
    setSel(selFor('person', s => s === p.platform));
    setQuery(p.handle); setError(null); setJob(null); setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/signals`, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({unit:'person', query:p.handle, sources:[p.platform], handles:{[p.platform]:p.handle}})});
      const j = await r.json();
      if(!r.ok) setError(j.error||'Lookup failed.'); else setData(j);
    }catch(e){ setError('Could not reach Signals.'); }
    setLoading(false);
  }

  /* Pre-fill + run live from a Home template. Fetches with explicit params (like
     pickPerson) so it never waits on async state flushes. */
  async function seedLookup(p){
    const u = p.unit || 'person';
    const srcs = p.sources || UNIT_META[u].sources;
    setUnit(u); setBulk(false); setAdv(false); setWebhook(''); setJob(null); setError(null);
    setSel(selFor(u, s => srcs.includes(s)));
    setQuery(p.query); setLoading(true); setData(null);
    try{
      const r = await fetch(`${API_BASE}/api/signals`, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({unit:u, query:p.query, sources:srcs})});
      const j = await r.json();
      if(!r.ok) setError(j.error||'Lookup failed.'); else setData(j);
    }catch(e){ setError('Could not reach Signals. Is the local server running on :5000?'); }
    setLoading(false);
  }

  useEffect(()=>{ if(seed && seed.tool==='signals' && seed.payload){ seedLookup(seed.payload); } }, [seed]);

  async function exportResult(fmt){
    let id = job && job.id;
    if(!id){
      const b = buildSingleBody(false);
      if(b.error){ setError(b.error); return; }
      try{
        const r = await fetch(`${API_BASE}/api/jobs`, {method:'POST',
          headers:{'Content-Type':'application/json'}, body: JSON.stringify({kind:'lookup', ...b.body})});
        let j = await r.json();
        if(j.status !== 'done' && j.status !== 'error') j = await pollJob(j.id);
        if(!j || j.status === 'error'){ setError('Export failed.'); return; }
        id = j.id; setJob(j);
      }catch(e){ setError('Export failed.'); return; }
    }
    window.open(`${API_BASE}/api/jobs?id=${id}&format=${fmt}`, '_blank');
  }

  function apiSnippet(){
    const base = API_BASE || location.origin;
    if(bulk){
      const qs = bulkText.split('\n').map(s=>s.trim()).filter(Boolean);
      const body = {kind:'bulk', unit, queries: qs.length?qs:['query-1','query-2'], sources:chosen};
      if(webhook.trim()) body.webhook = webhook.trim();
      return `curl -X POST ${base}/api/jobs \\\n  -H 'Content-Type: application/json' \\\n  -d '${JSON.stringify(body)}'`;
    }
    const wh = webhook.trim();
    const endpoint = wh ? '/api/jobs' : '/api/signals';
    const body = wh ? {kind:'lookup', unit, query: query.trim()||'query', sources:chosen, webhook:wh}
                    : {unit, query: query.trim()||'query', sources:chosen};
    return `curl -X POST ${base}${endpoint} \\\n  -H 'Content-Type: application/json' \\\n  -d '${JSON.stringify(body)}'`;
  }
  function copySnippet(){ navigator.clipboard.writeText(apiSnippet()); setCopied(true); setTimeout(()=>setCopied(false),1400); }

  const summary = data && !isBulk && html`
    <div style="font-size:14px;color:var(--ink-gray-6)">
      ${unit==='keyword'
        ? html`<b style="color:var(--ink-gray-9)">${(data.feed||[]).length}</b> live mentions across ${data.summary.platforms_found} of ${data.summary.platforms_searched} sources`
        : html`<b style="color:var(--ink-gray-9)">${data.summary.platforms_found}</b> of ${data.summary.platforms_searched} sources matched${
            unit==='company' ? html` · <b style="color:var(--ink-gray-9)">${data.summary.people_found||0}</b> people` : ''}${
            data.summary.latest_activity_ago ? html` · last seen <b style="color:var(--ink-gray-9)">${data.summary.latest_activity_ago}</b>` : ''}`}
    </div>`;

  return html`
  <div class="view">
    <div class="view-head">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
        <span class="pill pill-blue"><${Icon} name="radar" size=12 /> Real-time</span>
        <span class="pill pill-gray"><${Icon} name="cpu" size=12 /> Agent-ready</span>
      </div>
      <h1 class="view-h1">Reach people the moment they do something worth mentioning</h1>
      <p class="view-sub">Look up a person, company, or keyword and get real-time activity across GitHub, Reddit, LinkedIn, X, and YouTube. The same fresh context a human reads or an AI agent calls.</p>
    </div>

    ${conn && html`
      <div class="conn-strip">
        <span class="cs-label">Sources</span>
        ${SIG_ORDER.map(s=>{ const c = conn[s] || {}; const m = SIG_META[s];
          return html`<span class=${'conn' + (c.ready ? ' ready' : '')} title=${c.note || ''}>
            <span class="cn-dot"></span>
            <span style=${`color:${m.color};display:inline-flex`}><${Icon} name=${m.icon} size=13 /></span>
            ${m.label}
            <span style="color:var(--ink-gray-4);font-weight:400">· ${c.ready ? 'connected' : 'public'}</span>
          </span>`; })}
      </div>`}

    <div class="glass-card" style="padding:20px;margin-bottom:18px">
      <div class="seg" style="margin-bottom:14px">
        ${Object.entries(UNIT_META).map(([u,m])=>html`<button class=${unit===u?'on':''} onClick=${()=>pickUnit(u)}>
          <${Icon} name=${m.icon} size=14 /> ${m.label}</button>`)}
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px">
        <label class="field-label" style="margin:0">${bulk
          ? (unit==='person'?'Handles or profile URLs':unit==='company'?'Companies':'Topics') + ', one per line'
          : (unit==='person'?'Who are you looking up?':unit==='company'?'Which company?':'What do you want to track?')}</label>
        <button class="btn btn-ghost btn-sm" onClick=${()=>{ setBulk(b=>!b); setData(null); setJob(null); setError(null); }}>
          <${Icon} name=${bulk?'userSearch':'list'} size=13 /> ${bulk?'Single lookup':'Bulk list'}
        </button>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">
        ${bulk
          ? html`<textarea class="copy-area" style="flex:1;min-width:240px;min-height:96px"
              placeholder=${um.bulkPh} value=${bulkText} onInput=${e=>setBulkT(e.target.value)}></textarea>`
          : html`<input class="input" style="flex:1;min-width:240px" placeholder=${um.ph}
              value=${query} onInput=${e=>setQuery(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&run(false)} />`}
        <button class="btn btn-primary btn-lg" disabled=${loading} onClick=${()=>run(false)}>
          ${loading
            ? html`<${Icon} name="loader" size=15 cls="spin" /> Working`
            : html`<${Icon} name=${um.icon} size=15 /> ${bulk ? 'Run batch' : um.cta}`}
        </button>
      </div>
      <div class="sig-hint">${um.hint}${bulk ? ' Bulk runs as an async job you can poll, webhook, or export.' : ''}</div>

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px">
        <span class="field-label" style="margin:0">Look in</span>
        <div class="sig-srcs">
          ${um.sources.map(s=>{ const m = SIG_META[s]; const on = sel[s] !== false;
            return html`<span class=${'sig-src' + (on ? ' on' : '')} style=${on ? `background:${m.color}` : ''}
              onClick=${()=>setSel(p=>({...p, [s]: p[s]===false}))}>
              <span class="ss-ic"><${Icon} name=${m.icon} size=14 /></span> ${m.label}
              ${on && html`<span class="ss-ck"><${Icon} name="check" size=13 /></span>`}
            </span>`; })}
        </div>
        ${unit==='person' && !bulk && html`<span style="flex:1"></span>
          <button class="btn btn-ghost btn-sm" onClick=${()=>setAdv(a=>!a)}>
            <${Icon} name=${adv?'minus':'plus'} size=13 /> ${adv ? 'Using exact handles' : 'Know their exact handles?'}
          </button>`}
      </div>

      ${unit==='person' && !bulk && adv && html`
        <div class="sig-adv" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px">
          ${um.sources.map(s=>{ const m = SIG_META[s];
            return html`<div>
              <label class="field-label" style="display:flex;align-items:center;gap:6px">
                <span style=${`color:${m.color};display:inline-flex`}><${Icon} name=${m.icon} size=13 /></span> ${m.label}
              </label>
              <input class="input" placeholder=${m.label + ' handle'} value=${handles[s]}
                onInput=${e=>setHandles(p=>({...p, [s]:e.target.value}))} onKeyDown=${e=>e.key==='Enter'&&run(false)} />
            </div>`; })}
        </div>`}
    </div>

    <div class="deliver">
      <div class="deliver-h" onClick=${()=>setDeliver(d=>!d)}>
        <${Icon} name="webhook" size=15 /> Delivery: API, webhook, bulk export
        <span style="margin-left:auto;color:var(--ink-gray-4)"><${Icon} name=${deliver?'minus':'plus'} size=14 /></span>
      </div>
      ${deliver && html`<div class="deliver-b">
        <div class="dlv-block">
          <div class="dlv-lab"><${Icon} name="code" size=13 /> Call it from an agent</div>
          <div class="code-blk">
            <button class="copy-mini" onClick=${copySnippet}><${Icon} name=${copied?'check':'copy'} size=12 /> ${copied?'Copied':'Copy'}</button>
            <pre>${apiSnippet()}</pre>
          </div>
        </div>
        <div class="dlv-block">
          <div class="dlv-lab"><${Icon} name="webhook" size=13 /> Webhook (optional)</div>
          <input class="input" placeholder="https://your-app.com/hooks/signals" value=${webhook}
            onInput=${e=>setWebhook(e.target.value)} />
          <div class="sig-hint">Set a URL and the lookup runs as an async job that POSTs the finished result to it. Leave blank for an inline read.</div>
        </div>
        <div class="dlv-block">
          <div class="dlv-lab"><${Icon} name="download" size=13 /> Bulk export</div>
          <div style="display:flex;gap:9px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" disabled=${!data} onClick=${()=>exportResult('csv')}><${Icon} name="download" size=13 /> Export CSV</button>
            <button class="btn btn-ghost btn-sm" disabled=${!data} onClick=${()=>exportResult('json')}><${Icon} name="download" size=13 /> Export JSON</button>
          </div>
          <div class="sig-hint">Exports the current result through the jobs API, so a CSV matches exactly what an agent would receive.</div>
        </div>
      </div>`}
    </div>

    ${error && html`<div class="errbox" style="margin:18px 0">
      <${Icon} name="alert" size=18 />
      <div style="flex:1;min-width:0"><div style="font-weight:600;margin-bottom:2px">Couldn't run that lookup</div>
      <div style="font-size:14px;opacity:.85">${error}</div>
      ${unit!=='keyword' && query.trim() && html`<button class="btn btn-primary btn-sm" style="margin-top:10px" onClick=${searchAsKeyword}>
        <${Icon} name="hash" size=13 /> Search "${query.trim()}" as a keyword</button>`}</div>
    </div>`}

    ${job && html`<div class="job-strip" style="margin-top:18px">
      <span class="pill ${job.status==='done'?'pill-green':job.status==='error'?'pill-amber':'pill-blue'}">
        <${Icon} name=${job.status==='done'?'check':job.status==='error'?'alert':'loader'} size=12 cls=${job.status==='running'||job.status==='queued'?'spin':''} />
        ${job.status}</span>
      <span style="font-size:12px;color:var(--ink-gray-7)">Async ${job.kind} job</span>
      <span class="js-id">${job.id ? job.id.slice(0,12) : ''}</span>
      ${job.webhook && html`<span style="font-size:12px;color:var(--ink-gray-5)"><${Icon} name="webhook" size=11 /> webhook set</span>`}
    </div>`}

    ${loading && !job && !data && html`<div class="sig-grid" style="margin-top:18px">
      ${(chosen.length?chosen:[0,1,2]).map(()=>html`<div class="glass-card sig-card">
        <div class="sig-head">
          <div class="skel" style="width:46px;height:46px;border-radius:11px"></div>
          <div style="flex:1"><div class="skel" style="height:13px;width:55%;margin-bottom:9px"></div>
            <div class="skel" style="height:11px;width:85%"></div></div>
        </div>
        <div class="sig-body">${[0,1,2].map(()=>html`<div class="sig-act">
          <div class="skel" style="width:26px;height:26px;border-radius:7px;flex-shrink:0"></div>
          <div style="flex:1"><div class="skel" style="height:11px;width:94%;margin-bottom:6px"></div>
            <div class="skel" style="height:9px;width:42%"></div></div></div>`)}</div>
      </div>`)}
    </div>`}

    ${isBulk && html`
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px">
        <div style="font-size:14px;color:var(--ink-gray-6)">
          Batch of <b style="color:var(--ink-gray-9)">${data.count}</b> ${data.unit} lookups</div>
        <span style="flex:1"></span>
        <button class="btn btn-ghost btn-sm" onClick=${()=>exportResult('csv')}><${Icon} name="download" size=13 /> Export CSV</button>
      </div>
      ${data.items.map(it=>html`<${BulkItem} item=${it} onPick=${pickPerson} />`)}`}

    ${data && !isBulk && html`
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px">
        ${summary}
        ${data.cached && html`<span class="pill pill-amber"><${Icon} name="clock" size=11 /> Cached</span>`}
        <span style="flex:1"></span>
        <button class="btn btn-ghost btn-sm" disabled=${loading} onClick=${()=>run(true)}>
          <${Icon} name="refresh" size=13 cls=${loading?'spin':''} /> Refresh
        </button>
      </div>
      <${UnitResult} payload=${data} onPick=${pickPerson} />`}

    ${!data && !loading && !job && !error && html`
      <div class="note note-blue" style="margin-top:18px"><${Icon} name="zap" size=16 />
        <div>Every source is read live at lookup time, so you see what was posted today, not a stale export. GitHub and YouTube
          read with zero config; LinkedIn and X read richest with a connected session. One source being quiet never blocks the rest.</div>
      </div>`}
  </div>`;
}

/* ════════════════════════ TOOL 5 — CLEAN DATA ════════════════════════ */
const VERDICT_PILL = {deliverable:'pill-green', valid:'pill-green', risky:'pill-amber',
  undeliverable:'pill-red', invalid:'pill-red'};
const CLEAN_SAMPLE = ['founder@acme.com','FOUNDER@acme.com','info@stripe.com',
  'sales@mailinator.com','jane@gmial.com','not-an-email','hello@cashfree.com'].join('\n');

function CleanTool({seed}){
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [cleanOnly, setCleanOnly] = useState(false);
  const [query, setQuery] = useState('');
  const [copied, setCopied] = useState(false);
  const [deliver, setDeliver] = useState(false);
  const fileRef = useRef();
  const bodyRef = useRef();

  async function run(opts = {}){
    const t = (opts.text ?? text).trim();
    if(!t){ setError('Paste or upload some email addresses first.'); return; }
    setLoading(true); setError(null); if(opts.text) setText(t);
    try{
      const r = await fetch(`${API_BASE}/api/clean`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text: t }) });
      const j = await r.json();
      if(!r.ok){ setError(j.error || 'Validation failed.'); }
      else { setData(j); setCleanOnly(false); setQuery(''); if(bodyRef.current) bodyRef.current.scrollTop = 0; }
    }catch(e){ setError('Could not reach the validator. Is the local server running on :5000?'); }
    setLoading(false);
  }
  function onFile(e){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => { setText(String(reader.result || '')); setError(null); };
    reader.readAsText(f); e.target.value = '';
  }

  useEffect(()=>{ if(seed && seed.tool==='clean' && seed.payload){ run({text:seed.payload.text}); } }, [seed]);

  const rows = data?.rows || [];
  const sm = data?.summary;
  const q = query.trim().toLowerCase();
  const shown = useMemo(()=>{
    let r = cleanOnly ? rows.filter(x=>x.valid) : rows;
    return q ? r.filter(x=>(x.email||'').toLowerCase().includes(q)) : r;
  }, [rows, cleanOnly, q]);

  function csvText(only){
    const f = data.fields;
    const esc = v => { v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const rr = only ? rows.filter(x=>x.valid) : rows;
    return [f.join(','), ...rr.map(r=>f.map(k=>esc(r[k])).join(','))].join('\n');
  }
  function dl(kind){
    const only = cleanOnly;
    const body = kind==='csv' ? csvText(only)
      : JSON.stringify(only ? rows.filter(x=>x.valid) : rows, null, 2);
    const blob = new Blob([body], {type: kind==='csv'?'text/csv;charset=utf-8':'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `clean-emails${only?'.sendable':''}.${kind}`;
    a.click(); URL.revokeObjectURL(a.href);
  }
  function apiSnippet(){
    const base = API_BASE || location.origin;
    const body = { text: 'founder@acme.com, info@stripe.com, x@mailinator.com' };
    return `curl -X POST ${base}/api/clean \\\n  -H 'Content-Type: application/json' \\\n`
      + `  -d '${JSON.stringify(body)}'\n\n`

function PlayRunner({card, onBack, autoRun=true}){
  const seed = {};
  card.inputs.forEach(f=>{ seed[f.key] = f.default!=null ? f.default
    : (f.options ? (f.options[0][0]!=null?f.options[0][0]:f.options[0]) : ''); });
  const [vals, setVals]    = useState(seed);
  const [loading, setLoad] = useState(false);
  const [error, setErr]    = useState('');
  const [res, setRes]      = useState(null);
  const resRef             = useRef(null);
  const setVal = (k,v)=> setVals(p=>({...p,[k]:v}));

  async function run(input){
    const data = input || vals;
    const miss = card.inputs.find(f=> f.required && !String(data[f.key]||'').trim());
    if(miss){ setErr(`Enter ${miss.label.toLowerCase()} to run this play.`); return; }
    setLoad(true); setErr(''); setRes(null);
    try{
      const r = await fetch(`${API_BASE}/api/plays`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({play: card.id, input: data}),
      });
      const j = await r.json();
      if(!r.ok){ setErr(j.error || 'The play could not run.'); }
      else setRes(j);
    }catch(e){ setErr('Could not reach the engine. Is the local server running on :5000?'); }
    setLoad(false);
  }

  /* Auto-run on open with the sample so one card click shows a full result.
     Disabled for standalone tools (e.g. Competitor Intel) where a heavy scan
     should only start when the user clicks Run. */
  useEffect(()=>{ if(autoRun) run(seed); }, []);

  /* When a result lands and its tail is below the fold, scroll to it so the
     multi-step output is what the user sees, not the form they just submitted.
     Instant, not smooth: late-loading icons shift layout and cancel a smooth
     animation, leaving the page parked on the form. */
  useEffect(()=>{
    if(res && resRef.current && resRef.current.getBoundingClientRect().bottom > innerHeight)
      requestAnimationFrame(()=> resRef.current && resRef.current.scrollIntoView({block:'start'}));
  }, [res]);

  return html`
  <div class="view">
    ${onBack && html`<button class="play-back" onClick=${onBack}><${Icon} name="arrowLeft" size=14 /> All plays</button>`}
    <div class="view-head">
      <h1 class="view-h1">${card.title}</h1>
      <p class="view-sub">${card.desc}</p>
    </div>

    <div class="glass-card" style="padding:20px;margin-bottom:18px">
      ${card.inputs.map(f=> html`
        <div>
          <label class="field-label">${f.label}</label>
          ${f.type==='seg'
            ? html`<div class="seg" style="margin:0 0 18px">
                ${f.options.map(([id,label])=>html`
                  <button class=${vals[f.key]===id?'on':''} onClick=${()=>setVal(f.key,id)}>${label}</button>`)}
              </div>`
            : html`<input class="input" style="width:100%;margin-bottom:18px" placeholder=${f.placeholder||''}
                value=${vals[f.key]||''} onInput=${e=>setVal(f.key,e.target.value)}
                onKeyDown=${e=>e.key==='Enter'&&run()} />`}
        </div>`)}
      <button class="btn btn-primary btn-lg" disabled=${loading} onClick=${()=>run()}>
        ${loading ? html`<${Icon} name="loader" size=15 cls="spin" /> Running play` : html`<${Icon} name="play" size=15 /> Run play`}
      </button>
    </div>

    ${error && html`<div class="errbox" style="margin-bottom:18px">
      <${Icon} name="alert" size=18 />
      <div><div style="font-weight:600;margin-bottom:2px">Couldn’t run the play</div>
      <div style="font-size:14px;opacity:.85">${error}</div></div>
    </div>`}

    ${loading && !res && html`
      <div class="glass-card" style="padding:22px;display:flex;gap:14px;margin-bottom:14px">
        <div class="skel" style="height:26px;width:26px;border-radius:50%;flex-shrink:0"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:9px;justify-content:center">
          <div class="skel" style="height:14px;width:35%"></div><div class="skel" style="height:10px;width:60%"></div></div>
      </div>`}

    ${res && html`<div class="stack" ref=${resRef}>
      ${res.steps.map((s,i)=>{ const err=s.status==='error'; const last=i===res.steps.length-1; return html`
        <div class="step">
          <div class="step-rail">
            <div class=${'step-dot'+(err?' err':'')}>${err?html`<${Icon} name="alert" size=14 />`:i+1}</div>
            ${!last && html`<div class="step-line"></div>`}
          </div>
          <div class="step-body">
            <div class="step-label">${s.label}</div>
            <div class="step-sum">${s.summary}</div>
            ${s.tool==='extract'  && s.output && s.output.preview && html`<div class="tprev">${s.output.preview}</div>`}
            ${s.tool==='persona'  && s.status==='ok' && s.output && PersonaResult(s.output)}
            ${s.tool==='signals'  && s.output && SignalsEvidence(s.output)}
            ${s.tool==='teardown' && s.status==='ok' && s.output && TeardownResult(s.output)}
            ${s.tool==='trends'   && s.status==='ok' && s.output && TrendResult(s.output)}
            ${s.tool==='contentperf' && s.status==='ok' && s.output && ContentPerfResult(s.output)}
            ${s.tool==='compete'  && s.status==='ok' && s.output && CompeteResult(s.output)}
          </div>
        </div>`; })}
    </div>`}
  </div>`;
}

function Auth({open, onClose, initialErr}){
  const [email, setEmail] = useState('');
  const [stage, setStage] = useState('entry');   // entry | sent | dev
  const [busy, setBusy]   = useState(false);
  const [err, setErr]     = useState('');
  const [link, setLink]   = useState('');
  useEffect(()=>{ if(open){ setStage('entry'); setErr(initialErr||''); setBusy(false); } }, [open]);
  if(!open) return null;
  const submit = async () => {
    if(busy || !email) return;
    setBusy(true); setErr('');
    try{
      const r = await fetch('/api/auth', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'request', email})});
      const d = await r.json();
      if(d.mode==='dev' && d.link){ setLink(d.link); setStage('dev'); }
      else if(d.ok){ setStage('sent'); }
      else setErr(d.error || 'Could not send the link. Try again.');
    }catch(e){ setErr('Network error. Try again.'); }
    setBusy(false);
  };
  return html`
    <div class="auth-backdrop" onClick=${e=>{ if(e.target.classList.contains('auth-backdrop')) onClose(); }}>
      <div class="auth-card">
        <button class="auth-x" onClick=${onClose} aria-label="Close">×</button>
        ${stage==='entry' && html`
          <div class="auth-mark"><span class="m"><${Icon} name="target" size=16 /></span>GTMstack</div>
          <h2 class="auth-h">Sign in to GTMstack</h2>
          <p class="auth-sub">No password. We email you a one-time sign-in link.</p>

function agoFrom(iso){
  if(!iso) return '';
  const t = Date.parse(iso); if(isNaN(t)) return '';
  const s = Math.max(0,(Date.now()-t)/1000);
  if(s<3600) return Math.round(s/60)+'m ago';
  if(s<86400) return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}

}
function dateBand(iso){
  if(!iso || Number.isNaN(Date.parse(iso))) return '';
  const d = new Date(iso), t = new Date(); t.setHours(0,0,0,0);
  if(d < t) return 'overdue';
  if((d - t) <= 7*864e5) return 'soon';

}

/* Per-type behaviour. render/editor live in Cell (dispatch on type); TYPE_META
   stays pure data: an icon, a matches(cell,filter,col) and a compare(a,b,col)
   that always sorts empties last (the sort wrapper re-pins on desc). */
const TYPE_META = {
  text: {icon:'textAa',
    matches:(v,q)=>String(v??'').toLowerCase().includes(String(q).toLowerCase()),
    compare:(a,b)=>String(a??'').localeCompare(String(b??''))},
  longtext: {icon:'textAa',
    matches:(v,q)=>String(v??'').toLowerCase().includes(String(q).toLowerCase()),
    compare:(a,b)=>String(a??'').localeCompare(String(b??''))},
  url: {icon:'globe',
    matches:(v,q)=>String(v??'').toLowerCase().includes(String(q).toLowerCase()),
    compare:(a,b)=>String(a??'').localeCompare(String(b??''))},
  number: {icon:'hash',
    matches:(v,q)=>{
      const s=String(q).trim();
      let m;
      if((m=s.match(/^>\s*(-?\d+\.?\d*)$/))) return typeof v==='number' && v>parseFloat(m[1]);
      if((m=s.match(/^<\s*(-?\d+\.?\d*)$/))) return typeof v==='number' && v<parseFloat(m[1]);
      if((m=s.match(/^(-?\d+\.?\d*)\s*-\s*(-?\d+\.?\d*)$/))) return typeof v==='number' && v>=parseFloat(m[1]) && v<=parseFloat(m[2]);
      return String(v??'').includes(s);
    },
    compare:(a,b)=>(a==null?0:a)-(b==null?0:b)},
  select: {icon:'tag',
    matches:(v,q,col)=> Array.isArray(q) ? q.includes(v) : (optOf(col,v)?.label||String(v??'')).toLowerCase().includes(String(q).toLowerCase()),
    compare:(a,b,col)=>{
      const ix=id=>{ const i=(col.options||[]).findIndex(o=>o.id===id); return i<0?(col.options||[]).length:i; };
      return ix(a)-ix(b);
    }},
  multi_select: {icon:'list',
    matches:(v,q,col)=>{ const arr=Array.isArray(v)?v:[];
      return Array.isArray(q) ? arr.some(id=>q.includes(id))
        : arr.some(id=>(optOf(col,id)?.label||id).toLowerCase().includes(String(q).toLowerCase())); },
    compare:(a,b)=>((Array.isArray(a)?a.length:0)-(Array.isArray(b)?b.length:0))},
  date: {icon:'calendar',
    matches:(v,q)=>String(v??'').includes(String(q)),
    compare:(a,b)=>{ const pa=Date.parse(a), pb=Date.parse(b);
      if(Number.isNaN(pa)&&Number.isNaN(pb)) return 0;
      if(Number.isNaN(pa)) return 1; if(Number.isNaN(pb)) return -1; return pa-pb; }},
  checkbox: {icon:'check',
    matches:(v,q)=>{ const s=String(q).toLowerCase();
      if(['true','yes','1'].includes(s)) return v===true;
      if(['false','no','0'].includes(s)) return v===false; return true; },
    compare:(a,b)=>(a?1:0)-(b?1:0)},
};

/* a filesystem-safe unique column key from a label */
function uniqueKey(base, cols){
  let k = String(base||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'field';
  const used = new Set(cols.map(c=>c.key)); let n=k, i=2;
  while(used.has(n)){ n=k+'_'+i; i++; }
  return n;
}
/* migrate a cell value when its column type changes, so no data is silently lost */
function coerceValue(v, toType){
  if(toType==='number'){ const n=parseFloat(v); return Number.isFinite(n)?n:null; }
  if(toType==='checkbox') return !!v && v!=='false' && v!=='0';
  if(toType==='multi_select') return Array.isArray(v) ? v : (_isEmpty(v)?[]:[String(v)]);
  if(toType==='select') return Array.isArray(v) ? (v[0]??'') : (_isEmpty(v)?'':String(v));
  if(toType==='date'){ const s=String(v??''); return Number.isNaN(Date.parse(s))?'':s.slice(0,10); }
  if(Array.isArray(v)) return v.join(', ');
  if(v==null) return ''; if(typeof v==='boolean') return v?'true':'';
  return String(v);
}

function validateDb(obj){
  try{
    if(!obj || typeof obj!=='object' || Array.isArray(obj)) return {ok:false, err:'The JSON must be an object with cols and rows.'};
    if(!Array.isArray(obj.cols) || !Array.isArray(obj.rows)) return {ok:false, err:'Both cols and rows must be arrays.'};
    const seen=new Set();
    for(const c of obj.cols){
      if(!c || typeof c.key!=='string' || !c.key) return {ok:false, err:'Every column needs a non-empty key.'};
      if(seen.has(c.key)) return {ok:false, err:'Duplicate column key: '+c.key}; seen.add(c.key);
      if(!TYPE_META[c.type]) return {ok:false, err:'Unknown column type: '+String(c.type)};
      if(typeof c.label!=='string' || !c.label) c.label=c.key;
      c.hidden=!!c.hidden; c.width=Number(c.width)||160;
      if(c.type==='select'||c.type==='multi_select'){
        if(!Array.isArray(c.options)) c.options=[];
        c.options=c.options.map(o=>({id:String(o.id), label:String(o.label??o.id), color:TBL_COLORS.has(o.color)?o.color:'gray'}));
      }
    }
    const rows=obj.rows.map(r=>({...r, _id:(r&&r._id)||newId()}));
    return {ok:true, db:{name:String(obj.name||'Table'), cols:obj.cols, rows}};
  }catch(e){ return {ok:false, err:'Could not read that JSON.'}; }
}

/* ── column create/edit modal (name, type, and select options) ── */
function FieldEditor({col, onSave, onClose}){
  const [draft,setDraft]=useState(()=> col
    ? {label:col.label, type:col.type, format:col.format||'', options:(col.options||[]).map(o=>({...o}))}
    : {label:'', type:'text', format:'', options:[]});
  const setD=(k,v)=> setDraft(o=>({...o,[k]:v}));
  const needsOpts = draft.type==='select' || draft.type==='multi_select';
  const addOpt=()=> setDraft(o=>({...o, options:[...(o.options||[]), {id:newId(), label:'Option', color:TBL_PALETTE[(o.options?.length||0)%TBL_PALETTE.length]}]}));
  const setOpt=(i,k,v)=> setDraft(o=>({...o, options:o.options.map((op,j)=>j===i?{...op,[k]:v}:op)}));
  const delOpt=i=> setDraft(o=>({...o, options:o.options.filter((_,j)=>j!==i)}));
  function save(){
    const def={label:(draft.label||'').trim()||'Untitled', type:draft.type};
    if(needsOpts) def.options=(draft.options||[]).map(o=>({id:o.id||newId(), label:(o.label||'').trim()||'Option', color:TBL_COLORS.has(o.color)?o.color:'gray'}));
    if(draft.type==='number' && draft.format) def.format=draft.format;
    onSave(def);
  }
  return html`<div class="tbl-overlay" onMouseDown=${onClose}>
    <div class="tbl-modal" role="dialog" aria-modal="true" aria-label=${col?'Edit field':'New field'}
      onMouseDown=${e=>e.stopPropagation()} onKeyDown=${e=>{if(e.key==='Escape')onClose();}}>
      <div style="font-weight:600;margin-bottom:14px">${col?'Edit field':'New field'}</div>
      <label class="fld">Name<input class="input" value=${draft.label} autofocus onInput=${e=>setD('label',e.target.value)}/></label>
      <label class="fld">Type<select class="input" value=${draft.type} onChange=${e=>setD('type',e.target.value)}>
        ${TBL_TYPES.map(t=>html`<option value=${t.id} selected=${t.id===draft.type}>${t.label}</option>`)}</select></label>
      ${draft.type==='number' && html`<label class="fld">Format<select class="input" value=${draft.format} onChange=${e=>setD('format',e.target.value)}>
        <option value="" selected=${!draft.format}>Plain number</option><option value="currency" selected=${draft.format==='currency'}>Currency (₹)</option></select></label>`}
      ${col && col.type!==draft.type && html`<div style="font-size:12px;color:var(--ink-amber-2);margin:2px 0 8px"><${Icon} name="alert" size=12/> Changing type converts existing values.</div>`}
      ${needsOpts && html`<div style="margin-top:6px">
        <div style="font-size:12px;color:var(--ink-gray-6);margin-bottom:6px">Options</div>
        ${(draft.options||[]).map((o,i)=>html`<div key=${o.id} style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
          <span class=${'pill '+pillFor(o.color)} style="min-width:54px;text-align:center">${o.label||'…'}</span>
          <input class="input" style="flex:1" value=${o.label} onInput=${e=>setOpt(i,'label',e.target.value)}/>
          <select class="input" style="width:92px" value=${o.color} onChange=${e=>setOpt(i,'color',e.target.value)}>
            ${TBL_PALETTE.map(c=>html`<option value=${c} selected=${c===o.color}>${c}</option>`)}</select>
          <span style="cursor:pointer;color:var(--ink-gray-5)" onClick=${()=>delOpt(i)}><${Icon} name="trash" size=13/></span></div>`)}
        <button class="pill pill-gray" style="cursor:pointer;border:1px solid var(--outline-gray-2)" onClick=${addOpt}><${Icon} name="plus" size=11/> Add option</button></div>`}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
        <button class="pill pill-gray" style="cursor:pointer;border:1px solid var(--outline-gray-2)" onClick=${onClose}>Cancel</button>
        <button class="pill pill-blue" style="cursor:pointer;border:none" onClick=${save}><${Icon} name="check" size=12/> Save</button></div>
    </div></div>`;
}

/* ── per-column header dropdown ── */
function ColumnMenu({col, filterVal, setFilter, onSortDir, onEdit, onHide, onDelete, onClose}){

    <div class="tbl-mi-label"><${Icon} name="funnel" size=12/> Filter</div>

    <div class="tbl-mi-sep"></div>
    ${item('caretUp','Sort ascending',()=>onSortDir('asc'))}
    ${item('caretDown','Sort descending',()=>onSortDir('desc'))}
